<!doctype html>
<meta charset="utf-8">
<title>teste da funcao pluggy-cdbs</title>
<style>body{font:13px ui-monospace,Consolas,monospace;background:#111;color:#ddd;padding:16px}
pre{white-space:pre-wrap}</style>
<pre id="out">rodando...</pre>
<script>
// Roda a Edge Function supabase/functions/pluggy-cdbs/index.ts INTEIRA no navegador,
// com Deno e a API da Pluggy falsos. So dado inventado (repo publico).
const log = []; let falhas = 0;
function ok(cond, msg){ log.push((cond ? "PASS  " : "FALHA ") + msg); if (!cond) falhas++; return cond; }
function igual(a, b, msg){
  const ja = JSON.stringify(a), jb = JSON.stringify(b);
  ok(ja === jb, msg + (ja === jb ? "" : " (obtido " + ja + ", esperado " + jb + ")"));
}
function fim(){
  document.getElementById("out").textContent = log.join("\n") +
    "\n\n=== " + (falhas === 0 ? "TUDO PASSOU" : falhas + " FALHA(S)") + " === (" + log.length + " asserções)";
}
// JWT falso: so o payload importa (no Supabase o gateway ja validou a assinatura)
const b64u = o => btoa(JSON.stringify(o)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const TOKEN = sub => b64u({ alg: "HS256", typ: "JWT" }) + "." + b64u({ sub: sub, role: "authenticated" }) + ".assinatura";
// Request de mentira: o navegador nao deixa um script montar o header Origin num Request
// de verdade, e a funcao so usa method e headers.get
const req = (metodo, origem, token) => ({ method: metodo, headers: { get: k => ({
  origin: origem === undefined ? "https://vitorruizz-web.github.io" : origem,
  apikey: "chave-publica-do-app",
  authorization: token ? "Bearer " + token : null })[String(k).toLowerCase()] || null } });
const corpo = async r => { try { return await r.json(); } catch (e) { return null; } };

(async () => {
  const fonte = await (await fetch("../supabase/functions/pluggy-cdbs/index.ts?v=" + Date.now())).text();
  let HANDLER = null, ENV = {};
  window.Deno = { env: { get: k => ENV[k] }, serve: h => { HANDLER = h; } };
  (0, eval)(fonte);
  if (!ok(typeof HANDLER === "function", "a funcao registra o handler com Deno.serve")) return fim();

  // ---------------------------------------------------------------- Pluggy falsa
  const chamadas = [];
  let AUTH_STATUS = 200;
  const ITEMS = {
    "it-xp":  { id: "it-xp", connector: { name: "XP Investimentos" }, status: "UPDATED", executionStatus: "SUCCESS",
                lastUpdatedAt: "2026-09-19T09:00:00.000Z", consentExpiresAt: "2027-09-01T00:00:00.000Z", error: null },
    "it-btg": { id: "it-btg", connector: { name: "BTG Pactual" }, status: "OUTDATED", executionStatus: "ERROR",
                lastUpdatedAt: "2026-09-18T09:00:00.000Z", consentExpiresAt: null, error: { code: "X", message: "instabilidade" } },
  };
  const inv = (id, extra) => Object.assign({ id: id, name: "CDB TESTE " + id, code: "C" + id, type: "FIXED_INCOME", subtype: "CDB",
    issuer: "BANCO TESTE", status: "ACTIVE", balance: 1000, amount: 1010, amountOriginal: 950, taxes: 10, taxes2: 0,
    date: "2026-09-18T03:00:00.000Z", dueDate: "2027-05-10T03:00:00.000Z", issueDate: "2025-05-10T03:00:00.000Z",
    rate: 120, rateType: "CDI", fixedAnnualRate: null, owner: "NOME DO TITULAR", number: "123", transactions: [{ x: 1 }],
    institution: { name: "XP" } }, extra || {});
  const PAGINAS = { "it-xp": [[inv("a"), inv("b")], [inv("c")]], "it-btg": [[inv("d", { institution: { name: "BTG" } })]],
                    "it-mp1": [[inv("e"), inv("t", { subtype: "TREASURY" }), inv("v", { status: "TOTAL_WITHDRAWAL", balance: 0 })]],
                    "it-mp2": [[inv("f")]] };
  ITEMS["it-mp1"] = { id: "it-mp1", connector: { name: "MeuPluggy" }, status: "UPDATED", lastUpdatedAt: "2026-09-19T09:00:00.000Z", error: null };
  ITEMS["it-mp2"] = { id: "it-mp2", connector: { name: "MeuPluggy" }, status: "UPDATED", lastUpdatedAt: "2026-09-19T09:00:00.000Z", error: null };
  // movimentacoes: "a" comprou uma vez; "b" a Pluggy nao responde; os outros nao tem nada
  const MOVS = { a: [{ id: "m1", type: "BUY", movementType: "CREDIT", date: "2025-06-02T03:00:00.000Z", tradeDate: "2025-06-02T03:00:00.000Z",
                       quantity: 1, value: 950, amount: 950, netAmount: 950, agreedRate: null, description: "COMPRA", brokerageNumber: "N1",
                       expenses: { brokerageFee: 0 } }] };
  const realFetch = window.fetch.bind(window);
  const USUARIOS = { [TOKEN("u1")]: { id: "u1" }, [TOKEN("outro")]: { id: "outro" }, [TOKEN("qualquer")]: { id: "qualquer" } };
  window.fetch = async (url, opts) => {
    url = String(url); opts = opts || {};
    // Auth do Supabase falso: so conhece os tokens acima (a chave anon nao e usuario)
    if (url === "https://x.supabase.co/auth/v1/user"){
      chamadas.push({ url: url, metodo: "GET", headers: opts.headers || {}, corpo: null });
      const tok = String((opts.headers || {})["Authorization"] || "").replace(/^Bearer\s+/, "");
      const u = USUARIOS[tok];
      return u ? new Response(JSON.stringify(u), { status: 200 }) : new Response('{"msg":"invalid JWT"}', { status: 401 });
    }
    if (url.indexOf("https://api.pluggy.ai") !== 0) return realFetch(url, opts);
    chamadas.push({ url: url, metodo: opts.method || "GET", headers: opts.headers || {}, corpo: opts.body || null });
    const u = new URL(url);
    const j = (o, s) => new Response(JSON.stringify(o), { status: s || 200, headers: { "Content-Type": "application/json" } });
    if (u.pathname === "/auth") return AUTH_STATUS === 200 ? j({ apiKey: "chave-api-falsa" }) : j({ message: "invalid" }, AUTH_STATUS);
    if ((opts.headers || {})["X-API-KEY"] !== "chave-api-falsa") return j({ message: "sem chave" }, 403);
    const m = u.pathname.match(/^\/items\/(.+)$/);
    if (m) return ITEMS[decodeURIComponent(m[1])] ? j(ITEMS[decodeURIComponent(m[1])]) : j({ message: "not found" }, 404);
    const mt = u.pathname.match(/^\/investments\/([^/]+)\/transactions$/);
    if (mt) {
      const idInv = decodeURIComponent(mt[1]);
      if (idInv === "b") return j({ message: "erro" }, 500);
      const lst = MOVS[idInv] || [];
      return j({ total: lst.length, totalPages: 1, page: 1, results: lst });
    }
    if (u.pathname === "/investments") {
      const pags = PAGINAS[u.searchParams.get("itemId")] || [];
      const p = +u.searchParams.get("page") || 1;
      return j({ total: [].concat.apply([], pags).length, totalPages: pags.length || 1, page: p, results: pags[p - 1] || [] });
    }
    return j({ message: "?" }, 404);
  };

  // ---------------------------------------------------------------- CORS
  let r = await HANDLER(req("OPTIONS"));
  ok(r.status === 200 && r.headers.get("Access-Control-Allow-Origin") === "https://vitorruizz-web.github.io", "preflight: CORS para o site publicado");
  ok(/authorization/i.test(r.headers.get("Access-Control-Allow-Headers") || "") && /apikey/i.test(r.headers.get("Access-Control-Allow-Headers") || ""),
     "preflight libera Authorization e apikey");
  r = await HANDLER(req("OPTIONS", "http://localhost:8765"));
  igual(r.headers.get("Access-Control-Allow-Origin"), "http://localhost:8765", "preflight: CORS para o preview local");
  r = await HANDLER(req("OPTIONS", "https://outro-site.example"));
  igual(r.headers.get("Access-Control-Allow-Origin"), "https://vitorruizz-web.github.io", "origem desconhecida nao ganha CORS proprio");

  // ---------------------------------------------------------------- quem chama
  // O gateway do Supabase so confere JWT do segredo LEGADO (a chave anon passaria);
  // a funcao pergunta ao Auth se o token e de um usuario de verdade.
  ENV = { SUPABASE_URL: "https://x.supabase.co" };
  let c;
  r = await HANDLER(req("POST", undefined, null));
  c = await corpo(r);
  ok(r.status === 401 && c.erro === "nao_autenticado", "sem token: 401");
  r = await HANDLER(req("POST", undefined, "chave.anon.publica"));
  ok(r.status === 401, "chave anon (nao e usuario): 401");
  ok(!chamadas.some(x => x.url.indexOf("api.pluggy.ai") >= 0), "barrado antes de chamar a Pluggy");
  const aut = chamadas.filter(x => /auth\/v1\/user/.test(x.url)).pop();
  ok(aut && aut.headers["apikey"] === "chave-publica-do-app", "confere o token no Auth com a chave publica que o app mandou");

  // ---------------------------------------------------------------- sem segredos
  chamadas.length = 0;
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  ok(r.status === 500 && c.erro === "configuracao", "usuario valido, sem segredos: erro de configuracao");
  igual(c.falta, ["PLUGGY_CLIENT_ID", "PLUGGY_CLIENT_SECRET", "PLUGGY_ITEM_IDS"], "e diz quais faltam");
  ok(!chamadas.some(x => x.url.indexOf("api.pluggy.ai") >= 0), "sem segredos: nem chama a Pluggy");
  igual(r.headers.get("Access-Control-Allow-Origin"), "https://vitorruizz-web.github.io", "erro tambem leva CORS (senao o navegador esconde a mensagem)");
  r = await HANDLER(req("GET", undefined, TOKEN("u1")));
  ok(r.status === 405, "GET nao e aceito");

  // ---------------------------------------------------------------- dono
  ENV = { SUPABASE_URL: "https://x.supabase.co", PLUGGY_CLIENT_ID: "id", PLUGGY_CLIENT_SECRET: "segredo",
          PLUGGY_ITEM_IDS: " it-xp , it-btg ", DONO_UID: "u1" };
  chamadas.length = 0;
  r = await HANDLER(req("POST", undefined, TOKEN("outro")));
  ok(r.status === 403, "DONO_UID: token valido de OUTRO usuario e barrado");
  ok(!chamadas.some(x => x.url.indexOf("api.pluggy.ai") >= 0), "barrado antes de chamar a Pluggy");
  chamadas.length = 0;

  // ---------------------------------------------------------------- chave recusada
  AUTH_STATUS = 401;
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  ok(r.status === 502 && c.erro === "pluggy_auth" && c.status === 401, "Pluggy recusou a chave: 502 pluggy_auth");
  const auth = chamadas.find(x => x.url === "https://api.pluggy.ai/auth");
  ok(auth && auth.metodo === "POST" && JSON.parse(auth.corpo).clientId === "id" && JSON.parse(auth.corpo).clientSecret === "segredo",
     "auth manda clientId e clientSecret no corpo, por POST");
  ok(!/segredo/.test(JSON.stringify(c)), "a resposta nunca devolve o segredo");

  // ---------------------------------------------------------------- caminho feliz
  AUTH_STATUS = 200; chamadas.length = 0;
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  ok(r.status === 200 && !!c.geradoEm, "sincronizacao: 200 com a hora da geracao");
  igual(c.itens.map(i => [i.id, i.conector, i.status, i.atualizadoEm, i.consentimentoAte, i.erro]),
        [["it-xp", "XP Investimentos", "UPDATED", "2026-09-19T09:00:00.000Z", "2027-09-01T00:00:00.000Z", null],
         ["it-btg", "BTG Pactual", "OUTDATED", "2026-09-18T09:00:00.000Z", null, "instabilidade"]],
        "status de cada conexao (corretora, status, ultima atualizacao, consentimento, erro)");
  igual(c.investimentos.map(i => i.id + ":" + i.conector + ":" + i.instituicao),
        ["a:XP Investimentos:XP", "b:XP Investimentos:XP", "c:XP Investimentos:XP", "d:BTG Pactual:BTG"],
        "junta as duas paginas da XP e a do BTG, com a corretora de cada um");
  igual(Object.keys(c.investimentos[0]).sort(),
        ["conector", "id", "name", "code", "type", "subtype", "issuer", "status", "balance", "amount", "amountOriginal", "taxes",
         "taxes2", "date", "dueDate", "issueDate", "rate", "rateType", "fixedAnnualRate", "quantity", "value", "lastMonthRate",
         "annualRate", "instituicao", "movimentos"].sort(),
        "so os campos que o app usa: sem nome do titular nem numero de conta");
  const pedidos = chamadas.filter(x => x.url.indexOf("/investments?") >= 0);
  ok(pedidos.length === 3 && pedidos.every(x => /type=FIXED_INCOME/.test(x.url) && /pageSize=500/.test(x.url)),
     "pede so renda fixa, 500 por pagina, e para no fim das paginas");
  // movimentacoes: a compra traz a data e o valor -- a taxa da emissao nao e a de quem comprou depois
  const invA = c.investimentos.find(i => i.id === "a"), invB = c.investimentos.find(i => i.id === "b");
  igual(invA.movimentos, [{ tipo: "BUY", data: "2025-06-02T03:00:00.000Z", liquidacao: "2025-06-02T03:00:00.000Z", qtd: 1, pu: 950,
                            valor: 950, liquido: 950, taxa: null }],
        "movimentacoes enxutas: tipo, datas, quantidade, PU, valores e taxa (sem nota de corretagem nem despesas)");
  ok(invB.movimentos === null && c.investimentos.length === 4, "movimentacao que falhou vira null e a sincronizacao segue");
  igual(c.investimentos.find(i => i.id === "c").movimentos, [], "titulo sem movimentacao: lista vazia");
  const naPluggy = chamadas.filter(x => x.url.indexOf("https://api.pluggy.ai") === 0);
  ok(naPluggy.filter(x => x.url !== "https://api.pluggy.ai/auth").every(x => x.headers["X-API-KEY"] === "chave-api-falsa"),
     "usa a apiKey no header X-API-KEY");
  ok(naPluggy.filter(x => x.url === "https://api.pluggy.ai/auth").length === 1, "uma autenticacao na Pluggy por sincronizacao");

  // ---------------------------------------------------------------- item com erro
  ENV.PLUGGY_ITEM_IDS = "it-xp;nao-existe";
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  ok(r.status === 200 && c.itens[1].erro === "item HTTP 404" && c.investimentos.length === 3,
     "item inexistente: aparece o erro dele e o outro segue");

  // ---------------------------------------------------------------- Meu Pluggy: rotulo da corretora
  // Pelo Meu Pluggy todo item se chama "MeuPluggy": o rotulo no segredo da o nome da corretora.
  chamadas.length = 0;
  ENV.PLUGGY_ITEM_IDS = "XP:it-mp1, BTG=it-mp2";
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  igual(c.itens.map(i => i.id + ":" + i.conector), ["it-mp1:XP", "it-mp2:BTG"], "rotulo XP:<id> / BTG=<id> vira o nome da corretora");
  igual(c.investimentos.map(i => i.id + ":" + i.conector), ["e:XP", "t:XP", "v:XP", "f:BTG"], "cada investimento leva o rotulo do seu item");
  const movPedidos = chamadas.filter(x => /\/transactions/.test(x.url)).map(x => decodeURIComponent(x.url.match(/investments\/([^/]+)\//)[1])).sort();
  igual(movPedidos, ["e", "f", "v"], "movimentacoes da renda fixa bancaria ativa e da resgatada no ultimo ano (Tesouro fica fora)");
  igual(c.investimentos.filter(i => i.id === "t").map(i => i.movimentos), [null], "quem fica fora nao tem movimentacoes");
  // resgatado ha mais de 400 dias: nenhuma janela do Open Finance chega la
  PAGINAS["it-mp1"][0].push(inv("velho", { status: "TOTAL_WITHDRAWAL", balance: 0, dueDate: "2020-01-10T03:00:00.000Z" }));
  chamadas.length = 0;
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  ok(!chamadas.some(x => /investments\/velho\//.test(x.url)), "resgatado ha mais de 400 dias: nem pede as movimentacoes");
  PAGINAS["it-mp1"][0].pop();
  // 429: espera e tenta de novo (sao ~1 pedido por titulo; o limite e 360/min)
  let vezes429 = 0;
  const fetchAntes = window.fetch;
  window.fetch = async (url, opts) => {
    if (/investments\/e\/transactions/.test(String(url)) && vezes429 < 1) { vezes429++; return new Response('{"message":"calma"}', { status: 429 }); }
    return fetchAntes(url, opts);
  };
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  window.fetch = fetchAntes;
  ok(vezes429 === 1 && Array.isArray(c.investimentos.find(i => i.id === "e").movimentos), "429 na movimentacao: espera e tenta de novo");
  ENV.PLUGGY_ITEM_IDS = "it-mp1,it-mp2";
  r = await HANDLER(req("POST", undefined, TOKEN("u1")));
  c = await corpo(r);
  igual(c.itens.map(i => i.conector), ["MeuPluggy", "MeuPluggy 2"], "sem rotulo: dois itens do Meu Pluggy ganham numero (nunca o mesmo nome)");

  // ---------------------------------------------------------------- sem DONO_UID
  delete ENV.DONO_UID; ENV.PLUGGY_ITEM_IDS = "it-xp";
  r = await HANDLER(req("POST", undefined, TOKEN("qualquer")));
  ok(r.status === 200, "sem DONO_UID: vale o JWT que o gateway validou (cadastro desligado)");

  fim();
})().catch(e => { ok(false, "excecao: " + (e && e.stack || e)); fim(); });
</script>
