<!doctype html>
<meta charset="utf-8">
<title>teste dos vencimentos</title>
<style>body{font:13px ui-monospace,Consolas,monospace;background:#111;color:#ddd;padding:16px}
pre{white-space:pre-wrap}</style>
<pre id="out">rodando...</pre>
<script>
// Testes dos blocos <vencimentos> e <xlsx> do index.html. So dados INVENTADOS:
// o repo e publico. Valores de referencia (Pascoa, dias uteis, seriais, Copom)
// vieram de uma implementacao independente em Python (dateutil), nao do app.
const log = []; let falhas = 0;
function ok(cond, msg){ log.push((cond ? "PASS  " : "FALHA ") + msg); if (!cond) falhas++; return cond; }
function igual(a, b, msg){
  const ja = JSON.stringify(a), jb = JSON.stringify(b);
  ok(ja === jb, msg + (ja === jb ? "" : " (obtido " + ja + ", esperado " + jb + ")"));
}
function perto(a, b, msg, tol){
  tol = tol === undefined ? 1e-6 : tol;
  ok(typeof a === "number" && Math.abs(a - b) <= tol, msg + " (obtido " + a + ", esperado " + b + ")");
}
function fim(){
  document.getElementById("out").textContent = log.join("\n") +
    "\n\n=== " + (falhas === 0 ? "TUDO PASSOU" : falhas + " FALHA(S)") + " === (" + log.length + " asserções)";
}

(async () => {
  // cache-buster: sem ele o navegador serve o index.html velho e o teste "passa"
  const html = await (await fetch("../index.html?v=" + Date.now())).text();
  for (const bloco of ["vencimentos", "xlsx"]){
    const m = html.match(new RegExp("\\/\\*<" + bloco + ">\\*\\/([\\s\\S]*?)\\/\\*<\\/" + bloco + ">\\*\\/"));
    if (!ok(!!m, "bloco <" + bloco + "> encontrado no index.html")) return fim();
    (0, eval)(m[1]);
  }
  const V = window.VENC, X = window.XLSXLER, d = V.dn;

  // ------------------------------------------------ datas e dias uteis (Task 1)
  igual(V.iso(d("2026-09-19")), "2026-09-19", "dn/iso ida e volta");
  igual(d("2026-09-19"), 20715, "2026-09-19 = dia 20715 desde 1970 (Python)");
  igual(V.dow(d("2026-09-19")), 6, "19/09/2026 e sabado");
  for (const [y, p] of [[2024,"2024-03-31"],[2025,"2025-04-20"],[2026,"2026-04-05"],[2027,"2027-03-28"],
                        [2028,"2028-04-16"],[2029,"2029-04-01"],[2030,"2030-04-21"]])
    igual(V.iso(V.pascoa(y)), p, "Pascoa de " + y + " (dateutil)");
  for (const s of ["2026-02-16","2026-02-17","2026-04-03","2026-06-04","2026-09-07","2026-11-02","2026-11-20","2026-12-25"])
    ok(!V.ehUtil(d(s)), s + " nao e dia util (feriado)");
  ok(V.ehUtil(d("2023-11-20")), "20/11/2023 era dia util: feriado nacional so desde 2024");
  ok(V.ehUtil(d("2026-09-21")) && !V.ehUtil(d("2026-09-19")), "segunda util, sabado nao");
  for (const [a, b] of [["2026-09-19","2026-09-21"],["2026-11-20","2026-11-23"],["2026-12-25","2026-12-28"],
                        ["2027-11-20","2027-11-22"],["2028-12-10","2028-12-11"],["2027-01-15","2027-01-15"]])
    igual(V.iso(V.proxUtil(d(a))), b, "proximo dia util a partir de " + a);
  for (const [a, b, n] of [["2025-01-01","2026-01-01",252],["2026-01-01","2027-01-01",249],
                           ["2027-01-01","2028-01-01",251],["2026-09-21","2027-09-21",250],
                           ["2026-09-19","2026-09-21",0],["2026-09-18","2026-09-21",1],
                           ["2025-03-10","2026-09-21",386],["2026-09-21","2027-01-15",79]])
    igual(V.du(d(a), d(b)), n, "dias uteis em [" + a + ", " + b + ")");

  // ------------------------------------------------------------ IR (Task 1)
  for (const [dias, a] of [[1,.225],[180,.225],[181,.20],[360,.20],[361,.175],[720,.175],[721,.15],[2000,.15]])
    igual(V.aliquotaIR(dias), a, "IR com " + dias + " dias corridos");

  // ------------------------------------------- taxa, data e valor (Task 1)
  const tx = V.parseTaxa;
  igual(tx("+15,50%"), { indexador:"pre", taxa:0.155 }, "'+15,50%' = pre 15,50% a.a.");
  igual(tx("15,5% a.a."), { indexador:"pre", taxa:0.155 }, "'15,5% a.a.'");
  igual(tx("Pré 15,50%"), { indexador:"pre", taxa:0.155 }, "'Pré 15,50%'");
  igual(tx("PRÉ-FIXADO 15,5% A.A."), { indexador:"pre", taxa:0.155 }, "'PRÉ-FIXADO 15,5% A.A.'");
  igual(tx("120,00% CDI"), { indexador:"cdi", taxa:1.2 }, "'120,00% CDI'");
  igual(tx("116,97% do CDI"), { indexador:"cdi", taxa:1.1697 }, "'116,97% do CDI'");
  igual(tx("CDI + 1,5%"), { indexador:"cdi+", taxa:0.015 }, "'CDI + 1,5%'");
  igual(tx("95%", "CDI"), { indexador:"cdi", taxa:0.95 }, "coluna de indexador 'CDI' + taxa '95%'");
  igual(tx("1,5%", "CDI"), { indexador:"cdi+", taxa:0.015 }, "indexador 'CDI' + '1,5%' = spread");
  igual(tx(0.155, "PRÉ"), { indexador:"pre", taxa:0.155 }, "indexador 'PRÉ' + 0,155 numerico");
  igual(tx(1.2, "CDI"), { indexador:"cdi", taxa:1.2 }, "indexador 'CDI' + 1,2 numerico (celula em %)");
  igual(tx(15.5), { indexador:"pre", taxa:0.155 }, "numero 15,5 = pre");
  igual(tx(0.155), { indexador:"pre", taxa:0.155 }, "numero 0,155 = pre");
  ok(!!tx("IPCA + 6,50%").erro, "IPCA+ recusado com motivo");
  ok(!!tx("6%", "IPCA").erro, "indexador IPCA recusado");
  ok(!!tx("abc").erro && !!tx("").erro && !!tx(null).erro, "texto sem taxa recusado");
  ok(!!tx("+85,00%").erro, "pre acima de 50% a.a. recusado (taxa lida errada)");

  igual(V.numBR("R$ 3.210,45"), 3210.45, "'R$ 3.210,45'");
  igual(V.numBR("3210.45"), 3210.45, "'3210.45'");
  igual(V.numBR("3.210"), 3210, "'3.210' (milhar sem centavos)");
  igual(V.numBR("(1.234,56)"), -1234.56, "'(1.234,56)' negativo");
  igual(V.numBR(1234.5), 1234.5, "numero passa direto");
  igual([V.numBR(""), V.numBR(null), V.numBR("abc")], [null, null, null], "vazio/lixo = null");

  igual(V.parseData("24/11/2027"), "2027-11-24", "dd/mm/aaaa");
  igual(V.parseData("2027-11-24"), "2027-11-24", "ISO");
  igual(V.parseData("1/2/27"), "2027-02-01", "d/m/aa");
  igual(V.parseData(46715), "2027-11-24", "serial do Excel 46715 (Python)");
  igual(V.parseData(45726), "2025-03-10", "serial do Excel 45726 (Python)");
  igual([V.parseData("31/02/2027"), V.parseData("abc"), V.parseData(12)], [null, null, null], "data invalida = null");

  igual(V.emissor("CDB BANCO ALFA - NOV/2027"), "BANCO ALFA", "emissor tira 'CDB' e o MES/ANO");
  igual(V.emissor("CDB GAMA - JURO MENSAL - DEZ/2027"), "GAMA", "emissor tira 'JURO MENSAL'");
  igual(V.emissor("CDB BANCO DELTA - GRUPO EPSILON - SET/2027"), "BANCO DELTA - GRUPO EPSILON", "hifen do meio do nome fica");

  // ------------------------------------------ curva do CDI (Task 2)
  // historico SINTETICO no formato do BC: CDI por dia util (13,90 ate 16/09,
  // 13,65 em 17/09 -- ultimo publicado) e Selic meta dia a dia, preenchida ate
  // o dia da proxima reuniao (04/11), como a serie 432 vem de verdade.
  const HIST = [], META = [];
  for (let x = d("2026-09-01"); x <= d("2026-09-17"); x++)
    if (V.ehUtil(x)) HIST.push({ dia: V.iso(x), cdi: x < d("2026-09-17") ? 13.90 : 13.65 });
  for (let x = d("2026-09-01"); x <= d("2026-11-04"); x++)
    META.push({ dia: V.iso(x), selic: x < d("2026-09-17") ? 14.00 : 13.75 });
  const FOCUS = { reunioes: [{r:"R6/2026", v:13.75}, {r:"R7/2026", v:13.5}, {r:"R8/2026", v:13.25}, {r:"R1/2027", v:13}],
                  anuais: [{ano:2026, v:13.25}, {ano:2027, v:12}, {ano:2028, v:11}] };
  const TXH = { historico: HIST, meta: META, selic: 13.75, cdi: 13.65, focus: FOCUS };
  const HOJE = d("2026-09-19");
  const ver = c => c.map(x => [x.desde === -Infinity ? null : V.iso(x.desde), +(x.cdi * 100).toFixed(6)]);
  const cH = V.curvaCDI(TXH, "hoje", HOJE);
  igual(ver(cH), [[null, 13.9], ["2026-09-17", 13.65]],
        "VALIDACAO pos: 'Selic de hoje' = CDI que valeu ate 16/09 e 13,65 (Selic 13,75 − 0,10) dali em diante");
  const cF = V.curvaCDI(TXH, "focus", HOJE);
  igual(ver(cF), [[null, 13.9], ["2026-09-17", 13.65], ["2026-11-05", 13.4], ["2026-12-10", 13.15],
                  ["2027-01-29", 12.9], ["2027-12-10", 11.9], ["2028-12-11", 10.9]],
        "Focus: R6 ja passou; R7 vale no dia util seguinte ao fim da serie da meta (05/11); anuais depois da ultima reuniao");
  igual(ver(V.curvaCDI(TXH, "manual", HOJE, 12)), [[null, 13.9], ["2026-09-17", 13.65], ["2026-09-18", 11.9]],
        "manual: o passado continua o que valeu; a Selic digitada so a partir do dia seguinte ao ultimo CDI");
  igual(ver(V.curvaCDI({ selic: 13.75, cdi: 13.65 }, "hoje", HOJE)), [[null, 13.65]], "sem historico: CDI atual constante");
  igual(ver(V.curvaCDI({ selic: 12 }, "hoje", HOJE)), [[null, 11.9]], "so a Selic: CDI = Selic − 0,10");
  igual(ver(V.curvaCDI({ selic: 13.75, cdi: 13.65, focus: FOCUS }, "focus", HOJE)),
        [[null, 13.65], ["2026-11-05", 13.4], ["2026-12-10", 13.15], ["2027-01-29", 12.9], ["2027-12-10", 11.9], ["2028-12-11", 10.9]],
        "Focus sem a serie da meta: datas pela tabela, reuniao passada ignorada");
  igual(V.curvaCDI(null, "focus", HOJE), null, "sem taxa nenhuma: curva nula");
  perto(V.cdiEm(cF, d("2026-11-04")), 0.1365, "cdiEm na vespera da R7", 1e-12);
  perto(V.cdiEm(cF, d("2026-11-05")), 0.134, "cdiEm no dia em que a R7 vigora", 1e-12);
  perto(V.cdiEm(cF, d("2026-09-16")), 0.139, "cdiEm num dia passado = o CDI que valeu", 1e-12);

  // ------------------------------------------ projecao pre e pos (Task 2)
  const ctx = (extra) => Object.assign({ posicao: d("2026-09-21"), hoje: d("2026-09-21"),
                                         degraus: V.curvaCDI({ selic: 13.75, cdi: 13.65 }, "hoje", HOJE), irPresumido: 0.15 }, extra || {});
  const cdbPre = { indexador:"pre", taxa:0.15, vencimento:"2027-09-21", saldo_liquido:1000 };
  const pre = V.projetar(cdbPre, ctx());
  const F = Math.pow(1.15, 250/252);
  igual([pre.du, V.iso(pre.credito), pre.qual, pre.eventos.length], [250, "2027-09-21", "estimado", 1], "pre: 250 du, cai no proprio dia, estimado, 1 evento");
  perto(pre.bruto, 1000 * F, "pre: bruto = saldo × 1,15^(250/252)");
  perto(pre.liquido, 1000 + 0.85 * 1000 * (F - 1), "pre sem data de aplicacao: IR presumido 15% so no rendimento futuro");

  // exato: saldo montado pela propria regra (aplicou 1.000 em 10/03/2025)
  const G0 = 1000 * Math.pow(1.15, 386/252), N0 = G0 - 0.175 * (G0 - 1000);
  const GT = 1000 * Math.pow(1.15, 636/252), NT = GT - 0.15 * (GT - 1000);
  const exa = V.projetar(Object.assign({}, cdbPre, { saldo_liquido:N0, data_aplicacao:"2025-03-10", valor_aplicado:1000 }), ctx());
  igual(exa.qual, "exato", "data e valor aplicados = exato");
  perto(exa.liquido, NT, "exato: 15% sobre TODO o ganho desde a aplicacao (925 dias corridos)");
  perto(exa.aliquota, 0.15, "exato: aliquota no vencimento", 1e-12);
  const par = V.projetar(Object.assign({}, cdbPre, { saldo_liquido:N0, data_aplicacao:"2025-03-10" }), ctx());
  igual(par.qual, "parcial", "so a data = parcial");
  perto(par.liquido, NT, "parcial (pre): o principal sai exato da propria taxa");

  perto(V.projetar({ indexador:"cdi", taxa:1.2, vencimento:"2027-09-21", saldo_liquido:1000 }, ctx()).bruto,
        1000 * Math.pow(1 + 1.2 * (Math.pow(1.1365, 1/252) - 1), 250), "120% do CDI com CDI de 13,65%");
  perto(V.projetar({ indexador:"cdi+", taxa:0.015, vencimento:"2027-09-21", saldo_liquido:1000 }, ctx()).bruto,
        1000 * Math.pow(1.1365 * 1.015, 250/252), "CDI + 1,5%");
  const sem = V.projetar({ indexador:"cdi", taxa:1.2, vencimento:"2027-09-21", saldo_liquido:1000 }, ctx({ degraus: null }));
  ok(sem.semTaxa && Math.abs(sem.liquido - 1000) < 1e-9, "CDI sem taxa: fica no saldo e marca semTaxa");

  // ---------- VALIDACAO (a): o valor anda com os dias pela taxa da planilha
  const p0 = V.projetar(cdbPre, ctx());
  const p1 = V.projetar(cdbPre, ctx({ hoje: d("2026-10-21") }));
  const p2 = V.projetar(cdbPre, ctx({ hoje: d("2026-11-20") }));
  perto(p0.valorHoje, 1000, "VALIDACAO a: no dia da planilha, hoje = saldo da planilha");
  perto(p1.valorHoje, 1000 + 0.85 * 1000 * (Math.pow(1.15, 21/252) - 1), "VALIDACAO a: 30 dias depois = saldo + 21 du a 15% a.a. (liquido)");
  perto(p2.valorHoje, 1000 + 0.85 * 1000 * (Math.pow(1.15, 42/252) - 1), "VALIDACAO a: 60 dias depois = 42 du");
  ok(p0.valorHoje < p1.valorHoje && p1.valorHoje < p2.valorHoje, "VALIDACAO a: o valor de hoje so cresce");
  perto(p2.liquido, p0.liquido, "VALIDACAO a: o valor no vencimento nao depende do dia em que se olha", 1e-9);
  perto(p2.rendimento, p2.liquido - p2.valorHoje, "rendimento = vencimento − valor de hoje");
  const pv = V.projetar(cdbPre, ctx({ hoje: d("2027-09-22") }));
  ok(pv.pago && pv.valorHoje === 0 && pv.aReceber === 0 && pv.rendimento === 0, "depois do credito: nada a receber, valor de hoje 0");

  // ---------- VALIDACAO (b): pos-fixado com a Selic de hoje e a mudanca aplicada a partir da data dela
  const cdbCdi = { indexador:"cdi", taxa:1, vencimento:"2026-11-10", saldo_liquido:1000 };
  const ctxH = extra => Object.assign({ posicao: d("2026-09-10"), hoje: HOJE, irPresumido: 0.15 }, extra);
  const ph = V.projetar(cdbCdi, ctxH({ degraus: cH }));
  perto(ph.fator, Math.pow(1.139, 5/252) * Math.pow(1.1365, 36/252),
        "VALIDACAO b: 5 du a 13,90 (valeu) + 36 du a 13,65 (Selic de hoje)", 1e-12);
  perto(ph.valorHoje, 1000 + 0.85 * 1000 * (Math.pow(1.139, 5/252) * Math.pow(1.1365, 2/252) - 1),
        "VALIDACAO b: valor de hoje com o CDI que valeu em cada dia");
  const pf = V.projetar(cdbCdi, ctxH({ degraus: cF }));
  perto(pf.fator, Math.pow(1.139, 5/252) * Math.pow(1.1365, 33/252) * Math.pow(1.134, 3/252),
        "Focus: o corte esperado da R7 entra em 05/11 (3 du a 13,40)", 1e-12);
  // em 06/11 o BC publica o corte que vigorou em 05/11: historico ganha 13,40 e a meta vai ate a R8
  const HIST2 = HIST.slice(), META2 = META.filter(m => m.dia < "2026-11-05");
  for (let x = d("2026-09-18"); x < d("2026-11-06"); x++)
    if (V.ehUtil(x)) HIST2.push({ dia: V.iso(x), cdi: x < d("2026-11-05") ? 13.65 : 13.40 });
  for (let x = d("2026-11-05"); x <= d("2026-12-09"); x++) META2.push({ dia: V.iso(x), selic: 13.50 });
  const c2 = V.curvaCDI({ historico: HIST2, meta: META2, focus: FOCUS }, "hoje", d("2026-11-06"));
  igual(ver(c2), [[null, 13.9], ["2026-09-17", 13.65], ["2026-11-05", 13.4]],
        "VALIDACAO b: Selic nova so a partir do dia em que vigorou; o passado nao muda");
  const pl = V.projetar({ indexador:"cdi", taxa:1, vencimento:"2026-12-31", saldo_liquido:1000 },
                        { posicao: d("2026-09-10"), hoje: d("2026-11-06"), degraus: c2, irPresumido: 0.15 });
  perto(pl.fator, Math.pow(1.139, 5/252) * Math.pow(1.1365, 33/252) * Math.pow(1.134, 38/252),
        "VALIDACAO b: 5 du a 13,90 + 33 a 13,65 + 38 a 13,40 (do corte ao vencimento)", 1e-12);

  // ------------------------------------------ juros mensais (Task 2)
  const jm = { indexador:"pre", taxa:0.12, vencimento:"2027-01-15", saldo_liquido:1000, valor_aplicado:1000, juros_mensais:true };
  const pj = V.projetar(jm, ctx());
  igual(pj.eventos.map(e => V.iso(e.dia) + ":" + e.tipo),
        ["2026-10-15:juros", "2026-11-16:juros", "2026-12-15:juros", "2027-01-15:vencimento"],
        "juros mensais: 3 cupons + vencimento; 15/11 (domingo) paga 16/11");
  const cup = n => 1000 * (Math.pow(1.12, n/252) - 1) * 0.85;
  perto(pj.eventos[0].liquido, cup(21), "1o cupom: 15/09 a 15/10 = 21 du");
  perto(pj.eventos[2].liquido, cup(20), "3o cupom: 20 du");
  perto(pj.eventos[3].liquido, 1000 + cup(21), "vencimento: principal + ultimo cupom");
  perto(pj.liquido, 3 * cup(21) + cup(20) + 1000, "total = soma dos eventos");
  const Nj = 1000 * (1 + 0.85 * (Math.pow(1.12, 4/252) - 1));
  const pj2 = V.projetar(Object.assign({}, jm, { valor_aplicado:null, saldo_liquido:Nj }), ctx());
  perto(pj2.principal, 1000, "sem valor aplicado: principal = saldo − juro liquido acumulado desde 15/09", 1e-9);
  perto(pj2.liquido, pj.liquido, "mesmo fluxo com o principal estimado", 1e-7);
  perto(pj2.valorHoje, Nj, "juros mensais: no dia da planilha, hoje = saldo", 1e-9);
  const pj3 = V.projetar(jm, ctx({ hoje: d("2026-10-20") }));
  perto(pj3.valorHoje, 1000 + 1000 * (Math.pow(1.12, 3/252) - 1) * 0.85, "depois do 1o cupom: principal + juro desde 15/10 (3 du)");
  perto(pj3.aReceber, pj.liquido - pj.eventos[0].liquido, "o cupom ja pago sai do 'a receber'");

  // ------------------------------------------ agenda (Task 2)
  // saldo COERENTE com o principal (P + juro liquido acumulado desde 15/09)
  const jmC = Object.assign({}, jm, { saldo_liquido: Nj });
  const ag = V.agenda([cdbPre, { indexador:"cdi", taxa:1.2, vencimento:"2027-09-21", saldo_liquido:1000 }, jmC], ctx());
  const cdiL = V.projetar({ indexador:"cdi", taxa:1.2, vencimento:"2027-09-21", saldo_liquido:1000 }, ctx()).liquido;
  igual(Object.keys(ag.porDia).length, 5, "agenda: 5 dias com credito");
  perto(ag.porDia[d("2027-09-21")].total, pre.liquido + cdiL, "dois CDBs no mesmo dia somam");
  igual(Object.keys(ag.porMes).sort(), ["2026-10", "2026-11", "2026-12", "2027-01", "2027-09"], "meses com credito");
  igual([ag.porMes["2027-01"].vencimentos, ag.porMes["2026-10"].juros, ag.porMes["2027-09"].vencimentos], [1, 1, 2], "conta vencimentos e juros por mes");
  perto(ag.total, pre.liquido + cdiL + pj.liquido, "total = tudo o que cai");
  perto(ag.posicao, 2000 + Nj, "posicao = soma dos saldos da planilha");
  perto(ag.hoje, 2000 + Nj, "no dia da planilha, carteira de hoje = posicao");
  const ag2 = V.agenda([cdbPre, jm], ctx({ hoje: d("2026-10-20") }));
  perto(ag2.aReceber, p0.liquido + pj3.aReceber, "a receber (a partir de hoje) ignora o cupom ja pago");
  ok(ag2.hoje > 2000, "carteira de hoje cresceu depois de um mes");

  // ------------------------------------------ leitura da planilha (Task 3)
  // cabecalho com o mojibake que a corretora de verdade exporta ("l�quido")
  const LIN = [
    ["Posição detalhada", null, null, null],
    [],
    ["CDB", "Rentabilidade a mercado", "Data vencimento", "Saldo l�quido"],
    ["CDB BANCO ALFA - NOV/2027", "+15,50%", "24/11/2027", "R$ 3.210,45"],
    ["CDB GAMA - JURO MENSAL - DEZ/2027", "+16,10%", "27/12/2027", "R$ 1.004,20"],
    ["CDB FINANCEIRA BETA - JAN/2027", "120,00% CDI", "14/01/2027", "R$ 2.100,00"],
    ["CDB IPCA TESTE - JAN/2030", "IPCA + 6,50%", "15/01/2030", "R$ 1.000,00"],
    ["CDB VELHO - AGO/2026", "+14,00%", "20/08/2026", "R$ 1.100,00"],
    [null, null, null, null],
    ["Total", null, null, "R$ 8.414,65"],
  ];
  const r = V.ler(LIN, { posicao: "2026-09-19" });
  ok(r.ok, "acha o cabecalho mesmo com mojibake no 'Saldo liquido'");
  igual(r.linha, 2, "cabecalho na 3a linha");
  igual(r.cdbs.length, 3, "3 CDBs validos");
  igual(r.cdbs[0], { nome:"CDB BANCO ALFA - NOV/2027", emissor:"BANCO ALFA", indexador:"pre", taxa:0.155,
                     vencimento:"2027-11-24", saldo_liquido:3210.45, data_aplicacao:null, valor_aplicado:null,
                     juros_mensais:false }, "linha pre completa");
  ok(r.cdbs[1].juros_mensais && r.cdbs[1].emissor === "GAMA", "'JURO MENSAL' no nome liga os juros mensais");
  igual([r.cdbs[2].indexador, r.cdbs[2].taxa], ["cdi", 1.2], "120,00% CDI");
  igual(r.avisos.map(a => a.linha), [7, 8], "avisos com o numero da linha da planilha (IPCA e vencido)");
  ok(/IPCA/.test(r.avisos[0].msg) && /venceu em 20\/08\/2026/.test(r.avisos[1].msg), "motivo de cada aviso");

  const r2 = V.ler([["Ativo", "Indexador", "Taxa", "Vencimento", "Valor Líquido (R$)", "Data de Aplicação", "Valor Aplicado"],
                    ["LCI ZETA", "CDI", "95%", "2027-03-01", 1500.5, "2025-03-01", 1400],
                    ["CDB ETA", "PRÉ", 0.155, 46715, "1.234,56", 45726, "1.000,00"]], { posicao: "2026-09-19" });
  ok(r2.ok, "sinonimos: Ativo / Indexador+Taxa / Vencimento / Valor Liquido / Data de Aplicacao / Valor Aplicado");
  igual([r2.cols.aplicacao, r2.cols.valorAplicado, r2.cols.indexador, r2.cols.taxa, r2.cols.saldo], [5, 6, 1, 2, 4], "mapa das colunas");
  igual([r2.cdbs[0].indexador, r2.cdbs[0].taxa, r2.cdbs[0].data_aplicacao, r2.cdbs[0].valor_aplicado], ["cdi", 0.95, "2025-03-01", 1400], "CDI + 95%");
  igual([r2.cdbs[1].indexador, r2.cdbs[1].taxa, r2.cdbs[1].vencimento, r2.cdbs[1].data_aplicacao], ["pre", 0.155, "2027-11-24", "2025-03-10"],
        "PRÉ + 0,155 e datas seriais do Excel");
  const r3 = V.ler([["CDB", "Taxa", "Vencimento"], ["CDB Z", "+15%", "01/01/2028"]], {});
  ok(!r3.ok, "sem a coluna de saldo nao importa");
  igual(r3.faltando, ["Saldo líquido"], "e diz qual coluna falta");
  igual(V.mapearColunas(["Taxa a mercado", "Taxa de aplicação", "CDB", "Vencimento", "Saldo"]).taxa, 1,
        "'Taxa de aplicacao' vence 'Taxa a mercado'");
  const ra = V.lerAbas([{ nome:"Resumo", linhas:[["Carteira"], ["Total", 10]] }, { nome:"Sua carteira", linhas: LIN }], { posicao:"2026-09-19" });
  ok(ra.ok && ra.aba === "Sua carteira" && ra.cdbs.length === 3, "lerAbas pula a aba sem cabecalho");
  const rv = V.lerAbas([{ nome:"x", linhas:[["Nada aqui"]] }], {});
  ok(!rv.ok && rv.faltando.length === 4, "lerAbas sem nenhuma aba valida devolve o que falta");

  // ==MAIS_TESTES==

  fim();
})().catch(e => { ok(false, "excecao: " + (e && e.stack || e)); fim(); });
