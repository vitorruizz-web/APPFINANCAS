// Arrastar para o lado troca o mes -- o mesmo que as setas ‹ › ja fazem, no
// gesto que a navegacao por mes sugere. Nao intercepta enquanto se digita um
// saldo, nem dentro de um grafico (que rola na horizontal).
function ligarArrasto(el){
  let x0 = 0, y0 = 0, valido = false;
  el.addEventListener("touchstart", ev => {
    const t = ev.changedTouches[0];
    x0 = t.clientX; y0 = t.clientY;
    valido = !ev.target.closest(".grafwrap") &&
             !(document.activeElement && document.activeElement.classList &&
               document.activeElement.classList.contains("s-cel"));
  }, { passive:true });
  el.addEventListener("touchend", ev => {
    if (!valido) return;
    const t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45) return;
    mesAtual = somaMes(mesAtual, dx < 0 ? 1 : -1);
    render();
  }, { passive:true });
}

function ligarNavPat(el){
  ligarArrasto(el);
  document.getElementById("p-ant").onclick  = () => { mesAtual = somaMes(mesAtual,-1); render(); };
  document.getElementById("p-prox").onclick = () => { mesAtual = somaMes(mesAtual, 1); render(); };
  const nc = document.getElementById("nova-conta");
  if (nc) nc.onclick = () => folhaConta(null);
  el.querySelectorAll(".ed-conta").forEach(b =>
    b.onclick = () => folhaConta(estado.contas.find(c => c.id === b.dataset.id)));
  // Preencher os saldos e ENCADEAR de um campo para o outro -- e assim que o mes
  // e fechado, seis campos seguidos. Duas travas moravam aqui:
  //
  // 1. render() DESTROI e recria os inputs (o foco vai parar no <body>). Chamado
  //    no blur, ele refazia o DOM enquanto o dedo ainda estava indo para o campo
  //    seguinte: o no que ia receber o toque deixava de existir, o teclado
  //    fechava e o valor "nao pegava". No desktop o mousedown fixa o foco antes
  //    e o erro passa despercebido -- por isso so acontecia no celular.
  //    Agora o redesenho e ADIADO e so acontece se o foco saiu de todos os
  //    campos: encadear campo a campo nao refaz nada.
  // 2. sair de um campo SEM mudar nada gravava e redesenhava do mesmo jeito.
  //    Agora compara com o valor que veio na tela e nao faz nada se for igual.
  const saldoFocado = () => document.activeElement &&
    document.activeElement.classList && document.activeElement.classList.contains("s-cel");
  const redesenhar = () => { if (!saldoFocado()) render(); };

  const cels = [...el.querySelectorAll(".s-cel")];
  cels.forEach((inp, i) => {
    inp.addEventListener("focus", () => inp.select());
    inp.addEventListener("blur", async () => {
      const v = parseNum(inp.value), antes = parseNum(inp.defaultValue);
      if (v === null) { inp.value = inp.defaultValue; setTimeout(redesenhar, 0); return; }
      if (antes !== null && Math.abs(v - antes) < 1e-9) return;   // nada mudou
      inp.defaultValue = inp.value;
      // try/finally: se a gravacao falhar (offline, sessao vencida, disfarce), o
      // redesenho tem de acontecer do mesmo jeito -- senao a tela fica mostrando
      // um valor que o banco nao tem. O codigo antigo chamava render() DEPOIS do
      // await, entao um erro deixava a tela mentindo em silencio.
      try { await definirSaldo(mesAtual, inp.dataset.conta, v); }
      finally { setTimeout(redesenhar, 0); }
    });
    // Enter/"Avancar" leva ao proximo campo ainda vazio -- no celular o teclado
    // continua aberto e o mes fecha sem tirar o dedo da tela.
    inp.addEventListener("keydown", ev => {
      if (ev.key !== "Enter") return;
      ev.preventDefault();
      const resto = cels.slice(i + 1).concat(cels.slice(0, i));
      const alvo = resto.find(o => !o.value.trim()) || null;
      if (alvo) alvo.focus(); else inp.blur();
    });
  });
  const cp = document.getElementById("p-copiar");
  if (cp) cp.onclick = copiarMesAnterior;
  el.querySelectorAll(".ir-mes").forEach(b =>
    b.onclick = () => { mesAtual = b.dataset.comp; render(); });
}

// ---------------------------------------------------------------- APONTAR
function blocoApontar(ativas){
  const saldos = saldosNum(), sal = saldos[mesAtual] || {};
  const m = mesProj(mesAtual), info = estado.meses[mesAtual] || {};
  const noMes = ativas.filter(c => contaValeEm(c, mesAtual));
  const falta = CONTAS.faltando(estado.contas, saldos, mesAtual);
  const soma = noMes.reduce((a,c) => a + (+sal[c.id] || 0), 0);
  const cor = CONTAS.paleta(estado.contas);
  const tem = id => sal[id] !== undefined && sal[id] !== null;

  let out = "";
  for (const c of ativas){
    const vale = contaValeEm(c, mesAtual);
    out += '<div class="lrow">' +
      '<button class="nm ed-conta" data-id="' + c.id + '">' +
        '<i class="pt" style="background:' + cor[c.id] + '"></i><span class="tx">' + esc(c.nome) + '</span></button>' +
      '<span class="rl">' + (vale
        ? (tem(c.id) && soma > 0 ? (sal[c.id]/soma*100).toFixed(0) + "%" : "")
        : '<span class="d3">a partir de ' + rotulo(c.inicio) + '</span>') + '</span>' +
      (vale
        ? '<input class="cel s-cel" data-conta="' + c.id + '" value="' + esc(tem(c.id) ? fmtn(sal[c.id]) : "") +
          '" placeholder="—" inputmode="decimal" enterkeyhint="next" autocomplete="off"' +
          ' aria-label="Saldo de ' + esc(c.nome) + '">'
        : '<span class="cel zero" style="text-align:right">—</span>') +
    '</div>';
  }

  out += '<div class="tot">';
  if (!noMes.length){
    // Mes anterior ao inicio das contas: quem manda e o realizado da planilha.
    out += '<div class="destaque"><span>Apurado</span><span>' + esc(fmt(info.realizado_override)) + '</span></div>' +
      '<div><span>Previsão do mês</span><span>' + esc(fmt(m ? m.previsao : null)) + '</span></div>' +
      '<div><span class="d3 t12" style="line-height:1.5">' + (vazio(info.realizado_override)
        ? 'Nenhuma conta vale neste mês.'
        : 'Este mês foi apurado antes de as contas existirem: o valor vem da planilha e continua valendo.') +
      '</span><span></span></div>';
  } else if (falta.length){
    out += '<div><span>Contas preenchidas</span><span class="abr">' +
        (noMes.length - falta.length) + ' de ' + noMes.length + '</span></div>' +
      '<div><span>Parcial até aqui</span><span class="d2">' + esc(fmt(soma)) + '</span></div>' +
      '<div><span class="d3 t12" style="line-height:1.5">Falta ' +
        esc(falta.map(c => c.nome).join(", ")) + '. O mês só vira patrimônio apurado com todas as ' +
        'contas preenchidas — somar parte delas registraria um patrimônio menor do que o real.' +
      '</span><span></span></div>';
  } else {
    out += '<div class="destaque"><span>Patrimônio apurado</span><span>' + esc(fmt(soma)) + '</span></div>' +
      '<div><span>Previsão do mês</span><span>' + esc(fmt(m ? m.previsao : null)) + '</span></div>';
    out += (m && !m.aberto)
      ? '<div><span>Diferença</span><span class="' + (m.diferenca>=0?"pos":"neg") + '">' +
        esc(fmtsin(m.diferenca)) + ' <span class="d3 t12">' + fmtpct(m.variacao) + '</span></span></div>'
      : '<div><span>Situação</span><span class="abr">em aberto</span></div>';
  }
  out += '</div>';

  const ant = somaMes(mesAtual, -1);
  const podeCopiar = falta.length && Object.keys(saldos[ant] || {}).length;
  out += '<div class="acoes">' +
    (podeCopiar ? '<button class="btn" id="p-copiar">Copiar de ' + rotulo(ant) + '</button>' : "") +
    '<button class="btn" id="nova-conta">Nova conta</button>' +
    '<button class="btn plain xls" data-x="patrimonio">Excel</button></div>';

  if (proj.filter(x => !x.aberto).length > 1){
    out += '<div class="hdr"><h2>Evolução do patrimônio</h2><span class="aux">' +
      rotulo(proj[0].competencia) + ' → ' + rotulo(proj[proj.length-1].competencia) +
      '</span></div><div class="rule"></div><div class="grafwrap" id="evol"></div>';
  }
  return out;
}

// Traz os saldos do mes anterior para so editar o que mudou. Nao sobrescreve
// conta que ja tem valor neste mes.
async function copiarMesAnterior(){
  const saldos = saldosNum(), ant = saldos[somaMes(mesAtual,-1)] || {};
  const alvo = CONTAS.faltando(estado.contas, saldos, mesAtual).filter(c => ant[c.id] !== undefined);
  if (!alvo.length){ toast("Não há saldo no mês anterior para copiar"); return; }
  for (const c of alvo) await definirSaldo(mesAtual, c.id, ant[c.id]);
  render();
  toast(alvo.length + (alvo.length > 1 ? " contas copiadas" : " conta copiada"));
}

// ---------------------------------------------------------------- ANALISE
let _analise = null;   // o que os graficos precisam, montado durante o render
function blocoAnalise(ativas){
  const saldos = saldosNum();
  const comps = CONTAS.apurados(estado.contas, saldos);
  _analise = null;
  if (!comps.length){
    return '<div class="vazio"><b>Nenhum mês apurado ainda.</b><br>' +
      'Preencha o saldo de <b>todas</b> as contas em Apontar e a análise nasce aqui.</div>';
  }
  // O mes em foco e o selecionado; se ele ainda nao foi apurado, o ultimo que foi.
  const foco = comps.includes(mesAtual) ? mesAtual : comps[comps.length-1];
  const comp = CONTAS.composicao(estado.contas, saldos, foco);
  const varia = CONTAS.variacao(estado.contas, saldos, foco);
  _analise = { comps: comps, foco: foco, comp: comp,
               serie: CONTAS.serie(estado.contas, saldos) };

  const total = comp.reduce((a,c) => a + c.saldo, 0);
  let out = "";
  if (foco !== mesAtual){
    out += '<div class="aviso">' + rotuloL(mesAtual) + ' ainda não foi apurado. ' +
      'A análise abaixo é de <b>' + rotuloL(foco) + '</b>.</div>';
  }

  // --- 1. composicao do mes
  // O que mudou: a conta que puxou o mes, em uma frase. varia ja calcula tudo.
  if (varia.anterior && varia.contas.length && varia.total.delta){
    const lider = varia.contas[0].delta >= 0 ? varia.contas[0]
                : varia.contas[varia.contas.length - 1];
    if (lider && lider.delta)
      out += '<p class="mudou"><b>' + esc(lider.nome) + '</b> ' +
        (lider.delta >= 0 ? "puxou o mês" : "foi o que mais pesou") + ': ' +
        esc(fmtsin(lider.delta)) + ' dos ' + esc(fmtsin(varia.total.delta)) +
        ' que o patrimônio ' + (varia.total.delta >= 0 ? "subiu" : "caiu") + '.</p>';
  }
  out += '<div class="hdr"><h2>Composição</h2><span class="aux">' + rotulo(foco) +
    ' · <span id="comp-total" data-v="' + total + '">' + esc(fmt(total)) +
    '</span></span></div><div class="rule"></div>';
  out += '<div class="compwrap"><div class="roscawrap" id="rosca"></div><div class="cbars">';
  for (const c of comp){
    out += '<button class="cbar" data-fatia="' + esc(c.id) + '"' +
      (c.partes ? ' title="' + esc(c.partes.join(", ")) + '"' : "") + '><div class="cb-top">' +
      '<span class="cb-nm"><i class="pt" style="background:' + c.cor + '"></i>' + esc(c.nome) + '</span>' +
      '<span class="cb-v">' + esc(fmt(c.saldo)) + ' <b>' + (c.pct*100).toFixed(0) + '%</b></span></div>' +
      '<div class="cb-trilha"><div class="cb-fill" style="width:' + (c.pct*100).toFixed(2) +
        '%;background:' + c.cor + '"></div>' +
        (metaDe(c.id) != null
          ? '<i class="cb-meta" style="left:' + (metaDe(c.id)*100).toFixed(2) + '%" title="meta ' +
            (metaDe(c.id)*100).toFixed(0) + '%"></i>' : "") +
      '</div></button>';
  }
  out += '</div></div>';
  // Concentracao: para patrimonio, o risco nao esta no valor, esta em quanto ele
  // depende de uma conta so. A rosca sugere isso; aqui vira numero.
  if (comp.length > 2){
    const top = comp.slice(0, 3).reduce((a,c) => a + c.pct, 0);
    out += '<p class="conc">As 3 maiores somam <b>' + (top*100).toFixed(0) + '%</b>' +
      (comp[0].pct >= .4 ? ' — só <b>' + esc(comp[0].nome) + '</b> responde por ' +
        (comp[0].pct*100).toFixed(0) + '%.' : '.') + '</p>';
  }

  // --- 2. variacao contra o mes apurado anterior
  out += '<div class="hdr"><h2>Variação</h2><span class="aux">' +
    (varia.anterior ? "contra " + rotulo(varia.anterior) : "primeiro mês apurado") +
    '</span></div><div class="rule"></div>';
  if (!varia.anterior){
    out += '<div class="vazio t13">Sem mês anterior apurado para comparar. ' +
      'A partir do segundo mês esta seção mostra quanto cada conta rendeu.</div>';
  } else {
    const t = varia.total;
    out += '<div class="tot" style="margin-top:0"><div class="destaque"><span>Patrimônio</span>' +
      '<span class="' + (t.delta>=0?"pos":"neg") + '">' + esc(fmtsin(t.delta)) +
      ' <span class="d3 t12">' + fmtpct(t.pct) + '</span></span></div></div>';
    for (const c of varia.contas){
      out += '<div class="lrow">' +
        '<span class="nm"><i class="pt" style="background:' + c.cor + '"></i><span class="tx">' + esc(c.nome) + '</span></span>' +
        '<span class="rl">' + (c.fatia === null || c.delta === 0 ? "" :
          (c.fatia<0?'−':'') + Math.abs(c.fatia*100).toFixed(0) + '% da variação') + '</span>' +
        '<span class="cel dupla ' + (c.delta>0?"pos":c.delta<0?"neg":"zero") + '">' +
          esc(fmtsin(c.delta)) + '<b class="d3 t11">' + (c.pct === null ? "" : fmtpct(c.pct)) +
        '</b></span></div>';
    }
  }

  // --- 3. evolucao empilhada
  out += '<div class="hdr"><h2>Evolução por conta</h2><span class="aux">' +
    (comps.length > 1 ? rotulo(comps[0]) + " → " + rotulo(comps[comps.length-1]) : "") +
    '</span></div><div class="rule"></div>';
  out += comps.length > 1
    ? '<div class="grafwrap" id="pilha"></div>'
    : '<div class="vazio t13">A partir do segundo mês apurado o app empilha as contas ' +
      'e mostra de onde veio o crescimento.</div>';

  // --- 4. trajetoria de cada conta
  out += '<div class="hdr"><h2>Trajetória de cada conta</h2><span class="aux">' +
    (comps.length > 2 ? "uma linha por conta" : "") + '</span></div><div class="rule"></div>';
  out += comps.length > 2
    ? '<div class="grafwrap" id="linhas"></div>'
    : '<div class="vazio t13">Com três meses apurados dá para comparar a trajetória ' +
      'de cada conta lado a lado.</div>';

  out += '<div class="acoes"><button class="btn plain xls" data-x="patrimonio">Excel</button></div>';
  return out;
}

// ---------------------------------------------------------------- ROSCA
// A composicao do mes como anel. Duas decisoes que valem registrar:
//
// 1. O centro mostra um PERCENTUAL, nunca o total. No modo discreto os valores
//    sao escalados, mas percentual e razao -- invariante de escala. Entao a
//    rosca continua verdadeira disfarcada, e a lista ao lado ja carrega os
//    valores: repetir o total no centro seria redundancia que mente metade do
//    tempo.
// 2. Sem tooltip proprio. A selecao e COMPARTILHADA com as barras: tocar a
//    fatia levanta a linha e tocar a linha levanta a fatia. Um estado, duas
//    vistas.
//
// A troca de mes anima os arcos (stroke-dasharray com transicao) para o
// patrimonio se rebalancear a vista -- e o unico movimento nao pedido da tela.
// prefers-reduced-motion ja desliga tudo no reset global.
let _fatia = null;
// Guarda o desenho anterior do anel POR CONTA. Trocar de mes chama render(), que
// refaz o container inteiro -- sem esta memoria os arcos nasceriam ja no lugar
// certo e nao haveria de onde transicionar. Com ela, o anel nasce na composicao
// do mes anterior e caminha para a do mes novo.
let _roscaPrev = {};

function desenharRosca(){
  const box = document.getElementById("rosca");
  if (!box || !_analise || !_analise.comp || !_analise.comp.length) return;
  const comp = _analise.comp;
  if (!comp.some(c => c.saldo > 0)) { box.innerHTML = ""; return; }

  const larg = Math.round(box.getBoundingClientRect().width) || 260;
  const W = Math.max(168, Math.min(matchMedia("(min-width:1000px)").matches ? 240 : 208, larg)), H = W;
  const esp = Math.round(W * 0.13);
  const r = (W - esp) / 2 - 2, cx = W / 2, cy = H / 2, C = 2 * Math.PI * r;

  // Sem nada escolhido o centro mostra 100% / Total, e nenhum arco fica em
  // destaque. Mostrar a maior conta ali dava a impressao de que ela estava
  // selecionada -- o estado "nada escolhido" tem de parecer o que e.
  const sel = comp.find(c => c.id === _fatia) || null;

  // O SVG so e RECONSTRUIDO quando muda o conjunto de contas ou o tamanho. Nos
  // demais casos -- trocar de mes, escolher uma fatia -- os MESMOS <circle>
  // recebem atributos novos, e e so por isso que a transicao CSS acontece: no
  // recriado do zero nao tem estado anterior para transicionar. Trocar de mes
  // faz os arcos caminharem de uma composicao para a outra.
  const chave = comp.map(c => c.id).join("|") + "@" + W;
  const novo = box.dataset.chave !== chave;
  if (novo){
    // Nasce onde o anel estava: mesma conta, mesmo tamanho de arco de antes.
    const arcos = comp.map(c => {
      const p = _roscaPrev[c.id];
      return '<circle class="fx" data-fatia="' + esc(c.id) + '" cx="' + cx + '" cy="' + cy +
        '" r="' + r.toFixed(1) + '" fill="none" stroke="' + c.cor + '" stroke-width="' + esp +
        '" stroke-dashoffset="' + (p ? p.off : 0) + '"' +
        ' stroke-dasharray="' + (p ? p.on : 0) + ' ' + C.toFixed(2) + '"><title></title></circle>';
    }).join("");
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '"' +
      ' role="img" aria-label="Composicao do patrimonio por conta">' +
      '<g transform="rotate(-90 ' + cx + ' ' + cy + ')">' + arcos + '</g>' +
      '<text class="r-pct" x="' + cx + '" y="' + (cy + 2) + '" text-anchor="middle"></text>' +
      // O nome fica em cinza de proposito: na cor da conta (#CD632D e afins) ele
      // da ~4,3:1 contra o fundo, abaixo do minimo para 11,5px. Quem aponta a
      // conta e o arco mais grosso no anel, nao a cor do texto.
      '<text class="r-nm" x="' + cx + '" y="' + (cy + 21) + '" text-anchor="middle"></text></svg>';
    box.dataset.chave = chave;
    box.querySelectorAll(".fx").forEach(a => a.addEventListener("click", () => {
      _fatia = (_fatia === a.dataset.fatia) ? null : a.dataset.fatia;
      desenharRosca();
    }));
  }

  // Os circulos estao na MESMA ordem de `comp` (foi assim que foram criados).
  const arcosEl = box.querySelectorAll(".fx");
  const pintar = () => {
  let acum = 0;
  comp.forEach((c, i) => {
    const arco = arcosEl[i];
    if (!arco) return;
    const len = Math.max(0, c.pct) * C;
    const vao = Math.min(3, len * 0.4);            // respiro entre fatias
    const on = Math.max(0.6, len - vao);
    const foco = !!sel && c.id === sel.id;
    arco.setAttribute("stroke", c.cor);
    arco.setAttribute("stroke-width", foco ? esp + 5 : esp);
    arco.setAttribute("stroke-dasharray", on.toFixed(2) + " " + (C - on).toFixed(2));
    arco.setAttribute("stroke-dashoffset", (-acum).toFixed(2));
    arco.setAttribute("opacity", _fatia && !foco ? ".46" : "1");
    arco.firstChild.textContent = c.nome + " · " + (c.pct * 100).toFixed(1) + "%";
    _roscaPrev[c.id] = { on: on.toFixed(2), off: (-acum).toFixed(2) };
    acum += len;
  });
  };
  // Recem-criado, forca o reflow ANTES de pintar: o navegador precisa ter
  // calculado o estado inicial para ter de onde transicionar. Nao uso
  // requestAnimationFrame aqui de proposito -- em aba oculta ele nao roda e os
  // arcos ficariam parados em zero.
  if (novo) void box.offsetWidth;
  pintar();

  box.querySelector(".r-pct").innerHTML =
    (sel ? (sel.pct * 100).toFixed(0) : "100") + '<tspan class="r-sig">%</tspan>';
  box.querySelector(".r-nm").textContent = sel
    ? (sel.nome.length > 18 ? sel.nome.slice(0, 17) + "…" : sel.nome)
    : "Total";
  marcarFatia();
}

// A linha correspondente na lista acompanha a fatia -- sem redesenhar a tela.
function marcarFatia(){
  document.querySelectorAll(".cbar").forEach(b =>
    b.classList.toggle("on", !!_fatia && b.dataset.fatia === _fatia));
}

// O total da Composicao caminha do mes anterior para o novo, no mesmo tempo dos
// arcos: anel e numero se movem juntos, entao a troca de mes e UM movimento so.
let _totalPrev = null;
function contarTotal(){
  const el = document.getElementById("comp-total");
  if (!el) return;
  const alvo = +el.dataset.v, de = (_totalPrev === null) ? alvo : _totalPrev;
  _totalPrev = alvo;
  const parado = de === alvo || !window.requestAnimationFrame ||
    matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (parado){ el.textContent = fmt(alvo); return; }
  const t0 = performance.now();
  const passo = t => {
    const k = Math.min(1, (t - t0) / 500), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(de + (alvo - de) * e);
    if (k < 1) requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function desenharAnalise(){
  if (!_analise) return;
  desenharRosca();
  contarTotal();
  document.querySelectorAll(".cbar").forEach(b => b.onclick = () => {
    _fatia = (_fatia === b.dataset.fatia) ? null : b.dataset.fatia;
    desenharRosca();
  });
  desenharPilha();
  desenharLinhas();
}

// Escala comum aos dois graficos por conta: largura MEDIDA do container --
// viewBox fixo com preserveAspectRatio="none" esmaga o texto pela metade.
function eixoConta(box, H, mx, mn){
  const W = Math.max(280, Math.round(box.getBoundingClientRect().width) || 340);
  const PL = 46, PR = 12, PT = 14, PB = 26, n = _analise.comps.length;
  return { W:W, H:H, PL:PL, PR:PR, PT:PT, PB:PB,
    x: i => n < 2 ? PL : PL + (i/(n-1)) * (W-PL-PR),
    y: v => PT + (1 - (v-mn)/((mx-mn)||1)) * (H-PT-PB) };
}
function gradeConta(e, mx, mn){
  let g = "";
  for (let k = 0; k <= 4; k++){
    const v = mn + (mx-mn)*k/4, yy = e.y(v);
    g += '<line x1="' + e.PL + '" y1="' + yy.toFixed(1) + '" x2="' + (e.W-e.PR) + '" y2="' + yy.toFixed(1) +
      '" stroke="var(--line)" stroke-dasharray="2 4"/>' +
      '<text x="' + (e.PL-8) + '" y="' + (yy+3.5).toFixed(1) + '" text-anchor="end" font-size="10" ' +
      'fill="var(--ink-4)">' + fmtk(v) + '</text>';
  }
  return g;
}
// Rotulos de mes: todos quando cabem, senao espacados (o ultimo sempre entra).
function rotulosMes(e){
  const cs = _analise.comps, passo = Math.max(1, Math.ceil(cs.length / (e.W > 420 ? 8 : 5)));
  let t = "";
  cs.forEach((c,i) => {
    if (i % passo && i !== cs.length-1) return;
    const anc = i === 0 ? "start" : i === cs.length-1 ? "end" : "middle";
    t += '<text x="' + e.x(i).toFixed(1) + '" y="' + (e.H-9) + '" text-anchor="' + anc + '" font-size="10" ' +
      'fill="' + (c === _analise.foco ? "var(--ink-2)" : "var(--ink-4)") + '">' + rotulo(c) + '</text>';
  });
  return t;
}
// Areas invisiveis: tocar num mes leva a analise inteira para ele.
function alvosMes(e){
  const cs = _analise.comps;
  const larg = cs.length > 1 ? (e.W-e.PL-e.PR)/(cs.length-1) : e.W-e.PL-e.PR;
  return cs.map((c,i) =>
    '<rect class="ir-mes" data-comp="' + c + '" x="' + (e.x(i)-larg/2).toFixed(1) + '" y="' + e.PT +
    '" width="' + larg.toFixed(1) + '" height="' + (e.H-e.PT-e.PB) +
    '" fill="transparent" style="cursor:pointer"><title>' + rotulo(c) + '</title></rect>').join("");
}

// Empilhado: a altura e o patrimonio, cada faixa e uma conta. Um vao de 2px na
// cor do fundo separa as faixas -- sem ele duas contas vizinhas viram um borrao.
function desenharPilha(){
  const box = document.getElementById("pilha");
  if (!box) return;
  const ser = _analise.serie, cs = ser.competencias;
  const mx = Math.max.apply(null, ser.totais) * 1.04;
  const e = eixoConta(box, 240, mx, 0);

  let faixas = "", acum = cs.map(() => 0);
  for (const s of ser.series){
    const base = acum.slice();
    acum = acum.map((v,i) => v + s.valores[i]);
    const topo = acum.map((v,i) => (i?"L":"M") + e.x(i).toFixed(1) + " " + e.y(v).toFixed(1)).join(" ");
    const volta = base.map((v,i) => ({v:v,i:i})).reverse()
      .map(o => "L" + e.x(o.i).toFixed(1) + " " + e.y(o.v).toFixed(1)).join(" ");
    faixas += '<path d="' + topo + " " + volta + ' Z" fill="' + s.cor + '" opacity=".92"/>' +
      '<path d="' + topo + '" fill="none" stroke="var(--bg)" stroke-width="2" ' +
      'vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
  }
  const iFoco = cs.indexOf(_analise.foco);
  const marca = iFoco >= 0
    ? '<line x1="' + e.x(iFoco).toFixed(1) + '" y1="' + e.PT + '" x2="' + e.x(iFoco).toFixed(1) +
      '" y2="' + (e.H-e.PB) + '" stroke="var(--ink)" stroke-dasharray="3 3" opacity=".5"/>' : "";

  box.innerHTML = '<svg viewBox="0 0 ' + e.W + ' ' + e.H + '" width="' + e.W + '" height="' + e.H + '" ' +
    'role="img" aria-label="Patrimônio empilhado por conta, mês a mês">' +
    gradeConta(e, mx, 0) + faixas + marca + rotulosMes(e) + alvosMes(e) + '</svg>' +
    legendaContas(ser, cs.length-1, true);
}

// Uma linha por conta, em reais. Legenda com o valor do ultimo mes: identidade
// nunca fica so na cor.
function desenharLinhas(){
  const box = document.getElementById("linhas");
  if (!box) return;
  const ser = _analise.serie, cs = ser.competencias;
  const todos = ser.series.flatMap(s => s.valores);
  let mx = Math.max.apply(null, todos), mn = Math.min.apply(null, todos);
  const folga = (mx-mn)*0.08 || mx*0.05 || 1;
  mx += folga; mn = Math.max(0, mn - folga);
  const e = eixoConta(box, 240, mx, mn);

  const linhas = ser.series.map(s =>
    '<path d="' + s.valores.map((v,i) => (i?"L":"M") + e.x(i).toFixed(1) + " " + e.y(v).toFixed(1)).join(" ") +
    '" fill="none" stroke="' + s.cor + '" stroke-width="2" stroke-linejoin="round" ' +
    'stroke-linecap="round" vector-effect="non-scaling-stroke"/>').join("");
  const pontas = ser.series.map(s =>
    '<circle cx="' + e.x(cs.length-1).toFixed(1) + '" cy="' + e.y(s.valores[cs.length-1]).toFixed(1) +
    '" r="3.2" fill="' + s.cor + '" stroke="var(--bg)" stroke-width="2"/>').join("");

  box.innerHTML = '<svg viewBox="0 0 ' + e.W + ' ' + e.H + '" width="' + e.W + '" height="' + e.H + '" ' +
    'role="img" aria-label="Trajetória do saldo de cada conta">' +
    gradeConta(e, mx, mn) + linhas + pontas + rotulosMes(e) + alvosMes(e) + '</svg>' +
    legendaContas(ser, cs.length-1);
}

// A legenda e obrigatoria nos dois graficos (identidade nunca fica so na cor),
// mas o VALOR aparece uma vez so: os dois mostram o mesmo ultimo mes.
function legendaContas(ser, i, comValor){
  return '<div class="legenda">' + ser.series.map(s =>
    '<span><i style="background:' + s.cor + '"></i>' + esc(s.nome) +
    (comValor ? ' <b class="d2">' + fmtk(s.valores[i]) + '</b>' : "") + '</span>').join("") + '</div>';
}

// Evolucao do patrimonio: o arco INTEIRO. Apurado (jade, cheio) onde existe,
// plano (aco, tracejado) seguindo ate o fim do horizonte, a faixa entre os dois
// mostrando a sobra acumulada, grade com valores e a marca do mes atual.
// Largura MEDIDA do container -- viewBox fixo esmaga texto e traco.
function desenharEvolucao(){
  const box = document.getElementById("evol");
  if (!box) return;
  const ps = proj;
  if (ps.length < 2){ box.innerHTML = ""; return; }

  const W = Math.max(280, Math.round(box.getBoundingClientRect().width) || 340);
  const H = 250, PL = 46, PR = 12, PT = 16, PB = 26;
  const vals = ps.flatMap(p => [p.previsao, p.realizado].filter(v => !vazio(v)));
  let mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  const folga = (mx - mn) * 0.10 || mx * 0.05 || 1;
  mx += folga; mn -= folga;
  const x = i => PL + (i/(ps.length-1)) * (W-PL-PR);
  const y = v => PT + (1 - (v-mn)/((mx-mn)||1)) * (H-PT-PB);

  let grade = "";
  for (let k = 0; k <= 4; k++){
    const v = mn + (mx-mn)*k/4, yy = y(v);
    grade += '<line x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W-PR) + '" y2="' + yy.toFixed(1) +
      '" stroke="var(--line)" stroke-dasharray="2 4"/>' +
      '<text x="' + (PL-8) + '" y="' + (yy+3.5).toFixed(1) + '" text-anchor="end" font-size="10" ' +
      'fill="var(--ink-4)">' + fmtk(v) + '</text>';
  }

  let eixo = "";
  ps.forEach((p,i) => {
    if (p.competencia.slice(5) !== "01-01") return;
    eixo += '<line x1="' + x(i).toFixed(1) + '" y1="' + PT + '" x2="' + x(i).toFixed(1) + '" y2="' + (H-PB) +
      '" stroke="var(--line)"/>' +
      '<text x="' + (x(i)+4).toFixed(1) + '" y="' + (H-9) + '" font-size="10" fill="var(--ink-4)">' +
      p.competencia.slice(0,4) + '</text>';
  });

  const dPrev = ps.map((p,i) => (i?"L":"M") + x(i).toFixed(1) + " " + y(p.previsao).toFixed(1)).join(" ");
  const reais = ps.map((p,i) => ({p,i})).filter(o => !o.p.aberto);
  const dReal = reais.map((o,k) => (k?"L":"M") + x(o.i).toFixed(1) + " " + y(o.p.realizado).toFixed(1)).join(" ");

  let faixa = "";
  if (reais.length > 1){
    const volta = reais.slice().reverse()
      .map(o => "L" + x(o.i).toFixed(1) + " " + y(o.p.previsao).toFixed(1)).join(" ");
    faixa = '<path d="' + dReal + " " + volta + ' Z" fill="var(--ouro)" opacity=".10"/>';
  }

  const iHoje = ps.findIndex(p => p.competencia === compHoje());
  const marcaHoje = iHoje >= 0
    ? '<line x1="' + x(iHoje).toFixed(1) + '" y1="' + PT + '" x2="' + x(iHoje).toFixed(1) + '" y2="' + (H-PB) +
      '" stroke="var(--sand)" stroke-dasharray="3 3" opacity=".8"/>' : "";
  const ult = reais[reais.length-1];
  const alvo = ult ? '<circle cx="' + x(ult.i).toFixed(1) + '" cy="' + y(ult.p.realizado).toFixed(1) +
      '" r="4.2" fill="var(--ouro)" stroke="var(--bg)" stroke-width="2"/>' : "";
  const fim = ps[ps.length-1];
  const rotFim = '<circle cx="' + x(ps.length-1).toFixed(1) + '" cy="' + y(fim.previsao).toFixed(1) +
      '" r="3" fill="var(--tif)"/>';

  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" ' +
    'role="img" aria-label="Patrimônio apurado e projetado ao longo do plano">' +
    defsOuro("E") + grade + eixo + faixa + marcaHoje +
    '<path d="' + dPrev + '" fill="none" stroke="var(--tif)" stroke-width="1.7" ' +
      'stroke-dasharray="5 4" vector-effect="non-scaling-stroke" opacity=".75"/>' +
    (dReal ? '<g filter="url(#bE)"><path d="' + dReal + '" fill="none" stroke="url(#gE)" ' +
      'stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" ' +
      'vector-effect="non-scaling-stroke"/>' + alvo + '</g>' : "") +
    rotFim + '</svg>' +
    '<div class="legenda">' +
      '<span><i class="sw-lin"></i>apurado' +
        (ult ? ' <b class="d2">' + fmtk(ult.p.realizado) + '</b>' : "") + '</span>' +
      '<span><i class="sw-tra"></i>plano <b class="d2">' + fmtk(fim.previsao) + ' em ' +
        rotulo(fim.competencia) + '</b></span>' +
      (iHoje >= 0 ? '<span><i class="sw-hoje"></i>hoje</span>' : "") +
    '</div>';
}
// Meta = quanto a conta DEVERIA representar do patrimonio, em fracao (0.25).
// Mora em estado.settings (fin_settings.data), nao numa coluna nova: e
// preferencia do usuario, nao dado do patrimonio, e assim nao exige migracao.
const metas = () => (estado.settings.metas = estado.settings.metas || {});
const metaDe = id => { const v = metas()[id]; return (v == null) ? null : +v; };

      '<span>Somar no patrimônio</span></label>' +

        else { const r = await salvar("fin_accounts", linha, "user_id,nome");
               if (r && r[0]){ estado.contas.push(r[0]); alvo = r[0]; } }
        const mv = parseNum(document.getElementById("c-meta").value);
        if (alvo && alvo.id){
          const M = metas();
          if (mv === null || mv <= 0) delete M[alvo.id]; else M[alvo.id] = Math.min(1, mv/100);
          await gravarPrefs();
        }
        fecharFolha(); reprojetar(); render(); toast(conta?"Conta salva":"Conta cadastrada");
      };
    });
}

// ============================================================
// VENCIMENTOS
// Quanto cai na conta, dia a dia, com os CDBs da planilha da corretora. O
// calculo mora no bloco <vencimentos>; aqui so busca taxa, desenha e grava.
// ============================================================
let cdbsIndisponivel = false;   // tabela fin_cdbs ausente (migracao 006 nao aplicada)
let agendaCache = null;
const ordenarCdbs = l => l.slice().sort((a, b) =>
  a.vencimento.localeCompare(b.vencimento) || String(a.nome).localeCompare(String(b.nome), "pt-BR"));

// A planilha e a carteira INTEIRA: grava o lote novo e so entao apaga os
// anteriores. Se o DELETE falhar, indexar() fica so com o lote mais recente.
const tipoDoNome = nome => (/^\s*(CDB|RDB|LCI|LCA|LC)\b/i.exec(nome || "") || [0, "CDB"])[1].toUpperCase();
async function gravarPosicao(cdbs, pos){
  const lote = new Date().toISOString();
  const nulo = v => v === undefined ? null : v;
  // mesmas chaves em todas as linhas (exigencia do insert em lote do PostgREST);
  // linha da planilha nao traz corretora, id externo, bruto nem spread
  const linhas = cdbs.map(c => ({ lote: lote, origem: c.origem || "planilha", data_posicao: c.data_posicao || pos,
    instituicao: nulo(c.instituicao), externo_id: nulo(c.externo_id), tipo: c.tipo || tipoDoNome(c.nome),
    nome: c.nome, emissor: c.emissor, indexador: c.indexador, taxa: c.taxa, spread: nulo(c.spread),
    vencimento: c.vencimento, saldo_liquido: c.saldo_liquido, valor_bruto: nulo(c.valor_bruto),
    data_aplicacao: nulo(c.data_aplicacao), valor_aplicado: nulo(c.valor_aplicado), juros_mensais: !!c.juros_mensais,
    isento_ir: c.isento_ir !== undefined && c.isento_ir !== null ? !!c.isento_ir : /^\s*(LCI|LCA)\b/i.test(c.nome || "") }));
  let r;
  try { r = await salvar("fin_cdbs", linhas); } catch (e){ return false; }
  if (!r || !r.length) return false;
  try { await sbFetch("fin_cdbs?lote=neq." + encodeURIComponent(r[0].lote), { method:"DELETE" }); }
  catch (e){ console.warn("lotes antigos ficaram no banco:", e.message); }
  estado.cdbs = ordenarCdbs(r);
  cdbsIndisponivel = false; agendaCache = null;
  // o cache offline tambem passa a ter a posicao nova (posicao 9 = fin_cdbs)
  try {
    const c = JSON.parse(localStorage.getItem(chaveCache()) || "null");
    if (c && c.length){ c[9] = r; localStorage.setItem(chaveCache(), JSON.stringify(c)); }
  } catch (e){}
  return true;
}

// ---------------------------------------------------------------- taxas do BC
// CDI publicado (SGS 4389) e Selic meta (SGS 432) desde a data da posicao, mais
// as medianas do Focus. Dado publico: cache NO APARELHO, nao no banco. Cada
// fonte vale por si -- o Focus fora do ar nao apaga a Selic que chegou.
let taxas = null;
try { taxas = JSON.parse(localStorage.getItem("fin_taxas_bcb") || "null"); } catch (e){}
let buscandoTaxas = null, taxasTentouEm = 0;
const TAXAS_VALIDADE = 6 * 3600 * 1000;
const OLINDA = "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/";
const isoDeBR = s => s.slice(6, 10) + "-" + s.slice(3, 5) + "-" + s.slice(0, 2);
// so os pontos em que o valor muda, mais o ultimo dia (que diz ate onde a serie vai)
const mudancas = (l, campo) => l.filter((x, i) => i === 0 || i === l.length - 1 || x[campo] !== l[i - 1][campo]);
function buscarTaxas(forcar){
  const inicio = VENC.dn(inicioPosicao()) - 10, hoje = VENC.dn(hojeISO());
  const idade = taxas && taxas.buscado ? Date.now() - Date.parse(taxas.buscado) : Infinity;
  const cobre = !!(taxas && taxas.desde && VENC.dn(taxas.desde) <= inicio);
  if (!forcar && idade < TAXAS_VALIDADE && cobre) return Promise.resolve(taxas);
  // uma tentativa a cada 5 min no maximo: com o BC fora do ar, cada redesenho
  // dispararia quatro requisicoes
  if (!forcar && Date.now() - taxasTentouEm < 5 * 60 * 1000) return Promise.resolve(taxas);
  if (buscandoTaxas) return buscandoTaxas;
  taxasTentouEm = Date.now();
  const br = d => VENC.dataBR(VENC.iso(d));
  const sgs = (n, ate) => "https://api.bcb.gov.br/dados/serie/bcdata.sgs." + n +
    "/dados?formato=json&dataInicial=" + br(inicio) + "&dataFinal=" + br(ate);
  const j = u => fetch(u, { cache:"no-store" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  buscandoTaxas = Promise.allSettled([
    j(sgs(4389, hoje)), j(sgs(432, hoje + 200)),
    j(OLINDA + "ExpectativasMercadoSelic?$top=60&$orderby=Data%20desc&$filter=baseCalculo%20eq%200" +
      "&$select=Data,Reuniao,Mediana&$format=json"),
    j(OLINDA + "ExpectativasMercadoAnuais?$top=40&$orderby=Data%20desc&$filter=Indicador%20eq%20'Selic'%20and%20baseCalculo%20eq%200" +
      "&$select=Data,DataReferencia,Mediana&$format=json"),
  ]).then(([c, s, fr, fa]) => {
    const lista = r => r.status === "fulfilled" && Array.isArray(r.value) && r.value.length ? r.value : null;
    const odata = r => r.status === "fulfilled" && r.value && Array.isArray(r.value.value) && r.value.value.length ? r.value.value : null;
    const novo = Object.assign({}, taxas || {});
    let chegou = false;
    const cv = lista(c), sv = lista(s), rv = odata(fr), av = odata(fa);
    if (cv){
      novo.historico = mudancas(cv.map(x => ({ dia: isoDeBR(x.data), cdi: +x.valor })), "cdi");
      novo.cdi = +cv[cv.length - 1].valor; novo.cdiData = isoDeBR(cv[cv.length - 1].data); chegou = true;
    }
    if (sv){
      novo.meta = mudancas(sv.map(x => ({ dia: isoDeBR(x.data), selic: +x.valor })), "selic");
      novo.selic = +sv[sv.length - 1].valor; novo.metaAte = isoDeBR(sv[sv.length - 1].data); chegou = true;
    }
    if (rv || av){
      const f = {};
      if (rv){ f.data = rv[0].Data; f.reunioes = rv.filter(x => x.Data === rv[0].Data).map(x => ({ r: x.Reuniao, v: +x.Mediana })); }
      if (av){ f.data = f.data || av[0].Data; f.anuais = av.filter(x => x.Data === av[0].Data).map(x => ({ ano: +x.DataReferencia, v: +x.Mediana })); }
      novo.focus = f; chegou = true;
    }
    if (!chegou) throw new Error("o Banco Central não respondeu");
    if (cv && sv) novo.desde = VENC.iso(inicio);
    novo.buscado = new Date().toISOString();
    taxas = novo;
    try { localStorage.setItem("fin_taxas_bcb", JSON.stringify(taxas)); } catch (e){}
    return taxas;
  }).finally(() => { buscandoTaxas = null; });
  return buscandoTaxas;
}

// ---------------------------------------------------------------- contexto
const prefVenc = () => Object.assign({ curva:"focus", ir:0.15, selicManual:null }, estado.settings.venc || {});
// Cada linha guarda a data do proprio saldo (no Open Finance, XP e BTG podem estar
// em dias diferentes): a posicao "atual" e a mais recente; o historico do CDI
// precisa comecar na mais antiga.
function posicaoAtual(){
  return estado.cdbs.length ? estado.cdbs.reduce((m, c) => c.data_posicao > m ? c.data_posicao : m, "") : hojeISO();
}
function inicioPosicao(){
  return estado.cdbs.length ? estado.cdbs.reduce((m, c) => !m || c.data_posicao < m ? c.data_posicao : m, "") : hojeISO();
}
// A marcacao manual de "paga juros todo mes" (o Open Finance pode nao trazer isso no
// nome do titulo) vale por cima da linha do banco, pelo id do investimento.
function cdbsComAjustes(){
  const jm = prefVenc().jurosMensais || {};
  return estado.cdbs.map(c => c.externo_id && jm[c.externo_id] !== undefined
    ? Object.assign({}, c, { juros_mensais: !!jm[c.externo_id] }) : c);
}
function ctxVenc(){
  const p = prefVenc(), hoje = VENC.dn(hojeISO());
  return { posicao: VENC.dn(posicaoAtual()), hoje: hoje, irPresumido: +p.ir || 0.15,
           degraus: VENC.curvaCDI(taxas, p.curva, hoje, p.selicManual) };
}
// A agenda so e refeita quando algo que entra no calculo muda -- render() e
// chamado a cada toque, e projetar 173 CDBs dia util a dia util a cada toque e
// trabalho jogado fora.
function agendaAtual(){
  const ctx = ctxVenc();
  const chave = JSON.stringify([estado.cdbs.length, estado.cdbs.length ? estado.cdbs[0].lote : "",
                                ctx.posicao, ctx.hoje, ctx.irPresumido, ctx.degraus, prefVenc().jurosMensais || {}]);
  if (!agendaCache || agendaCache.chave !== chave) agendaCache = { chave: chave, ag: VENC.agenda(cdbsComAjustes(), ctx) };
  return agendaCache.ag;
}
async function gravarPrefVenc(campos){
  estado.settings.venc = Object.assign(prefVenc(), campos);
  agendaCache = null; render();
  try { await gravarPrefs(); } catch (e){}
}

// ---------------------------------------------------------------- formatos
const pctTxt = (v, casas) => vazio(v) ? "—" : (+v).toLocaleString("pt-BR",
  { minimumFractionDigits: casas === undefined ? 2 : casas, maximumFractionDigits: casas === undefined ? 2 : casas }) + "%";
const diaBR = d => VENC.dataBR(VENC.iso(d));
const DIAS_SEMANA = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const SEMANA_CURTA = ["seg","ter","qua","qui","sex","sáb","dom"];
function descTaxa(c){
  const t = Math.round(+c.taxa * 1e6) / 1e4;         // em %, sem ruido de ponto flutuante
  if (c.indexador === "pre") return pctTxt(t) + " a.a.";
  const s = Math.round((+c.spread || 0) * 1e6) / 1e4;
  if (c.indexador === "cdi") return pctTxt(t, t % 1 ? 2 : 0) + " do CDI" + (s ? " + " + pctTxt(s) : "");
  return "CDI + " + pctTxt(t);
}
// valor compacto para caber na celula do calendario: 486 · 6,3k · 13k
function fmtCurto(v){
  if (vazio(v)) return "";
  v = dis(v);
  const a = Math.abs(v);
  if (a < 1000) return Math.round(v).toLocaleString("pt-BR");
  if (a < 10000) return (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "k";
  if (a < 1e6) return Math.round(v / 1000).toLocaleString("pt-BR") + "k";
  return (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
}
function horaCurta(isoStr){
  const d = new Date(isoStr), p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

// ---------------------------------------------------------------- Open Finance (XP e BTG)
// A posicao vem da Edge Function pluggy-cdbs -- a chave da Pluggy fica so no
// servidor. O mapeamento e o VENC.lerPluggy (testado); a gravacao e a mesma da
// planilha (lote novo, depois apaga os antigos, RLS de sempre).
const FN_PLUGGY = SB_URL + "/functions/v1/pluggy-cdbs";
const SINC_VALIDADE = 6 * 3600 * 1000;       // o Meu Pluggy renova a cada 24 h; ler nao gasta cota
let sincronizando = null;
let sincInfo = null;                          // { em, itens, avisos, n, mantidos, erro, erroEm }
try { sincInfo = JSON.parse(localStorage.getItem("fin_pluggy_sinc") || "null"); } catch (e){}
const guardarSincInfo = () => { try { localStorage.setItem("fin_pluggy_sinc", JSON.stringify(sincInfo)); } catch (e){} };
const fontePluggy = () => estado.cdbs.some(c => c.origem === "pluggy") || prefVenc().fonte === "pluggy";
async function chamarFuncaoPluggy(jaTentou){
  let r;
  try {
    r = await fetch(FN_PLUGGY, { method:"POST", body:"{}", headers:{ "apikey": SB_KEY,
      "Authorization": "Bearer " + (tokenAtual() || SB_KEY), "Content-Type": "application/json" } });
  } catch (e){ const x = new Error("rede"); x.tipo = "rede"; throw x; }
  if (r.status === 401 && !jaTentou && await renovar()) return chamarFuncaoPluggy(true);
  const corpo = await r.json().catch(() => null);
  if (!r.ok){ const x = new Error((corpo && corpo.erro) || ("HTTP " + r.status)); x.status = r.status; x.corpo = corpo; throw x; }
  return corpo;
}
function explicarErroPluggy(e){
  const c = e.corpo || {};
  if (e.tipo === "rede") return "sem conexão com o Supabase";
  if (e.status === 404) return "a função pluggy-cdbs ainda não foi publicada no Supabase";
  if (c.erro === "configuracao") return "faltam os segredos no Supabase: " + (c.falta || []).join(", ");
  if (c.erro === "pluggy_auth") return "a Pluggy recusou o Client ID/Secret — confira os segredos";
  if (c.erro === "pluggy_rede") return "a Pluggy não respondeu";
  if (c.erro === "proibido") return "este usuário não pode sincronizar";
  if (e.status === 401) return "sessão expirada — entre de novo";
  return e.message;
}
// Uma corretora que falhou (consentimento vencido, instabilidade) NAO pode apagar a
// posicao dela: os titulos que ela tinha no lote anterior seguem, com a data antiga,
// ate a proxima sincronizacao boa -- e a tela avisa.
function manterQuemFalhou(lido){
  const comDados = new Set(lido.cdbs.map(c => c.instituicao));
  return estado.cdbs.filter(c => c.origem === "pluggy" && c.instituicao && !comDados.has(c.instituicao))
    .map(c => { const o = Object.assign({}, c); delete o.id; delete o.user_id; delete o.lote; delete o.created_at; return o; });
}
function sincronizarPluggy(manual){
  if (sincronizando) return sincronizando;
  if (disfarce){ if (manual) bloqueadoPeloDisfarce(); return Promise.resolve(false); }
  if (dadosTravados){ if (manual) toast("Sem conexão — nada foi sincronizado"); return Promise.resolve(false); }
  sincronizando = (async () => {
    try {
      const resp = await chamarFuncaoPluggy();
      const lido = VENC.lerPluggy(resp, { hoje: VENC.dn(hojeISO()) });
      const mantidos = manterQuemFalhou(lido);
      sincInfo = { em: new Date().toISOString(), itens: lido.itens, avisos: lido.avisos, n: lido.cdbs.length,
                   mantidos: [...new Set(mantidos.map(c => c.instituicao))], erro: null };
      const todos = lido.cdbs.concat(mantidos);
      if (!todos.length){
        sincInfo.erro = "o Open Finance não devolveu nenhum título de renda fixa bancária";
        if (manual) toast(sincInfo.erro);
        return false;
      }
      if (!(await gravarPosicao(todos, lido.posicao || hojeISO()))){ sincInfo.erro = "não gravou a posição"; return false; }
      if (prefVenc().fonte !== "pluggy"){
        estado.settings.venc = Object.assign(prefVenc(), { fonte: "pluggy" });
        gravarPrefs().catch(() => {});
      }
      if (manual){
        toast("Sincronizado: " + lido.cdbs.length + " títulos" +
              (sincInfo.mantidos.length ? " · " + sincInfo.mantidos.join(", ") + " mantido da última vez" : ""));
        tremer([8, 40, 8]);
      }
      return true;
    } catch (e){
      sincInfo = Object.assign({}, sincInfo || {}, { erro: explicarErroPluggy(e), erroEm: new Date().toISOString() });
      if (manual) toast("Não sincronizou: " + sincInfo.erro);
      return false;
    } finally {
      guardarSincInfo(); sincronizando = null; agendaCache = null;
      if (aba === "vencimentos") render();
    }
  })();
  if (aba === "vencimentos") render();       // mostra o "sincronizando..." enquanto espera
  return sincronizando;
}
// Ao abrir a aba: sincroniza sozinho se a posicao do Open Finance tiver mais de 6 h.
// Depois de um erro, espera 10 min antes de tentar de novo (senao cada redesenho tentaria).
function talvezSincronizar(){
  if (!fontePluggy() || sincronizando || disfarce || dadosTravados) return;
  const agora = Date.now(), s = sincInfo || {};
  if (s.erroEm && agora - Date.parse(s.erroEm) < 10 * 60 * 1000) return;
  if (s.em && agora - Date.parse(s.em) < SINC_VALIDADE) return;
  sincronizarPluggy(false);
}

// Barras = o que cai em cada mes do ano aberto. Base no ZERO: e montante, nao

function desenharBarrasVenc(){
  const box = document.getElementById("graf-venc");
  if (!box || !estado.cdbs.length || !vencMes) return;
  const ag = agendaAtual(), ano = vencMes.slice(0, 4), mesH = hojeISO().slice(0, 7);
  const W = Math.max(280, Math.round(box.getBoundingClientRect().width) || 340);
  const H = 176, PT = 20, PB = 24;
  const ks = MESES.map((_, i) => ano + "-" + String(i + 1).padStart(2, "0"));
  const vs = ks.map(k => ag.porMes[k] ? ag.porMes[k].total : 0);
  const mx = Math.max.apply(null, vs) || 1;
  const bw = W / 12, bar = Math.min(26, bw * 0.6);
  const y = v => PT + (1 - v / mx) * (H - PT - PB);
  let barras = "", rot = "", alvos = "";
  ks.forEach((k, i) => {
    const cx = bw * i + bw / 2, v = vs[i], sel = k === vencMes;
    if (v > 0){
      const yb = y(v);
      barras += '<rect x="' + (cx - bar / 2).toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bar.toFixed(1) +
        '" height="' + Math.max(2, H - PB - yb).toFixed(1) + '" rx="3" fill="var(--tif)" opacity="' + (sel ? ".9" : ".42") + '"/>';
      if (bw >= 24) rot += '<text x="' + cx.toFixed(1) + '" y="' + (yb - 6).toFixed(1) + '" text-anchor="middle" font-size="10" fill="' +
        (sel ? "var(--ink)" : "var(--ink-3)") + '">' + esc(fmtCurto(v)) + '</text>';
    }
    rot += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' +
      (sel ? "var(--tif)" : k === mesH ? "var(--sand)" : "var(--ink-3)") + '"' + (sel ? ' font-weight="600"' : '') + '>' + MESES[i] + '</text>';
    alvos += '<rect data-mes="' + k + '" x="' + (bw * i).toFixed(1) + '" y="0" width="' + bw.toFixed(1) + '" height="' + H +
      '" fill="transparent" style="cursor:pointer"><title>' + esc(rotuloL(k + "-01") + (v > 0 ? " — " + fmt(v) : " — nada cai")) + '</title></rect>';
  });
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' +
      esc('Quanto cai na conta por mês em ' + ano) + '">' +
    '<line x1="0" y1="' + (H - PB) + '" x2="' + W + '" y2="' + (H - PB) + '" stroke="var(--line)"/>' + barras + rot + alvos + '</svg>';

const STATUS_ITEM = { UPDATED: "atualizada", UPDATING: "atualizando", OUTDATED: "desatualizada",
  LOGIN_ERROR: "precisa reconectar", WAITING_USER_INPUT: "esperando você", CREATING: "conectando" };
function conexoesVenc(){

  let h = '<div class="hdr"><h2>Conexões</h2></div><div class="rule"></div>';

    const ate = it.consentimentoAte ? VENC.dn(VENC.diaBrasilia(it.consentimentoAte)) : null;
    const resta = ate !== null ? ate - hoje : null;
    const cons = resta === null ? "" : resta < 0 ? '<span class="neg"> · consentimento vencido — renove no Meu Pluggy</span>'
      : resta <= 30 ? '<span class="abr"> · consentimento vence em ' + resta + ' dia' + (resta === 1 ? '' : 's') + ' — renove no Meu Pluggy</span>'
      : ' · consentimento até ' + VENC.dataBR(VENC.iso(ate));
    h += '<div class="row"><span class="nm">' + esc(it.conector || it.id) + '<br><span class="t11 d3">' +
      esc(STATUS_ITEM[it.status] || it.status || "sem resposta") + (it.atualizadoEm ? ' · dados de ' + horaCurta(it.atualizadoEm) : '') +
      (it.erro ? ' · <span class="neg">' + esc(it.erro) + '</span>' : '') + cons + '</span></span></div>';
  }

    (sincInfo && sincInfo.erro ? esc(sincInfo.erro) : "ainda não conectadas") + '</span></span>' +
    '<button class="btn mini plain" id="v-conectar2">Conectar</button></div>';

let arrastoVencLigado = false;
// Arrastar para o lado SOBRE O CALENDARIO troca o mes. Ligado uma vez so: a
// section sobrevive aos render(), e ligar de novo a cada desenho empilharia
// ouvintes (um arrasto pularia varios meses).
function ligarArrastoVenc(el){
  if (arrastoVencLigado) return;
  arrastoVencLigado = true;
  let x0 = 0, y0 = 0, valido = false;
  el.addEventListener("touchstart", ev => {
    const t = ev.changedTouches[0]; x0 = t.clientX; y0 = t.clientY;
    valido = !!ev.target.closest(".cal");
  }, { passive:true });
  el.addEventListener("touchend", ev => {
    if (!valido || aba !== "vencimentos") return;
    const t = ev.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 60 || Math.abs(dy) > 45) return;
    mudarMesVenc(dx < 0 ? 1 : -1);
  }, { passive:true });
}
function mudarMesVenc(n){ vencMes = somaMes(vencMes + "-01", n).slice(0, 7); vencDia = null; render(); }
function ligarAcoesVenc(el){
  const q = id => document.getElementById(id);
  if (q("v-importar")) q("v-importar").onclick = folhaImportar;
  if (q("v-modelo")) q("v-modelo").onclick = baixarModelo;
  ["v-sinc", "v-conectar", "v-conectar2"].forEach(id => { if (q(id)) q(id).onclick = () => sincronizarPluggy(true); });
  if (q("v-ant")) q("v-ant").onclick = () => mudarMesVenc(-1);
  if (q("v-prox")) q("v-prox").onclick = () => mudarMesVenc(1);
  if (q("v-todos")) q("v-todos").onclick = () => { vencDia = null; render(); };
  el.querySelectorAll("#seg-venc-ano button").forEach(b => b.onclick = () => {
    const a = b.dataset.a, k = Object.keys(agendaAtual().porMes).filter(x => x.slice(0, 4) === a).sort()[0];
    vencMes = k || (a + "-01"); vencDia = null; render();
  });
  el.querySelectorAll(".cal-d.tem").forEach(b => b.onclick = () => {
    const d = +b.dataset.dia; vencDia = vencDia === d ? null : d; render();
  });
  el.querySelectorAll(".vrow").forEach(b => b.onclick = () => folhaCDB(+b.dataset.i));
  el.querySelectorAll("#seg-curva button").forEach(b => b.onclick = () => gravarPrefVenc({ curva: b.dataset.c }));
  if (q("v-ir")) q("v-ir").onchange = ev => gravarPrefVenc({ ir: +ev.target.value });
  if (q("v-selic")) q("v-selic").onchange = ev => {
    const v = parseNum(ev.target.value);
    gravarPrefVenc({ selicManual: v && v > 0 && v < 100 ? v : null });
  };
  if (q("v-taxas")) q("v-taxas").onclick = () => {
    toast("Buscando no Banco Central…");
    buscarTaxas(true).then(() => { agendaCache = null; render(); toast("Taxas atualizadas"); })
      .catch(e => toast("O Banco Central não respondeu: " + e.message));
  };
}

async function analisarArquivo(arquivo){

  const pos = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());

      ': ' + esc(a.msg)).join('<br>') + (res.avisos.length > 8 ? '<br>… e mais ' + (res.avisos.length - 8) : '') + '</div>' : '') +
    (estado.cdbs.length ? '<div class="sub" style="margin:14px 0 0">Substitui a posição atual: ' + estado.cdbs.length +

    '<button class="btn plain" id="imp-cancel">Cancelar</button></div>';

function colunasPlano(modo){
  const cats = estado.categorias.filter(c => c.ativo !== false);
  if (modo === "totais") return [];
  if (modo === "categorias")
    return cats.map(c => ({ id:c.id, nome:c.nome, tipo:c.tipo, ids:[c.id] }));
  const vistos = [], out = [];
  for (const c of cats){
    const k = c.tipo + "|" + c.grupo;
    let g = out.find(x => x.id === k);
    if (!g){ g = { id:k, nome:c.grupo, tipo:c.tipo, ids:[] }; out.push(g); vistos.push(k); }
    g.ids.push(c.id);
  }
  return out;
}

  const hoje = compHoje();

// Edicao direta na tabela do plano: clicar na celula, digitar, Enter.
// Grava na hora (mesmo caminho da aba Mes) e Enter pula para o mes seguinte,
// que e o gesto natural de quem vai editar varios de uma vez.
function ligarEdicaoTabela(el){
  el.querySelectorAll("td.ed").forEach(td => td.onclick = () => editarNaTabela(td));
}
function editarNaTabela(td){
  if (td.querySelector("input")) return;
  if (bloqueadoPeloDisfarce()) return;
  const comp = td.dataset.comp, cat = td.dataset.cat;
  const m = mesProj(comp);
  if (!m) return;
  const atual = m.previsto[cat] || 0;
  const textoAntes = td.textContent, classeAntes = td.className;
  td.classList.add("editando");
  td.innerHTML = '<input inputmode="decimal" value="' + (atual ? fmtn(atual) : "") + '">';
  const inp = td.querySelector("input");
  inp.focus(); inp.select();

  let feito = false;
  const encerra = async (gravar, seguir) => {
    if (feito) return; feito = true;
    const v = gravar ? parseNum(inp.value) : null;
    if (v === null || Math.abs(v - atual) < 0.005){
      td.className = classeAntes; td.textContent = textoAntes;
      if (seguir) abrirProxima(comp, cat);
      return;
    }
    td.className = classeAntes; td.textContent = fmtn(v);
    try {
      await definirPlano(comp, cat, v);
      tremer();
      const rolagem = el2().scrollLeft, alto = window.scrollY;
      render();
      const box = el2(); if (box) box.scrollLeft = rolagem;
      window.scrollTo(0, alto);
      const alvo = document.querySelector('td.ed[data-comp="' + comp + '"][data-cat="' + cat + '"]');
      if (alvo){ alvo.classList.add("salvo"); setTimeout(() => alvo.classList.remove("salvo"), 800); }
      if (seguir) abrirProxima(comp, cat);
    } catch(e){ td.textContent = textoAntes; }
  };
  const el2 = () => document.querySelector("#s-plano .tabwrap");
  inp.addEventListener("blur", () => encerra(true, false));
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); encerra(true, true); }
    else if (ev.key === "Escape"){ ev.preventDefault(); encerra(false, false); }
    else if (ev.key === "Tab"){ ev.preventDefault(); encerra(true, true); }
  });
}
function abrirProxima(comp, cat){
  const prox = somaMes(comp, 1);
  const td = document.querySelector('td.ed[data-comp="' + prox + '"][data-cat="' + cat + '"]');
  if (!td) return;
  td.scrollIntoView({ block:"nearest", inline:"nearest" });
  editarNaTabela(td);
}

                     crescimento:"cresce ao mês", anual:"uma vez por ano" };
function descRegra(r){
  const c = estado.categorias.find(x => x.id === r.category_id);
  let d;
  if (r.tipo === "pct_saldo") d = (r.percentual*100).toFixed(2).replace(".",",") + "% do saldo inicial";
  else if (r.tipo === "crescimento") d = fmt(r.valor) + " crescendo " + (r.percentual*100).toFixed(2).replace(".",",") + "%/mês";
  else if (r.tipo === "anual") d = fmt(r.valor) + " em " + MESES[(r.mes||1)-1];
  else d = fmt(r.valor) + (r.reajuste_pct ? " (+" + (r.reajuste_pct*100).toFixed(0) + "% em " + MESES[(r.reajuste_mes||1)-1] + ")" : "");

// ============================================================
// EXPORTAR PARA EXCEL (.xlsx)
//
// Gerador proprio, sem biblioteca de CDN: o app e um PWA que precisa abrir
// offline, e uma dependencia externa quebraria justamente quando falta sinal.
// .xlsx e um ZIP com XML dentro; o ZIP sai sem compressao (metodo STORE), que
// o Excel abre normalmente e dispensa implementar DEFLATE.
//
// Os valores vao como NUMERO com formato de moeda, nao como texto: assim da
// para somar e filtrar no Excel, e a tela e a planilha mostram o mesmo.
// ============================================================
const TAB_CRC = (function(){
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(b){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = TAB_CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipar(arquivos){
  const cod = new TextEncoder();
  const partes = [], central = [];
  let desloc = 0;
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];

  for (const a of arquivos){
    const nome = cod.encode(a.nome), dados = cod.encode(a.txt), c = crc32(dados);
    const cab = [].concat([80,75,3,4], u16(20), u16(0), u16(0), u16(0), u16(0),
                          u32(c), u32(dados.length), u32(dados.length),
                          u16(nome.length), u16(0));
    partes.push(new Uint8Array(cab), nome, dados);
    const cen = [].concat([80,75,1,2], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
                          u32(c), u32(dados.length), u32(dados.length),
                          u16(nome.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(desloc));
    central.push({ bytes: cen, nome: nome });
    desloc += cab.length + nome.length + dados.length;
  }
  const inicio = desloc;
  let tam = 0;
  for (const c of central){
    partes.push(new Uint8Array(c.bytes), c.nome);
    tam += c.bytes.length + c.nome.length;
  }
  partes.push(new Uint8Array([].concat([80,75,5,6], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(tam), u32(inicio), u16(0))));
  return new Blob(partes, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const xmlEsc = t => String(t === null || t === undefined ? "" : t)
  .replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&apos;" }[c]));
function colLetra(n){
  let s = ""; n++;
  while (n > 0){ const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = ((n - r) / 26) | 0; }
  return s;
}

    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
    '<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>',
    '<xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>',
    '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>',
    '</styleSheet>'
  ].join("");

  const arquivos = [
    { nome: "[Content_Types].xml", txt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      abas.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i+1) +
        '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join("") +
      '</Types>' },
    { nome: "_rels/.rels", txt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>' },
    { nome: "xl/workbook.xml", txt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
      abas.map((a, i) => '<sheet name="' + xmlEsc(a.nome.slice(0,31)) + '" sheetId="' + (i+1) +
        '" r:id="rId' + (i+1) + '"/>').join("") + '</sheets></workbook>' },
    { nome: "xl/_rels/workbook.xml.rels", txt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      abas.map((_, i) => '<Relationship Id="rId' + (i+1) +
        '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' +
        (i+1) + '.xml"/>').join("") +
      '<Relationship Id="rId' + (abas.length+1) +
      '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>' },
    { nome: "xl/styles.xml", txt: ESTILOS }
  ];

  abas.forEach((a, idx) => {
    const cols = '<cols>' + a.colunas.map((c, i) =>
      '<col min="' + (i+1) + '" max="' + (i+1) + '" width="' + (c.largura || 16) +
      '" customWidth="1"/>').join("") + '</cols>';
    const cab = '<row r="1">' + a.colunas.map((c, i) =>
      '<c r="' + colLetra(i) + '1" t="inlineStr" s="1"><is><t>' + xmlEsc(c.t) +
      '</t></is></c>').join("") + '</row>';
    const corpo = a.linhas.map((linha, li) => {
      const r = li + 2;
      const cels = linha.map((cel, ci) => {
        if (!cel || cel.v === null || cel.v === undefined || cel.v === "") return "";
        const ref = colLetra(ci) + r;
        if (cel.tipo === "num" || cel.tipo === "moeda" || cel.tipo === "pct"){
          if (isNaN(cel.v)) return "";
          const est = cel.tipo === "moeda" ? (cel.forte ? 4 : 2) : cel.tipo === "pct" ? 3 : 0;
          return '<c r="' + ref + '" s="' + est + '"><v>' + Number(cel.v) + '</v></c>';
        }
        return '<c r="' + ref + '" t="inlineStr" s="' + (cel.forte ? 1 : 0) + '"><is><t>' +
               xmlEsc(cel.v) + '</t></is></c>';
      }).join("");
      return '<row r="' + r + '">' + cels + '</row>';
    }).join("");
    arquivos.push({ nome: "xl/worksheets/sheet" + (idx+1) + ".xml", txt:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' +
      cols + '<sheetData>' + cab + corpo + '</sheetData></worksheet>' });
  });
  return zipar(arquivos);
}

function baixar(blob, nome){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const T = (v, forte) => ({ v: v, tipo: "txt", forte: forte });
const M = (v, forte) => ({ v: v, tipo: "moeda", forte: forte });
const P = v => ({ v: v, tipo: "pct" });
const N = v => ({ v: v, tipo: "num" });

// ---------------- o que cada aba exporta ----------------
// Regra: sai EXATAMENTE o que a tela mostra -- mesmas colunas, mesma ordem,
// mesmo recorte (o ano escolhido no Resumo, o mes aberto, o modo do Plano).
function abaResumo(){
  const ms = proj.filter(m => m.competencia.slice(0,4) === anoSel);
  return { nome: "Resumo " + anoSel,
    colunas: [{t:"Mês",largura:12},{t:"Previsto",largura:16},{t:"Apurado",largura:16},
              {t:"Diferença",largura:16},{t:"Δ%",largura:10}],
    linhas: ms.map(m => [ T(rotulo(m.competencia)), M(m.previsao),
      m.aberto ? T("em aberto") : M(m.realizado),
      m.aberto ? null : M(m.diferenca), m.aberto ? null : P(m.variacao) ]) };
}
function abaMes(){
  const m = mesProj(mesAtual);
  const real = realizadoCat(mesAtual);
  const linhas = [];
  for (const tipo of ["receita","despesa"]){
    for (const c of estado.categorias.filter(x => x.tipo === tipo && x.ativo !== false)){
      linhas.push([ T(tipo === "receita" ? "Receita" : "Saída"), T(c.grupo), T(c.nome),
                    M(m.previsto[c.id]), real[c.id] === undefined ? null : M(real[c.id]) ]);
    }
  }
  linhas.push([]);
  linhas.push([ T("Saldo inicial", true), null, null, M(m.saldoInicial, true), null ]);
  linhas.push([ T("Receitas", true), null, null, M(m.receitas, true), null ]);
  linhas.push([ T("Saídas", true), null, null, M(m.saidas, true), null ]);
  linhas.push([ T("Previsão", true), null, null, M(m.previsao, true), null ]);
  linhas.push([ T("Apurado", true), null, null,
                m.aberto ? T("em aberto") : M(m.realizado, true), null ]);
  if (!m.aberto) linhas.push([ T("Diferença", true), null, null, M(m.diferenca, true), P(m.variacao) ]);
  return { nome: rotulo(mesAtual).replace("/", "-"),
    colunas: [{t:"Tipo",largura:10},{t:"Grupo",largura:16},{t:"Categoria",largura:22},
              {t:"Previsto",largura:16},{t:"Realizado",largura:16}],
    linhas: linhas };
}
function abaPatrimonio(){
  const sal = estado.balances[mesAtual] || {};
  const ativas = estado.contas.filter(c => c.ativo !== false);
  const linhas = ativas.map(c => {
    const vale = contaValeEm(c, mesAtual), b = sal[c.id];
    return [ T(c.nome), T(c.instituicao || ""), T(c.tipo),
             T(c.inicio ? rotulo(c.inicio) : "desde sempre"),
             (!vale || !b) ? null : M(+b.saldo) ];
  });
  const total = ativas.reduce((a,c) =>
    a + (contaValeEm(c, mesAtual) && sal[c.id] ? +sal[c.id].saldo : 0), 0);
  linhas.push([]);
  linhas.push([ T("Soma das contas", true), null, null, null, M(total, true) ]);
  return { nome: "Patrimônio " + rotulo(mesAtual).replace("/", "-"),
    colunas: [{t:"Conta",largura:24},{t:"Instituição",largura:18},{t:"Tipo",largura:14},
              {t:"Conta desde",largura:14},{t:"Saldo",largura:16}],
    linhas: linhas };
}
// Matriz meses x contas: e a serie que alimenta os graficos por conta, do
// jeito que ela existe -- so mes completo, so conta valida no mes.
function abaContasMes(){
  const ser = CONTAS.serie(estado.contas, saldosNum());
  const linhas = ser.competencias.map((c,i) => [T(rotulo(c))]
    .concat(ser.series.map(x => M(x.valores[i])))
    .concat([M(ser.totais[i], true)]));
  return { nome: "Contas mes a mes",
    colunas: [{t:"Mês",largura:12}]
      .concat(ser.series.map(x => ({ t: x.nome, largura: 16 })))
      .concat([{t:"Total",largura:17}]),
    linhas: linhas };
}
function abaPlano(){
  const modo = estado.settings.planoModo || "grupos";
  const cols = colunasPlano(modo);
  const colunas = [{t:"Mês",largura:12}]
    .concat(cols.map(c => ({ t: c.nome, largura: 16 })))
    .concat([{t:"Receitas",largura:16},{t:"Saídas",largura:16},{t:"Previsão",largura:17},
             {t:"Apurado",largura:17},{t:"Δ",largura:15},{t:"Δ%",largura:10}]);
  const linhas = proj.map(m => [T(rotulo(m.competencia))]
    .concat(cols.map(c => M(c.ids.reduce((s,id) => s + (m.previsto[id]||0), 0))))
    .concat([ M(m.receitas), M(m.saidas), M(m.previsao, true),
              m.aberto ? T("em aberto") : M(m.realizado, true),
              m.aberto ? null : M(m.diferenca),
              m.aberto ? null : P(m.variacao) ]));
  return { nome: "Plano", colunas: colunas, linhas: linhas };
}
function abaCompromissos(){
  if (!estado.parcelas.length) return null;
  return { nome: "Compromissos",
    colunas: [{t:"O que é",largura:28},{t:"Categoria",largura:20},{t:"Parcela",largura:14},
              {t:"Parcelas",largura:10},{t:"Primeira",largura:12},{t:"Última",largura:12},
              {t:"Total",largura:16},{t:"Observação",largura:34}],
    linhas: estado.parcelas.slice().sort((a,b) => a.inicio.localeCompare(b.inicio)).map(p => {
      const c = estado.categorias.find(x => x.id === p.category_id);
      return [ T(p.descricao), T(c ? c.nome : ""), M(+p.valor), N(+p.parcelas),
               T(rotulo(p.inicio)), T(rotulo(somaMes(p.inicio, (+p.parcelas)-1))),
               M((+p.valor) * (+p.parcelas)), T(p.obs || "") ];
    }) };
}

function exportarXLSX(quais, nomeArquivo){
  if (disfarce){
    toast("Saia do modo discreto para exportar — a planilha sairia com os valores da tela");
    return;
  }
  const abas = quais.map(f => f()).filter(Boolean);
  if (!abas.length){ toast("Nada para exportar"); return; }
  baixar(planilhaXLSX(abas), nomeArquivo + " " + hojeISO() + ".xlsx");
  toast("Planilha baixada");
}

// O cadastro esta DESLIGADO no painel do Supabase (existe uma conta so),
// entao nao ha caminho de signup aqui: ele so poderia falhar.
async function entrar(){
  const email = document.getElementById("lg-email").value.trim();
  const senha = document.getElementById("lg-senha").value;
  const erro = document.getElementById("lg-erro");
  const btn = document.getElementById("lg-entrar");
  erro.textContent = "";
  if (!email || !senha){ erro.textContent = "Informe e-mail e senha."; return; }
  btn.disabled = true; btn.textContent = "Entrando…";
  try {
    const s = await authFetch("token?grant_type=password", { email, password: senha });
    if (!s.access_token){ erro.textContent = "Não foi possível entrar."; return; }
    guardarSessao(s);
    await iniciar();
  } catch (e){
    erro.textContent = /fetch|network|Failed/i.test(e.message)
      ? "Sem conexão com o servidor." : "E-mail ou senha não conferem.";
  } finally { btn.disabled = false; btn.textContent = "Entrar"; }
}
document.getElementById("lg-entrar").onclick = entrar;
document.getElementById("lg-senha").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });

async function iniciar(){
  let u;
  try {
    u = await (await fetch(SB_URL + "/auth/v1/user", {
      headers:{ "apikey":SB_KEY, "Authorization":"Bearer " + tokenAtual() } })).json();
  } catch(e){ u = null; }
  if (!u || !u.id){
    if (!(await renovar())){ limparSessao(); return; }
    return iniciar();
  }
  estado.uid = u.id; estado.email = u.email;
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  try { await carregarTudo(); }
  catch (e){
    document.getElementById("s-resumo").innerHTML =
      '<div class="aviso">Não deu para carregar seus dados e não há cópia salva neste aparelho. Verifique a conexão e recarregue.</div>';
    return;
  }
  const hoje = compHoje();
  mesAtual = estado.competencias.includes(hoje) ? hoje
           : (estado.competencias[estado.competencias.length-1] || hoje);
  reprojetar();
  const alvo = abaDaURL();
  if (alvo && alvo !== "resumo" && !(disfarce && ABAS_OCULTAS.includes(alvo))) irPara(alvo);
  else render();
}

// esconder a barra ao rolar — limitador por relógio, NAO rAF
// (rAF nao dispara em aba de fundo nem no Browser pane)
let ultY = 0, ultT = 0;
window.addEventListener("scroll", () => {
  const t = Date.now();
  if (t - ultT < 120) return;
  ultT = t;
  const y = window.scrollY;
  if (Math.abs(y-ultY) > 26 && !document.getElementById("sheet-bg").classList.contains("on")){
    document.body.classList.toggle("nav-off", y > ultY && y > 130);
    ultY = y;
  }
}, { passive:true });

// Redesenhar so quando a LARGURA muda. O navegador dispara resize tambem
// quando a barra de rolagem aparece/some (mudanca so de altura) -- e cada
// redesenho reconstruia os SVGs a toa e matava a animacao do arco no meio.
let redimT = null, ultimaLargura = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === ultimaLargura) return;
  ultimaLargura = window.innerWidth;
  clearTimeout(redimT);
  redimT = setTimeout(() => {
    if (!estado.categorias.length) return;
    if (aba === "resumo"){ desenharArco(); desenharCombo(anoSel); }
    if (aba === "patrimonio") desenharEvolucao();
    if (aba === "vencimentos") desenharBarrasVenc();
  }, 180);
});

// atalhos do manifest (?ir=mes) e deep link
function abaDaURL(){
  const q = new URLSearchParams(location.search).get("ir");
  return ["resumo","mes","patrimonio","vencimentos","plano","ajustes"].includes(q) ? q : null;
}

// convite de instalacao: discreto, dispensavel, e a dispensa e lembrada
let promptInstalar = null;
const CH_INST = "fin_instalar_dispensado";
function mostrarConvite(iOS){
  if (instalado) return;
  try { if (localStorage.getItem(CH_INST)) return; } catch(e){}
  const cx = document.getElementById("instalar");
  if (iOS){
    document.getElementById("inst-txt").textContent =
      "No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início.";
    document.getElementById("inst-ok").style.display = "none";
    document.getElementById("inst-nao").textContent = "Entendi";
  }
  cx.classList.add("on");
}
window.addEventListener("beforeinstallprompt", ev => {
  ev.preventDefault(); promptInstalar = ev;
  setTimeout(() => mostrarConvite(false), 2500);
});
document.getElementById("inst-ok").onclick = async () => {
  document.getElementById("instalar").classList.remove("on");
  if (!promptInstalar) return;
  promptInstalar.prompt();
  const r = await promptInstalar.userChoice.catch(() => null);
  promptInstalar = null;
  if (r && r.outcome === "accepted") toast("Instalado");
  else try { localStorage.setItem(CH_INST, "1"); } catch(e){}
};
document.getElementById("inst-nao").onclick = () => {
  document.getElementById("instalar").classList.remove("on");
  try { localStorage.setItem(CH_INST, "1"); } catch(e){}
};
// iOS nao tem beforeinstallprompt: instrucao manual, uma vez so
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (ehIOS && !instalado) setTimeout(() => mostrarConvite(true), 3500);

if (tokenAtual()) iniciar();
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
