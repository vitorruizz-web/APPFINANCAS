<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETA — "grafite & jade"
   Quatro matizes, cada um com exatamente UM significado. A
   hierarquia vem da luminância dos neutros, não da cor; cor só
   aparece onde carrega informação.
   ============================================================ */
:root{
  --bg:#0A0D11; --surface:#11151A; --raised:#181D24; --sunken:#070A0D;
  --line:#1E252E; --line-2:#2A333F;
  --ink:#E9ECF0; --ink-2:#98A3B0; --ink-3:#5E6874; --ink-4:#3D454F;

  --tif:#3ECFC8;   --tif-d:#17706B;  --tif-g:rgba(62,207,200,.10);
  --steel:#6E93C4;  --steel-d:#2B4463; --steel-g:rgba(110,147,196,.10);
  --sand:#C9A227;   --sand-g:rgba(201,162,39,.10);
  --ouro:#F0C24A;   --ouro-2:#F7DA8B;  --ouro-3:#C89A2E;
  --clay:#D2605C;   --clay-g:rgba(210,96,92,.10);

  --pad:18px; --r:10px;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; overflow-x:hidden;
  /* elevacao radial atras do heroi: uma unica respiracao, nao um degrade decorativo */
  background:
    radial-gradient(120% 62% at 50% -8%, #131A22 0%, rgba(19,26,34,0) 62%),
    var(--bg);
  background-attachment:fixed;
  min-height:100svh;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
::selection{background:var(--tif-d);color:#fff}

.serif{font-family:var(--serif);font-weight:400}
.pos{color:var(--tif)} .neg{color:var(--clay)} .abr{color:var(--sand)}
.d2{color:var(--ink-2)} .d3{color:var(--ink-3)}
.t11{font-size:11px} .t12{font-size:12px} .t13{font-size:13px}

/* ---------------- moldura ---------------- */
.top{
  position:sticky; top:0; z-index:40; background:rgba(10,13,17,.9);
  backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.top-in{display:flex;align-items:center;gap:12px;padding:12px var(--pad)}
.marca{font-family:var(--serif);font-size:22px;line-height:1;flex:1;letter-spacing:.005em}
.pill{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);
}
.pill b{color:var(--ink);font-weight:500}
/* discreto para quem olha de fora, inequívoco para quem sabe:
   aceso = os números da tela não são os seus. */
.ponto{width:5px;height:5px;border-radius:50%;background:var(--ink-4);
  flex:none;margin-left:-4px;opacity:0;transition:opacity .2s}
body.discreto .ponto{opacity:1}
/* no modo discreto sobram Resumo e Ajustes: quem pega o aparelho nao chega
   nem no detalhe por categoria nem no saldo das contas */
body.discreto nav button[data-tab="mes"],
body.discreto nav button[data-tab="patrimonio"],
body.discreto nav button[data-tab="vencimentos"],
body.discreto nav button[data-tab="plano"]{display:none}
main{padding:0 var(--pad) 128px;max-width:760px;margin:0 auto}
/* no desktop o conteudo vira duas colunas: acaba o vazio da direita */
@media (min-width:1000px){
  main{max-width:1140px}
  #s-resumo.on{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
    gap:0 44px;align-items:start}
  #s-resumo > .col-a{grid-column:1}
  #s-resumo > .col-b{grid-column:2}
  #s-resumo > .col-b .hdr:first-child{margin-top:20px}
}
section{display:none} section.on{display:block}
/* A troca de aba responde ao toque e diz a DIRECAO: vindo da direita ou da
   esquerda, conforme a ordem da barra. Movimento que mostra o que mudou --
   nao entrada animada em cada bloco, que e o tique de pagina gerada. */
@keyframes entraDir{from{opacity:0;transform:translate3d(14px,0,0)}to{opacity:1;transform:none}}
@keyframes entraEsq{from{opacity:0;transform:translate3d(-14px,0,0)}to{opacity:1;transform:none}}
section.on.vem-dir{animation:entraDir .26s cubic-bezier(.22,.7,.3,1) both}
section.on.vem-esq{animation:entraEsq .26s cubic-bezier(.22,.7,.3,1) both}
nav button{transition:color .18s, background .18s, transform .12s}
nav button:active{transform:scale(.94)}
.sheet{animation:sobe .3s cubic-bezier(.22,.8,.28,1) both}
@keyframes sobe{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.sheet-bg{animation:apaga .22s ease both}
@keyframes apaga{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  section.on.vem-dir,section.on.vem-esq,.sheet,.sheet-bg{animation:none}
  nav button:active{transform:none}
}

.hdr{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:30px 0 12px;flex-wrap:wrap;
}
.hdr h2{font-size:13px;font-weight:600;margin:0;color:var(--ink-2);letter-spacing:.01em;
  white-space:nowrap;flex:none}
.hdr .seg{margin-left:auto}
.hdr .aux{font-size:11.5px;color:var(--ink-3)}
.rule{height:1px;background:var(--line);margin:0 0 6px}

/* ---------------- barra inferior ---------------- */
nav{
  position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:50; display:flex; gap:2px; padding:5px;
  background:rgba(24,29,36,.92); backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line-2); border-radius:999px; overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  max-width:calc(100vw - 22px);
  transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
}
/* o transform faz DUAS coisas: centralizar e recolher.
   sem repetir o translateX aqui, a barra pula para a direita ao sumir. */
body.nav-off nav{transform:translateX(-50%) translateY(180%);opacity:0}
nav button{
  padding:9px 13px;border-radius:999px;font-size:12.5px;color:var(--ink-3);
  display:flex;align-items:center;gap:7px;white-space:nowrap;
  transition:color .18s, background .18s;
}
nav button:hover{color:var(--ink-2)}
nav button .lb{display:none}
nav button.on{background:var(--raised);color:var(--ink)}
nav button.on .lb{display:inline}
nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
@media (max-width:359px){nav button{padding:9px 11px} nav button.on .lb{display:none}}

/* ---------------- resumo: a trajetoria e o heroi ---------------- */
.arco{margin:14px 0 0;position:relative}
.arco svg{display:block;width:100%;height:auto}
.arco .marca{
  position:absolute;bottom:4px;font-size:10.5px;color:var(--ink-3);
  transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  text-shadow:0 1px 3px var(--bg), 0 0 6px var(--bg);
}
.hero{padding:20px 0 0;display:grid;gap:20px}
.hero .val{
  font-family:var(--serif);font-size:clamp(40px,12vw,58px);line-height:.92;
  letter-spacing:-.018em;display:flex;align-items:baseline;gap:.1em;
}
.hero .cur{font-size:.32em;color:var(--ink-3);letter-spacing:.03em}
.hero .cap{color:var(--ink-3);font-size:12.5px;margin-top:10px;line-height:1.5}
.hero .cap b{color:var(--ink-2);font-weight:500}
/* os fatos se separam por FIO, nao por caixa: a estrutura carrega a informacao */
.fatos{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--line);
}
.agora{
  margin-top:18px;padding:15px 0 16px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.agora .k{font-size:11.5px;color:var(--ink-3);margin-bottom:6px}
.agora .v{font-size:22px;letter-spacing:-.015em;display:flex;align-items:baseline;
  gap:9px;flex-wrap:wrap}
.agora .v .pos,.agora .v .neg{font-size:15px;font-weight:600}
.agora .v .d3{font-size:13px}
.agora .sep{color:var(--ink-4)}
.fatos.anos{border-top:0;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.fatos.anos .fato{padding-top:2px}
.fatos.anos .fato .v{font-size:14.5px}
@media (max-width:520px){
  .fatos.anos{grid-template-columns:repeat(3,1fr);gap:0}
  /* :first-child precisa repetir o padding-top, senao herda os 14px da regra
     geral de .fatos e o primeiro ano desalinha dos outros dois */
  .fatos.anos .fato,
  .fatos.anos .fato:first-child{border-top:0;padding:2px 0 0 12px}
  .fatos.anos .fato{border-left:1px solid var(--line)}
  .fatos.anos .fato:first-child{border-left:0;padding-left:0}
  .fatos.anos .fato .v{font-size:13px}
  .fatos.anos .fato .k{font-size:10.5px}
}
.fato{padding:14px 0 0;border-left:1px solid var(--line);padding-left:16px}
.fato:first-child{border-left:0;padding-left:0}
.fato .k{font-size:11px;color:var(--ink-3);margin-bottom:4px}
.fato .v{font-size:15.5px;letter-spacing:-.01em}
.fato .v small{font-size:12px;color:var(--ink-3);font-weight:400}
@media (max-width:520px){
  .fatos > .fato{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .fatos > .fato:first-child{border-top:0;padding-top:14px}
  .fatos{grid-template-columns:1fr;gap:12px}
}

.nota{
  margin:22px 0 0;padding:15px 16px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);
  font-size:13.5px;line-height:1.6;color:var(--ink-2);
  border-left:2px solid var(--tif);
}
.nota b{color:var(--ink);font-weight:600}
.nota.fria{border-left-color:var(--steel)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.kpi{background:var(--surface);padding:14px 15px}
.kpi .k{font-size:11.5px;color:var(--ink-3);margin-bottom:5px}
.kpi .v{font-size:16px}
.kpi.wide{grid-column:1/-1}

.grafwrap{margin:6px 0 4px}
.grafwrap svg{width:100%;height:auto;display:block}
.legenda{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px;
  font-size:11px;color:var(--ink-3)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:12px;height:10px;border-radius:2px;display:inline-block}
.legenda .sw-bar{background:var(--tif);opacity:.62}
.legenda .sw-lin{height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--ouro-3),var(--ouro),var(--ouro-2));
  box-shadow:0 0 7px rgba(240,194,74,.65)}
.legenda .sw-tra{height:0;width:14px;border-top:2px dashed var(--tif);opacity:.8}
.legenda .sw-hoje{height:0;width:12px;border-top:2px dashed var(--sand)}

/* ---------------- identidade por conta ----------------
   A cor aqui carrega informacao (qual conta), entao ela aparece -- e segue a
   CONTA, nunca o tamanho dela: um mes em que a conta cai no ranking nao pode
   repintar o grafico. A rampa esta no bloco <contas> e foi validada contra o
   fundo #0A0D11 (CVD dE 12,8 / visao normal 23,2 / contraste >= 3:1). */
.pt{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.lrow .nm .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A rosca e as barras sao a MESMA leitura: o anel da a proporcao de relance, a
   barra da o valor. Por isso dividem uma selecao e nao um tooltip cada. */
.compwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.roscawrap{width:100%;max-width:212px;display:flex;justify-content:center;
  padding:6px 0 2px;touch-action:manipulation}
.cbars{width:100%}
.roscawrap .fx{cursor:pointer;
  transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1),
             stroke-dashoffset .5s cubic-bezier(.4,0,.2,1),
             stroke-width .18s ease, opacity .18s ease}
.r-pct{font-family:var(--serif);font-size:34px;fill:var(--ink)}
.r-sig{font-size:17px;fill:var(--ink-3)}
.r-nm{font-size:11.5px;letter-spacing:.01em;fill:var(--ink-2)}
@media (min-width:1000px){
  .compwrap{flex-direction:row;align-items:center;gap:26px}
  .roscawrap{flex:none;width:240px;max-width:240px}
  .cbars{flex:1;min-width:0}
}

.cbar{padding:9px 0 10px;border-bottom:1px solid var(--line);
  display:block;width:100%;text-align:left;background:none;border-left:0;
  border-right:0;border-top:0;color:inherit;font:inherit;cursor:pointer}
.cbar:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:4px}
.cbar.on .cb-nm{color:var(--ink)}
.cbar.on .cb-trilha{background:var(--raised)}
.cbar:not(.on) .cb-nm{transition:color .18s ease}
.cbar + .hdr{margin-top:22px}
.cb-trilha{position:relative}
/* A marca da meta e um traco na trilha, nao um segundo numero: a comparacao
   "onde estou x onde queria estar" se le pela distancia, sem aritmetica. */
.cb-meta{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-2);
  opacity:.75;border-radius:1px;transform:translateX(-1px)}
.conc{color:var(--ink-3);font-size:12px;line-height:1.5;margin:12px 0 0}
.conc b{color:var(--ink-2);font-weight:500}
.mudou{color:var(--ink-2);font-size:13px;line-height:1.55;margin:0 0 18px;
  padding-left:11px;border-left:2px solid var(--line-2)}
.mudou b{color:var(--ink);font-weight:500}
@media (pointer:coarse){ .cbar{padding:11px 0 12px} }
.cb-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.cb-nm{display:flex;align-items:center;gap:7px;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cb-v{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.cb-v b{color:var(--ink);font-weight:500;margin-left:5px}
.cb-trilha{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.cb-fill{height:100%;border-radius:3px;min-width:3px}
.cel.dupla{display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  line-height:1.25;font-size:13.5px;width:auto;padding:5px 0}
.cel.dupla b{font-weight:400}
.legenda b{font-weight:500}

/* --- a régua: 48 meses, valor EXATO, com a trilha embaixo --- */
.regua{margin-top:2px}
.ano{
  display:flex;align-items:center;gap:12px;margin:24px 0 4px;
  font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;
}
.ano::after{content:"";flex:1;height:1px;background:var(--line)}
.ano em{font-style:normal;color:var(--ink-4);letter-spacing:0}
.mrow{
  display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:baseline;
  width:100%;padding:10px 6px;border-radius:7px;position:relative;
  border-bottom:1px solid var(--line); transition:background .15s;
}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface)}
.mrow.agora{background:var(--sand-g);box-shadow:inset 2px 0 0 var(--sand)}
.mrow .mes{font-size:11.5px;color:var(--ink-3)}
.mrow.agora .mes{color:var(--sand)}
.mrow .dif{font-size:12px;text-align:left}
.mrow .num{font-size:14px;text-align:right;letter-spacing:-.01em}
.mrow .num.aberto{color:var(--ink-2)}
.trilha{
  grid-column:1/-1;height:3px;margin:7px 0 0;border-radius:2px;
  background:var(--line);position:relative;overflow:visible;
}
.trilha i{position:absolute;left:0;top:0;height:100%;border-radius:2px;display:block}
.trilha .fill{background:var(--tif)}
.trilha .fill.plano{background:var(--steel);opacity:.5}
.trilha .tick{
  position:absolute;top:-3px;width:2px;height:9px;border-radius:1px;
  background:var(--steel);opacity:.95;
}

/* ---------------- listas ---------------- */
.grupo{
  display:flex;align-items:center;gap:10px;margin:22px 0 2px;
  font-size:11.5px;color:var(--ink-3);
}
.grupo::after{content:"";flex:1;height:1px;background:var(--line)}
.grupo .soma{color:var(--ink-4);font-size:11px}

.lrow{
  display:grid;grid-template-columns:1fr auto 112px;gap:10px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);
}
.lrow:last-child{border-bottom:0}
.lrow .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px}
.lrow button.nm:hover{color:var(--steel)}
.lrow .nm .fx{color:var(--steel);font-size:11px}
.lrow .rl{font-size:11.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.lrow .rl b{color:var(--tif);font-weight:500}
.parc{
  grid-column:1/-1;display:flex;gap:8px;align-items:baseline;flex-wrap:nowrap;
  font-size:11.5px;color:var(--ink-3);padding:0 0 5px 4px;
}
.parc .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parc em{font-style:normal;color:var(--sand);flex:none}
.parc .pv{margin-left:auto;flex:none}

.cel{
  border:1px solid transparent;border-radius:6px;padding:5px 8px;text-align:right;
  width:112px;background:transparent;font-size:14.5px;letter-spacing:-.01em;
  transition:border-color .15s, background .15s;
}
.cel:hover{border-color:var(--line-2)}
.cel:focus{border-color:var(--steel);background:var(--raised);outline:none}
/* No toque o campo tinha 33px de altura -- 11px abaixo do minimo de alvo, e
   errar o campo era rotina. Aqui ele ocupa a linha inteira; a borda so aparece
   no foco, entao visualmente nada muda. */
@media (pointer:coarse){
  .cel{min-height:44px;padding-top:11px;padding-bottom:11px}
  .lrow{padding:3px 0}
  .lrow .nm{min-height:44px}
}
.cel.zero{color:var(--ink-4)}
.cel.calc{color:var(--steel)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .vl{text-align:right;white-space:nowrap;font-size:13.5px}

/* ---------------- totais ---------------- */
.tot{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tot div{display:flex;justify-content:space-between;gap:14px;padding:10px 15px;
  font-size:13.5px;background:var(--surface);border-bottom:1px solid var(--line)}
.tot div:last-child{border-bottom:0}
.tot div span:first-child{color:var(--ink-2)}
.tot .destaque{background:var(--raised);font-size:15.5px;padding:13px 15px}
.tot .destaque span:first-child{color:var(--ink)}

/* ---------------- controles ---------------- */
.btn{
  border:1px solid var(--line-2);background:var(--surface);border-radius:8px;
  padding:9px 15px;font-size:13.5px;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--raised);border-color:var(--ink-4)}
.btn.pri{background:var(--tif-d);border-color:var(--tif-d);color:#ECFCFA;font-weight:500}
.btn.pri:hover{background:#1E8C85}
.btn.mini{padding:6px 11px;font-size:12.5px}
.btn.plain{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.plain:hover{background:var(--surface);color:var(--ink)}
.acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);
  border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-size:12.5px;color:var(--ink-3)}
.seg button.on{background:var(--raised);color:var(--ink)}

.mnav{display:flex;align-items:center;gap:12px;margin:22px 0 2px}
.mnav .lbl{flex:1;text-align:center;font-size:16px;font-family:var(--serif);font-size:20px}
.mnav button{width:38px;height:38px;border:1px solid var(--line-2);border-radius:50%;
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
.mnav button:hover{background:var(--raised);color:var(--ink)}
.mnav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------------- tabela do plano ---------------- */
.tabwrap{overflow-x:auto;max-width:100%;margin-top:10px;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:var(--r)}
table.plano{border-collapse:collapse;font-size:12.5px;white-space:nowrap;width:100%}
table.plano th,table.plano td{padding:7px 11px;text-align:right;border-bottom:1px solid var(--line)}
table.plano th:first-child,table.plano td:first-child{
  text-align:left;position:sticky;left:0;background:var(--bg);z-index:1;
  border-right:1px solid var(--line);
}
table.plano thead th{color:var(--ink-3);font-weight:500;font-size:11px;
  background:var(--surface);position:sticky;top:0;z-index:2}
table.plano thead th:first-child{z-index:3;background:var(--surface)}
table.plano thead th.rec{color:var(--tif)}
table.plano thead th.des{color:var(--ink-3)}
table.plano tr.sep td{background:var(--raised);color:var(--ink-3);font-size:11px;
  padding:5px 11px;letter-spacing:.04em}
table.plano tr.agora td{background:var(--sand-g)}
table.plano td.z{color:var(--ink-4)}
table.plano td.forte{color:var(--ink)}
table.plano .colsep{border-left:1px solid var(--line-2)}
table.plano td.ed{cursor:cell}
table.plano td.ed:hover{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line-2)}
table.plano td.editando{padding:2px 4px}
table.plano td input{width:100%;min-width:82px;background:var(--raised);
  border:1px solid var(--steel);border-radius:4px;padding:5px 7px;text-align:right;
  font-size:12.5px;outline:none}
.salvo{animation:pisca .8s ease-out}
.cel.salvo{animation:piscaCel .8s ease-out}
@keyframes pisca{0%{box-shadow:inset 0 0 0 2px var(--tif)}100%{box-shadow:inset 0 0 0 2px transparent}}
@keyframes piscaCel{0%{border-color:var(--tif);background:var(--tif-g)}100%{border-color:transparent;background:transparent}}

/* ---------------- folha modal ---------------- */
.sheet-bg{position:fixed;inset:0;background:rgba(4,6,9,.74);z-index:60;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet-bg.on{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  border:1px solid var(--line-2);border-bottom:0;padding:20px var(--pad);
  padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;
}
.sheet h3{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.01em}
.sheet .sub{color:var(--ink-3);font-size:13px;margin-bottom:18px;line-height:1.5}
label.f{display:block;margin:14px 0 0;font-size:12px;color:var(--ink-3)}
label.f input,label.f select,label.f textarea{
  width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line-2);
  border-radius:8px;padding:11px 13px;font-size:15px;transition:border-color .15s;
}
label.f input:focus,label.f select:focus,label.f textarea:focus{
  border-color:var(--steel);outline:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.check{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:13.5px;color:var(--ink-2)}
.check input{width:auto;margin:2px 0 0}

/* ---------------- login ---------------- */
#login{min-height:100svh;display:flex;flex-direction:column;
  padding:0 var(--pad) calc(28px + env(safe-area-inset-bottom));max-width:430px;margin:0 auto}
.lg-top{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding-top:calc(56px + env(safe-area-inset-top));padding-bottom:34px}
.lg-marca{font-family:var(--serif);font-size:clamp(46px,15vw,62px);line-height:.95;
  letter-spacing:-.02em;margin:0 0 26px}
/* motivo gráfico: a própria régua do app, reduzida a seis traços */
.lg-regua{display:grid;gap:10px}
.lg-regua i{height:5px;border-radius:2px;display:block;background:var(--line);position:relative}
.lg-regua i::after{content:"";position:absolute;left:0;top:0;height:100%;border-radius:2px;
  background:var(--tif);width:var(--w)}
.lg-regua i:nth-child(n+5)::after{background:var(--steel);opacity:.45}
.lg-form label.f:first-of-type{margin-top:0}
#login .btn{width:100%;margin-top:22px;padding:14px}
.lg-erro{color:var(--clay);font-size:13px;margin-top:14px;min-height:19px}
.lg-pe{color:var(--ink-4);font-size:11.5px;margin-top:22px;text-align:center}

/* ---------------- convite de instalacao ---------------- */
#instalar{
  position:fixed;left:50%;transform:translateX(-50%);z-index:45;
  bottom:calc(80px + env(safe-area-inset-bottom));
  width:min(440px, calc(100vw - 24px));
  background:rgba(24,29,36,.96);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;
  box-shadow:0 12px 36px rgba(0,0,0,.55);display:none;gap:12px;align-items:center;
}
#instalar.on{display:flex}
#instalar .ico{width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(150deg,var(--tif),var(--ouro));opacity:.9}
#instalar .tx{flex:1;min-width:0;font-size:13px;line-height:1.45;color:var(--ink-2)}
#instalar .tx b{color:var(--ink);font-weight:600;display:block;font-size:14px}
#instalar .bts{display:flex;gap:6px;flex:none}
body.instalado{}
body.instalado nav{bottom:calc(20px + env(safe-area-inset-bottom))}

/* ---------------- avisos ---------------- */
.aviso{border:1px solid var(--sand);background:var(--sand-g);color:var(--sand);
  border-radius:var(--r);padding:11px 14px;font-size:13px;margin:16px 0}
.vazio{color:var(--ink-3);font-size:13.5px;padding:34px 0;text-align:center;line-height:1.7}
.vazio b{color:var(--ink-2);font-weight:500}
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:92px;z-index:70;
  background:var(--raised);border:1px solid var(--line-2);border-radius:999px;
  padding:10px 18px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .24s,transform .24s;max-width:calc(100vw - 32px);
  box-shadow:0 8px 26px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.vpos{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 0;font-size:12px}
.k-hero{font-size:11.5px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:8px}
.hero .val.v-vazio{font-size:clamp(28px,8vw,40px);line-height:1.05}
/* o calendario: segunda a domingo; o dia com credito acende em tiffany, mais
   forte quanto maior o valor (--a vem do render, teto .45 para o texto) */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.cal-sem{font-size:10.5px;color:var(--ink-3);text-align:center;padding:0 0 3px;letter-spacing:.02em}
.cal-d{min-height:50px;border-radius:8px;padding:5px 5px 6px;display:flex;flex-direction:column;
  justify-content:space-between;align-items:stretch;background:var(--surface);
  border:1px solid transparent;text-align:left;font:inherit;color:inherit}
.cal-d.fora{background:none}
.cal-d .n{font-size:11px;line-height:1;color:var(--ink-3)}
.cal-d.nu .n{color:var(--ink-4)}
.cal-d.tem{background:rgba(62,207,200,var(--a,.2));cursor:pointer;transition:border-color .15s}
.cal-d.tem .n{color:var(--ink-2)}
.cal-d.tem:hover{border-color:var(--tif-d)}
.cal-d .v{font-size:11.5px;font-weight:600;color:var(--ink);text-align:center;white-space:nowrap;letter-spacing:-.01em}
.cal-d.hoje{border-color:var(--sand)}
.cal-d.sel{border-color:var(--tif);box-shadow:inset 0 0 0 1px var(--tif)}
.cal-d.pass{opacity:.5}
.cal-tot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 0;
  font-size:13px;color:var(--ink-2);flex-wrap:wrap}

.grupo.gv .soma{order:2;color:var(--ink-2);font-size:12px}
.grupo.gv::after{order:1}
.grupo.d-pass{opacity:.55}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;width:100%;
  padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.vrow:hover .vr-nm{color:var(--steel)}
.vr-nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr-v{font-size:14px;text-align:right;white-space:nowrap;letter-spacing:-.01em}
.vr-sub{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr-sub.r{text-align:right}
.vr-sub em{font-style:normal;color:var(--sand)}
.vr-sub b{font-weight:500}
.row.prem{flex-wrap:wrap}
.sel{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;font-size:13.5px}
/* as regras da planilha: a propria tela diz quais colunas manter */
.cols{margin:16px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 14px 12px}
.cols-t{font-size:11px;color:var(--ink-3);letter-spacing:.03em;margin:10px 0 2px}
.col-r{display:grid;grid-template-columns:128px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.col-r b{font-weight:600;color:var(--ink)}
.col-r span{color:var(--ink-2)}
.cols-pe{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.5}
/* o input de arquivo invisivel POR CIMA do botao: tocar no botao abre o seletor
   direto, inclusive no iPhone */
.arq{position:relative;overflow:hidden;display:inline-flex;align-items:center;cursor:pointer}
.arq input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
@media (max-width:520px){ .col-r{grid-template-columns:1fr;gap:2px} }

<script>
/*<motor>*/
// ============================================================
// MOTOR DE PROJECAO  -- funcao pura, sem I/O.
// Testado por tests/test_motor.html contra os 48 meses da planilha.
//
// IMPORTANTE: nao arredonda o encadeamento. A planilha encadeia valores
// nao arredondados (E22 = 15450,07229; G3 = 3281,2275) e arredondar a cada
// passo acumula erro ao longo dos 48 meses. Arredondar e trabalho da camada
// de exibicao e da coluna numeric(14,2) do banco.
// ============================================================
window.MOTOR = (function () {

  // "2025-01-01" -> indice absoluto de mes
  function mesN(c) {
    const p = c.split("-");
    return (+p[0]) * 12 + (+p[1]) - 1;
  }

  // Qual regra vale para (categoria, mes). Vence a de MENOR vigencia -- a mais
  // especifica; empate resolve pelo inicio mais recente. E isso que faz a regra
  // 'fixo' de um mes so (jan/2027, jan/2028) vencer o 'crescimento' do ano.
  function regraDoMes(regras, catId, comp) {
    const n = mesN(comp);
    const cand = regras.filter(r =>
      r.category_id === catId && r.ativo !== false &&
      mesN(r.inicio) <= n && (!r.fim || mesN(r.fim) >= n));
    if (!cand.length) return null;
    cand.sort((a, b) => {
      const la = a.fim ? mesN(a.fim) - mesN(a.inicio) : 1e9;
      const lb = b.fim ? mesN(b.fim) - mesN(b.inicio) : 1e9;
      return la - lb || mesN(b.inicio) - mesN(a.inicio);
    });
    return cand[0];
  }

  function valorDaRegra(r, comp, saldoInicial) {
    if (!r) return 0;
    const d = mesN(comp) - mesN(r.inicio);
    switch (r.tipo) {
      case "pct_saldo":
        return saldoInicial * (+r.percentual);
      case "crescimento":
        return (+r.valor) * Math.pow(1 + (+r.percentual), d);
      case "anual":
        return (+comp.split("-")[1] === +r.mes) ? (+r.valor) : 0;
      case "fixo": {
        if (!r.reajuste_pct || !r.reajuste_mes) return +r.valor;
        // quantos aniversarios do reajuste ja passaram desde o inicio
        let anos = 0;
        const ini = mesN(r.inicio), atual = mesN(comp);
        for (let k = ini + 1; k <= atual; k++) {
          if ((k % 12) + 1 === +r.reajuste_mes) anos++;
        }
        return (+r.valor) * Math.pow(1 + (+r.reajuste_pct), anos);
      }
    }
    return 0;
  }

  // Compromissos parcelados que caem neste mes, por categoria.
  // Parcela NAO e regra: regra so vale onde nao ha valor no plano, e a
  // importacao criou linha para todo mes ate 2028 -- uma parcela feita como
  // regra seria invisivel. Por isso ela SOMA por cima do valor do mes.
  function parcelasDoMes(parcelas, comp) {
    const por = {};
    const n = mesN(comp);
    for (const p of (parcelas || [])) {
      if (p.ativo === false) continue;
      const i = n - mesN(p.inicio);
      if (i < 0 || i >= (+p.parcelas)) continue;
      (por[p.category_id] = por[p.category_id] || []).push({
        id: p.id, descricao: p.descricao, obs: p.obs,
        n: i + 1, total: +p.parcelas, valor: +p.valor,
      });
    }
    return por;
  }

  function projetar(d) {
    const out = [];
    let previsaoAnterior = null;

    for (const comp of d.competencias) {
      const info = (d.meses && d.meses[comp]) || {};

      const saldoInicial = (info.saldo_inicial_override !== null && info.saldo_inicial_override !== undefined)
        ? +info.saldo_inicial_override
        : (previsaoAnterior !== null ? previsaoAnterior : 0);

      const parc = parcelasDoMes(d.parcelas, comp);
      const previsto = {};
      let receitas = 0, saidas = 0;

      for (const c of d.categorias) {
        const posto = d.plano[comp] ? d.plano[comp][c.id] : undefined;
        const base = (posto !== null && posto !== undefined)
          ? +posto
          : valorDaRegra(regraDoMes(d.regras, c.id, comp), comp, saldoInicial);
        const extra = (parc[c.id] || []).reduce((a, x) => a + x.valor, 0);
        const v = base + extra;
        previsto[c.id] = v;
        if (c.tipo === "receita") receitas += v; else saidas += v;
      }

      const previsao = saldoInicial + receitas - saidas;

      // realizado: override manual, senao a soma dos saldos por conta, senao Aberto
      const saldos = (d.balances && d.balances[comp]) || null;
      const somaSaldos = (saldos && Object.keys(saldos).length)
        ? Object.keys(saldos).reduce((a, k) => a + (+saldos[k]), 0)
        : null;
      const realizado = (info.realizado_override !== null && info.realizado_override !== undefined)
        ? +info.realizado_override
        : somaSaldos;

      out.push({
        competencia: comp,
        saldoInicial: saldoInicial,
        previsto: previsto,
        parcelas: parc,
        receitas: receitas,
        saidas: saidas,
        previsao: previsao,
        realizado: realizado,
        aberto: realizado === null || realizado === undefined,
        diferenca: (realizado === null || realizado === undefined) ? null : realizado - previsao,
        variacao: (realizado === null || realizado === undefined || !previsao) ? null : realizado / previsao - 1,
      });
      previsaoAnterior = previsao;
    }
    return out;
  }

  return { projetar: projetar, regraDoMes: regraDoMes, valorDaRegra: valorDaRegra,
           parcelasDoMes: parcelasDoMes, mesN: mesN };
})();
/*</motor>*/

/*<contas>*/
// ============================================================
// CONTAS -- agregacoes por conta. Funcao pura: recebe as contas e um mapa
// {competencia: {contaId: saldo}} e devolve composicao, serie empilhada e
// variacao. Sem DOM, sem `estado`, sem rede -- por isso da para testar em
// tests/test_motor.html sem subir o app.
//
// Ate 08/2026 o realizado vem da planilha (fin_months.realizado_override) e o
// motor da prioridade a ele. De 09/2026 em diante nao ha override: o realizado
// E a soma dos saldos que passam por aqui.
// ============================================================
window.CONTAS = (function () {

  // Rampa da FAMILIA do app: turquesa (vizinho do tiffany) e ambar (vizinho do
  // ouro) sao os dois primeiros porque quase sempre carregam as maiores fatias --
  // e sao justamente os dois tons que dao identidade ao site. A anterior era um
  // leque de seis matizes saturados igualmente espacados: passava nos checks mas
  // parecia de outro app (o laranja queimado brigava com o teal).
  //
  // VALIDADA contra o fundo #0A0D11: pior par sob daltonismo dE 20,2 (alvo 8; a
  // anterior dava 9,2), visao normal dE 30,9 (piso 15), contraste de 3,8 a 10,8
  // (piso 3:1).
  //
  // ⚠ A CLARIDADE escalonada (L* 78/70/62/54/71/46) NAO e acaso: sob deuteranopia
  // o matiz colapsa no eixo azul-amarelo e o que sobra para separar as cores e a
  // diferenca de claridade. Testei rampas de luminancia igual -- bonitas, todas

      linhas[r - 1] = cels;
    }
    for (let i = 0; i < linhas.length; i++) if (!linhas[i]) linhas[i] = [];
    return linhas;
  }
  async function lerXLSX(buf) {
    const b = new Uint8Array(buf), ent = entradas(b);
    const abrir = async nome => ent[nome] ? xml(await extrair(b, ent[nome])) : null;
    const wb = await abrir("xl/workbook.xml");
    if (!wb) throw new Error("o arquivo não é uma planilha do Excel");
    const rels = await abrir("xl/_rels/workbook.xml.rels"), alvo = {};
    if (rels) for (const r of tags(rels, "Relationship")) {
      const t = r.getAttribute("Target") || "";
      alvo[r.getAttribute("Id")] = t.charAt(0) === "/" ? t.slice(1) : "xl/" + t.replace(/^\.\//, "");
    }
    const sst = await abrir("xl/sharedStrings.xml");
    const strings = sst ? tags(sst, "si").map(textoSi) : [];
    const ehData = estilosData(await abrir("xl/styles.xml"));
    const abas = [];
    for (const s of tags(wb, "sheet")) {
      const rid = s.getAttributeNS(NS_R, "id") || s.getAttribute("r:id");
      const doc = alvo[rid] ? await abrir(alvo[rid]) : null;
      if (doc) abas.push({ nome: s.getAttribute("name") || "", linhas: linhasDaAba(doc, strings, ehData) });
    }
    return abas;
  }
  // CSV do Excel brasileiro: ";" e Windows-1252; aceita "," e tab, e UTF-8 (com BOM).
  function lerCSV(buf) {
    const b = new Uint8Array(buf);
    let txt;
    try { txt = new TextDecoder("utf-8", { fatal: true }).decode(b); }
    catch (e) { txt = new TextDecoder("windows-1252").decode(b); }
    txt = txt.replace(/^﻿/, "");
    const primeira = txt.split(/\r?\n/).find(l => l.trim()) || "";
    const sep = [";", "\t", ","].map(s => [s, primeira.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
    const linhas = [];
    let linha = [], cel = "", aspas = false;
    for (let i = 0; i < txt.length; i++) {
      const ch = txt[i];
      if (aspas) {
        if (ch === '"') { if (txt[i + 1] === '"') { cel += '"'; i++; } else aspas = false; }
        else cel += ch;
      } else if (ch === '"') aspas = true;
      else if (ch === sep) { linha.push(cel); cel = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && txt[i + 1] === "\n") i++;
        linha.push(cel); linhas.push(linha); linha = []; cel = "";
      } else cel += ch;
    }
    if (cel !== "" || linha.length) { linha.push(cel); linhas.push(linha); }
    return [{ nome: "csv", linhas: linhas.map(l => l.map(x => x.trim() === "" ? null : x.trim())) }];
  }
  async function lerArquivo(arquivo) {
    const buf = await arquivo.arrayBuffer(), b = new Uint8Array(buf);
    if (b[0] === 0x50 && b[1] === 0x4b) return lerXLSX(buf);                     // "PK": zip
    if (b[0] === 0xd0 && b[1] === 0xcf) throw new Error("é um .xls antigo — no Excel, salve como .xlsx ou .csv");
    return lerCSV(buf);
  }
  return { lerXLSX, lerCSV, lerArquivo, colIdx };
})();

// que o patrimonio caia para ~R$ 4.200. Numero aleatorio deixaria o app
// incoerente (grafico torto, soma que nao fecha); a escala mantem tudo

const FOLGA_DISFARCE = 1.4;
function fator(){
  if (!disfarce) return 1;
  if (fatorDisfarce === null){
    const vals = proj.flatMap(m => [m.previsao, m.realizado].filter(v => !vazio(v)));
    const mx = (vals.length ? Math.max.apply(null, vals) : 0) * FOLGA_DISFARCE;
    fatorDisfarce = (mx > TETO_DISFARCE) ? (TETO_DISFARCE / mx) : 1;
  }
  return fatorDisfarce;
}
const dis = v => vazio(v) ? v : v * fator();

const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const NUM = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const vazio = v => v === null || v === undefined || (typeof v === "number" && isNaN(v));
const fmt  = v => vazio(v) ? "—" : BRL.format(dis(v));

  if (vazio(v)) return "—";

  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi";

  let [a,m] = c.split("-").map(Number); m += n;

  return a + "-" + String(m).padStart(2,"0") + "-01";

// Onde o mes de hoje deve terminar -- e quanto isso significa de crescimento
// sobre o ultimo mes ja apurado. E a pergunta mais imediata de quem abre o app.
function mesCorrente(ult){
  const hoje = compHoje();
  const m = mesProj(hoje);
  if (!m) return "";
  const base = ult && ult.competencia < hoje ? ult : null;
  const passo = base ? m.previsao - base.realizado : null;
  let detalhe = "";
  if (!m.aberto){
    const d = m.diferenca;
    detalhe = '<span class="sep">·</span><span class="' + (d>=0?"pos":"neg") + '">' +
      esc(fmtsin(d)) + '</span> <span class="d3">' + (d>=0?"acima":"abaixo") + ' do plano</span>';
  } else if (passo !== null){
    detalhe = '<span class="sep">·</span><span class="' + (passo>=0?"pos":"neg") + '">' +
      esc(fmtsin(passo)) + '</span> <span class="d3">sobre ' + MESES_L[+base.competencia.split("-")[1]-1] + '</span>';
  }
  return '<div class="agora">' +
    '<div class="k">' + (m.aberto ? "O plano prevê fechar " : "Fechou ") + rotuloL(hoje) + ' em</div>' +
    '<div class="v">' + esc(fmt(m.aberto ? m.previsao : m.realizado)) + detalhe + '</div></div>';
}

function fatos(fechados, fim){
  // um fim de ano por ano restante -- ver so 2028 escondia o caminho ate la
  const anoHoje = compHoje().slice(0,4);
  const fins = [];
  for (const a of [...new Set(proj.map(m => m.competencia.slice(0,4)))]){
    if (a < anoHoje) continue;
    const doAno = proj.filter(m => m.competencia.slice(0,4) === a);
    fins.push(doAno[doAno.length-1]);
  }
  const proj_ = fins.length
    ? '<div class="hdr" style="margin-top:22px"><h2>Onde o plano termina cada ano</h2></div><div class="rule"></div>' +
      '<div class="fatos anos">' + fins.map(m =>
        '<div class="fato"><div class="k">' + rotulo(m.competencia) + '</div>' +
        '<div class="v">' + esc(fmt(m.previsao)) + '</div></div>').join("") + '</div>'
    : "";

  const c = compromissos();
  const linhas = [["Meses apurados", fechados.length, "<small> de " + proj.length + "</small>"]];
  if (c) linhas.push(["A pagar até " + rotulo(c.ultimo),
                      '<span class="abr">' + fmt(c.restante) + "</span>",
                      "<small> em " + c.n + " compromisso" + (c.n>1?"s":"") + "</small>"]);
  return proj_ + '<div class="fatos">' + linhas.map(l =>
    '<div class="fato"><div class="k">' + l[0] + '</div>' +
    '<div class="v">' + l[1] + l[2] + '</div></div>').join("") + '</div>';
}

// O ARCO: os 48 meses em forma pura -- sem eixo, sem grade, sem rotulo.
// E a assinatura do app, nao um instrumento de leitura; quem mede e o
// grafico da aba Patrimonio. A linha se desenha UMA vez, na primeira carga.
let arcoJaAnimou = false;
function desenharArco(){
  const box = document.getElementById("arco");
  if (!box || proj.length < 2) return;
  const W = Math.max(280, Math.round(box.getBoundingClientRect().width) || 340);
  const H = Math.round(Math.min(200, Math.max(140, W * 0.42)));
  const PT = 12, PB = 18;
  const vals = proj.flatMap(p => [p.previsao, p.realizado].filter(v => !vazio(v)));
  let mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  const folga = (mx - mn) * 0.12 || 1; mx += folga; mn -= folga;
  const x = i => (i/(proj.length-1)) * W;
  const y = v => PT + (1 - (v-mn)/((mx-mn)||1)) * (H-PT-PB);

  // area do plano: a faixa tiffany por baixo, quieta
  const dPlano = proj.map((p,i) => (i?"L":"M") + x(i).toFixed(1) + " " + y(p.previsao).toFixed(1)).join(" ");
  const areaPlano = dPlano + " L" + W + " " + H + " L0 " + H + " Z";
  // linha do apurado: o ouro, so onde ha realidade
  const reais = proj.map((p,i)=>({p,i})).filter(o => !o.p.aberto);
  const dReal = reais.map((o,k) => (k?"L":"M") + x(o.i).toFixed(1) + " " + y(o.p.realizado).toFixed(1)).join(" ");
  const ult = reais[reais.length-1];
  const iHoje = proj.findIndex(p => p.competencia === compHoje());

  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" ' +
    'role="img" aria-label="Trajetória do patrimônio: plano e apurado, ' +
      rotulo(proj[0].competencia) + ' a ' + rotulo(proj[proj.length-1].competencia) + '">' +
    defsOuro("A") +
    '<path d="' + areaPlano + '" fill="var(--tif)" opacity=".085"/>' +
    '<path d="' + dPlano + '" fill="none" stroke="var(--tif)" stroke-width="1.4" opacity=".55" ' +
      'vector-effect="non-scaling-stroke"/>' +
    (iHoje > 0 ? '<line x1="' + x(iHoje).toFixed(1) + '" y1="' + PT + '" x2="' + x(iHoje).toFixed(1) +
      '" y2="' + (H-PB) + '" stroke="var(--sand)" stroke-dasharray="2 4" opacity=".55"/>' : "") +
    (dReal ? '<g filter="url(#bA)"><path id="arco-linha" d="' + dReal + '" fill="none" ' +
      'stroke="url(#gA)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" ' +
      'vector-effect="non-scaling-stroke"/></g>' +
      '<circle cx="' + x(ult.i).toFixed(1) + '" cy="' + y(ult.p.realizado).toFixed(1) +
      '" r="4.2" fill="var(--ouro)" stroke="var(--bg)" stroke-width="2"/>' : "") +
    '</svg>' +
    '<span class="marca" style="left:2px;transform:none">' + rotulo(proj[0].competencia) + '</span>' +
    (iHoje > 0 ? '<span class="marca" style="left:' + ((x(iHoje)/W)*100).toFixed(1) + '%">hoje</span>' : "") +
    '<span class="marca" style="right:2px;left:auto;transform:none">' +
      rotulo(proj[proj.length-1].competencia) + '</span>';

  // O unico movimento nao pedido da interface, e so na primeira carga.
  // Web Animations API em vez de classe CSS: a animacao comeca no instante da
  // insercao. Com classe, um segundo render reconstroi o SVG e a animacao se
  // perde antes de rodar -- foi o que aconteceu na primeira tentativa.
  const linha = box.querySelector("#arco-linha");
  if (linha && !arcoJaAnimou && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    arcoJaAnimou = true;
    const comp = linha.getTotalLength();
    linha.style.strokeDasharray = comp;
    linha.animate(
      [{ strokeDashoffset: comp }, { strokeDashoffset: 0 }],
      { duration: 950, easing: "cubic-bezier(.33,.9,.35,1)", fill: "both" }
    );
  }
}


// Barras verticais = previsto, linha = apurado. Ver a linha passar por cima
// ou por baixo do topo da barra e o que responde "fechei acima ou abaixo?"
// num relance -- coisa que 48 blocos empilhados nao respondiam.
function desenharCombo(ano){
  const box = document.getElementById("graf");
  if (!box) return;
  const ms = proj.filter(m => m.competencia.slice(0,4) === ano);
  if (!ms.length){ box.innerHTML = ""; return; }
  // largura MEDIDA: com viewBox fixo e preserveAspectRatio="none" a escala
  // horizontal esmaga o texto (11px viram 5px). Derivando W do box, escala = 1.
  const W = Math.max(280, Math.round(box.getBoundingClientRect().width) || 340);
  const H = 220, PL = 4, PR = 4, PT = 18, PB = 26;
  const vals = ms.flatMap(m => [m.previsao, m.realizado].filter(v => !vazio(v)));
  const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  const amp = (max - min) || max || 1;
  const lo = min - amp*0.45, hi = max + amp*0.15;   // base fora do zero: senao 12 barras iguais
  const y = v => PT + (1 - (v-lo)/(hi-lo)) * (H-PT-PB);
  const bw = (W-PL-PR)/ms.length, bar = Math.min(30, bw*0.56);
  const cx = i => PL + bw*i + bw/2;
  const hoje = compHoje();

  let barras = "", eixo = "", pts = [], bolas = "", alvos = "";
  ms.forEach((m,i) => {
    const yb = y(m.previsao), x0 = cx(i)-bar/2;
    barras += '<rect x="' + x0.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bar.toFixed(1) +
      '" height="' + Math.max(1,(H-PB-yb)).toFixed(1) + '" rx="3" fill="var(--tif)" opacity="' +
      (m.aberto ? ".30" : ".62") + '"/>';
    eixo += '<text x="' + cx(i).toFixed(1) + '" y="' + (H-9) + '" text-anchor="middle" font-size="11" ' +
      'fill="' + (m.competencia===hoje ? "var(--sand)" : "var(--ink-3)") + '">' + MESES[i] + '</text>';
    if (!m.aberto){
      pts.push([cx(i), y(m.realizado)]);
      bolas += '<circle cx="' + cx(i).toFixed(1) + '" cy="' + y(m.realizado).toFixed(1) +
        '" r="3.4" fill="var(--bg)" stroke="var(--ouro)" stroke-width="2"/>';
    }
    alvos += '<rect data-comp="' + m.competencia + '" x="' + (PL+bw*i).toFixed(1) + '" y="0" width="' +
      bw.toFixed(1) + '" height="' + H + '" fill="transparent" style="cursor:pointer"><title>' +
      rotulo(m.competencia) + ' — previsto ' + fmtn(m.previsao) +
      (m.aberto ? " (em aberto)" : " · apurado " + fmtn(m.realizado)) + '</title></rect>';
  });
  const linha = pts.length > 1
    ? '<path d="' + pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ") +
      '" fill="none" stroke="url(#gC)" stroke-width="2.6" stroke-linejoin="round" ' +
      'stroke-linecap="round" vector-effect="non-scaling-stroke"/>' : "";

  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" ' +
    'role="img" aria-label="Previsto em barras e apurado em linha, ' + ano + '">' +
    defsOuro("C") +
    '<line x1="0" y1="' + (H-PB) + '" x2="' + W + '" y2="' + (H-PB) + '" stroke="var(--line)"/>' +
    barras + '<g filter="url(#bC)">' + linha + bolas + '</g>' + eixo + alvos + '</svg>' +
    '<div class="legenda"><span><i class="sw-bar"></i>previsto</span>' +
    '<span><i class="sw-lin"></i>apurado</span>' +
    '<span class="d3">toque num mês para o detalhe</span></div>';
  box.querySelectorAll("[data-comp]").forEach(r => r.onclick = () => folhaMes(r.dataset.comp));
}


function listaAno(ano){

  const cresc = (f.aberto ? f.previsao : f.realizado) - ini;
  let out = '<div class="ano">' + ano + ' <em>' + fmtsin(cresc) + ' no ano</em></div>';
  const hoje = compHoje();

    out += '<button class="mrow' + (m.competencia===hoje?" agora":"") + '" data-comp="' + m.competencia + '">' +
      '<span class="mes">' + MESES[+m.competencia.split("-")[1]-1] + '</span>' +
      '<span class="dif ' + (m.aberto ? "d3" : (d>=0?"pos":"neg")) + '">' +

  return out;
}

// Sobra mensal além do plano. Onde há âncora o acumulado zera, então a sobra
// daquele mês é a própria diferença.
function sobrasMensais(){
  const out = [];
  for (let i = 1; i < proj.length; i++){
    const m = proj[i], ant = proj[i-1];
    if (m.aberto || ant.aberto) continue;
    const info = estado.meses[m.competencia] || {};
    const ancorado = !vazio(info.saldo_inicial_override);
    out.push(ancorado ? m.diferenca : m.diferenca - ant.diferenca);
  }
  return out;
}
function leitura(){
  const s = sobrasMensais();
  if (s.length < 3) return "";
  const media = s.reduce((a,b)=>a+b,0)/s.length;
  const dp = Math.sqrt(s.reduce((a,b)=>a+Math.pow(b-media,2),0)/s.length);
  const acima = s.filter(x=>x>0).length;
  const fim = proj[proj.length-1];
  const restantes = proj.filter(m=>m.aberto).length;
  const ajustada = fim.previsao + media*restantes;
  return '<div class="nota' + (media>=0?"":" fria") + '">' +
    'Você fechou acima do plano em <b>' + acima + ' dos ' + s.length + ' meses</b> comparáveis, ' +
    'sobrando <b>' + fmt(media) + ' por mês</b> em média (oscilando ' + fmt(dp) + ').<br>' +
    'No mesmo ritmo, ' + rotuloL(fim.competencia) + ' fecha perto de <b>' + fmt(ajustada) + '</b>.' +
  '</div>';
}
function compromissos(){
  const hoje = compHoje(); let n=0, restante=0, ultimo="";
  for (const p of estado.parcelas){
    if (p.ativo === false) continue;
    const ini = MOTOR.mesN(p.inicio), fimN = ini + (+p.parcelas) - 1, agora = MOTOR.mesN(hoje);
    if (fimN < agora) continue;
    n++; restante += (fimN - Math.max(ini,agora) + 1) * (+p.valor);
    const fc = somaMes(p.inicio, (+p.parcelas)-1);
    if (fc > ultimo) ultimo = fc;
  }
  return n ? { n, restante, ultimo } : null;
}

  const info = estado.meses[mesAtual] || {};

  let out = avisoTravado() +
    '<div class="mnav"><button id="m-ant" aria-label="Mês anterior">' + ICO.ant + '</button>' +
    '<span class="lbl">' + rotuloL(mesAtual) + '</span>' +

  for (const tipo of ["receita","despesa"]){

        out += '<div class="grupo">' + esc(grupo) + '<span class="soma">' + fmtn(sg) + '</span></div>';
      }
      const congelado = !!(estado.plano[mesAtual] && estado.plano[mesAtual][c.id]);
      const calc = c.calculo !== "manual" && !congelado;
      const v = m.previsto[c.id], rv = real[c.id];
      const n = (estado.entries[mesAtual]||[]).filter(e => e.category_id === c.id).length;
      out += '<div class="lrow">' +
        '<button class="nm" data-cat="' + c.id + '">' + esc(c.nome) +
          (calc ? '<span class="fx" title="calculado por regra">ƒ</span>' : "") + '</button>' +
        '<span class="rl">' + (rv !== undefined ? '<b>' + esc(fmtn(rv)) + '</b>' +
          (n>1 ? ' <span class="d3">' + n + '×</span>' : "") : "") + '</span>' +
        '<input class="cel p-cel' + (calc?" calc":"") + (v?"":" zero") + '" data-cat="' + c.id +
          '" value="' + esc(fmtn(v)) + '" inputmode="decimal" aria-label="Previsto de ' + esc(c.nome) + '">' +
        (m.parcelas[c.id]||[]).map(x =>
          '<span class="parc" title="' + esc(x.obs||"") + '">↳ <span class="pn">' +
          esc(x.descricao||x.obs||"compromisso") + '</span><em>' + x.n + '/' + x.total + '</em>' +
          '<span class="pv">' + esc(fmtn(x.valor)) + '</span></span>').join("") +

  }

  const d = m.diferenca;
  out += '<div class="tot">' +

      (vazio(info.saldo_inicial_override) ? "" : ' <span class="d3 t11">âncora</span>') + '</span></div>' +
    '<div><span>Receitas</span><span class="pos">' + esc(fmt(m.receitas)) + '</span></div>' +
    '<div><span>Saídas</span><span class="neg">' + esc(fmt(m.saidas)) + '</span></div>' +
    '<div class="destaque"><span>Previsão</span><span>' + esc(fmt(m.previsao)) + '</span></div>' +
    '<div><span>Apurado</span><span>' + (m.aberto ? '<span class="abr">em aberto</span>' : esc(fmt(m.realizado))) + '</span></div>' +
    (m.aberto ? "" : '<div><span>Diferença</span><span class="' + (d>=0?"pos":"neg") + '">' +
      esc(fmtsin(d)) + ' <span class="d3 t12">' + fmtpct(m.variacao) + '</span></span></div>') +
  '</div>' +
  (info.obs ? '<div class="nota fria">' + esc(info.obs) + '</div>' : "") +
  '<div class="acoes">' +
    '<button class="btn mini" id="m-comp">Novo compromisso</button>' +
    '<button class="btn mini" id="m-ancora">' + (vazio(info.saldo_inicial_override)?"Reancorar":"Remover âncora") + '</button>' +
    '<button class="btn mini plain" id="m-nota">' + (info.obs?"Editar nota":"Anotar o mês") + '</button>' +
    '<button class="btn mini plain" id="m-lanc">Lançamentos</button>' +
    '<button class="btn mini plain xls" data-x="mes">Excel</button>' +
  '</div>';

  el.innerHTML = out;
  document.getElementById("m-ant").onclick  = () => { mesAtual = somaMes(mesAtual,-1); render(); };
  document.getElementById("m-prox").onclick = () => { mesAtual = somaMes(mesAtual, 1); render(); };
  document.getElementById("m-ancora").onclick = () => acaoAncora(info);
  document.getElementById("m-nota").onclick = () => folhaNota(info);
  document.getElementById("m-lanc").onclick = () => folhaLancamentos(null);
  document.getElementById("m-comp").onclick = () => folhaCompromisso(null);
  el.querySelectorAll(".p-cel").forEach(inp => {
    inp.addEventListener("focus", () => inp.select());
    inp.addEventListener("blur", () => aplicarCelula(inp));
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") inp.blur(); });
  });
  el.querySelectorAll(".lrow .nm").forEach(b => b.onclick = () => folhaCategoriaMes(b.dataset.cat));
}

async function aplicarCelula(inp){
  const catId = inp.dataset.cat, m = mesProj(mesAtual);
  const antes = m.previsto[catId], v = parseNum(inp.value);
  if (v === null || Math.abs(v-antes) < 0.005){ inp.value = fmtn(antes); return; }
  const cat = estado.categorias.find(c => c.id === catId);
  try {
    await definirPlano(mesAtual, catId, v);
    if (cat && cat.calculo !== "manual") toast(cat.nome + " congelado em " + rotulo(mesAtual));
    render();
    // confirma na propria celula: gravou. Sem toast, que viraria spam ao editar varias.
    tremer();
    const nova = document.querySelector('#s-mes .p-cel[data-cat="' + catId + '"]');
    if (nova){ nova.classList.add("salvo"); setTimeout(() => nova.classList.remove("salvo"), 800); }
  } catch(e){ inp.value = fmtn(antes); }
}

function folhaCategoriaMes(catId){
  const c = estado.categorias.find(x => x.id === catId);
  const m = mesProj(mesAtual);
  const n = (estado.entries[mesAtual]||[]).filter(e => e.category_id === catId).length;
  const congelado = !!(estado.plano[mesAtual] && estado.plano[mesAtual][catId]);
  abrirFolha(
    "<h3>" + esc(c.nome) + "</h3>" +
    '<div class="sub">' + rotuloL(mesAtual) + " — previsto " + fmt(m.previsto[catId]) + '</div>' +
    '<div class="acoes" style="margin-top:0;flex-direction:column;align-items:stretch">' +
      '<button class="btn" id="f-lanc">Lançamentos' + (n?" ("+n+")":"") + '</button>' +
      '<button class="btn" id="f-rep">Repetir este valor até o fim</button>' +
      '<button class="btn" id="f-comp">Novo compromisso parcelado</button>' +
      (congelado && c.calculo !== "manual"
        ? '<button class="btn plain" id="f-solta">Voltar a calcular pela regra</button>' : "") +
      '<button class="btn plain" id="f-fecha">Fechar</button></div>',
    () => {
      document.getElementById("f-fecha").onclick = fecharFolha;
      document.getElementById("f-lanc").onclick = () => folhaLancamentos(catId);
      document.getElementById("f-comp").onclick = () => folhaCompromisso(null, catId);
      document.getElementById("f-rep").onclick = async () => { fecharFolha(); await repetirValor(catId, m.previsto[catId]); };

      if (s) s.onclick = async () => { fecharFolha(); await limparPlano(mesAtual, catId); render(); toast("Voltou a seguir a regra"); };
    });
}
async function repetirValor(catId, valor){
  const daqui = estado.competencias.filter(c => c > mesAtual);
  if (!daqui.length){ toast("Não há meses à frente"); return; }
  const cat = estado.categorias.find(c => c.id === catId);
  const r = await salvar("fin_plan",
    daqui.map(c => ({ competencia:c, category_id:catId, valor:valor, origem:"manual" })),
    "user_id,competencia,category_id");
  if (r) for (const l of r) (estado.plano[l.competencia] = estado.plano[l.competencia] || {})[catId] = l;
  reprojetar(); render();
  toast(cat.nome + " = " + fmtn(valor) + " em " + daqui.length + " meses");
}

function folhaLancamentos(catId){
  const lista = (estado.entries[mesAtual]||[]).filter(e => !catId || e.category_id === catId)
    .sort((a,b) => a.data < b.data ? 1 : -1);
  const cat = catId && estado.categorias.find(c => c.id === catId);
  const total = lista.reduce((a,e) => a + (+e.valor), 0);
  let h = "<h3>" + (cat ? esc(cat.nome) : "Lançamentos") + "</h3>" +
    '<div class="sub">' + rotuloL(mesAtual) +
      (lista.length ? " — " + lista.length + " lançamento" + (lista.length>1?"s":"") + ", " + fmt(total) : "") + '</div>';
  if (!lista.length){
    h += '<div class="vazio"><b>Nenhum lançamento neste mês.</b><br>Registre o primeiro abaixo.</div>';
  } else {
    for (const e of lista){
      const c = estado.categorias.find(x => x.id === e.category_id);
      h += '<div class="row"><span class="nm">' + esc(e.descricao || (c?c.nome:"—")) +
        '<br><span class="t11 d3">' + esc(e.data.split("-").reverse().join("/")) +
        (cat ? "" : " · " + esc(c?c.nome:"")) + '</span></span>' +
        '<span class="vl">' + esc(fmtn(e.valor)) + '</span>' +
        '<button class="btn mini plain del" data-id="' + e.id + '">✕</button></div>';
    }
  }
  h += '<div class="acoes"><button class="btn pri" id="novo">Novo lançamento</button>' +
       '<button class="btn plain" id="fechar">Fechar</button></div>';
  abrirFolha(h, () => {
    document.getElementById("fechar").onclick = fecharFolha;
    document.getElementById("novo").onclick = () => folhaNovoLancamento(catId);
    document.querySelectorAll(".del").forEach(b => b.onclick = async () => {
      await apagar("fin_entries", b.dataset.id);
      estado.entries[mesAtual] = (estado.entries[mesAtual]||[]).filter(x => x.id !== b.dataset.id);
      folhaLancamentos(catId); render();
    });
  });
}

  const cats = estado.categorias.filter(c => c.ativo !== false).map(c =>
    '<option value="' + c.id + '"' + (c.id===p.category_id?" selected":"") + '>' +
    esc(c.nome) + (c.tipo==="receita"?" (receita)":"") + '</option>').join("");
  abrirFolha(
    "<h3>" + (comp?"Editar compromisso":"Novo compromisso") + "</h3>" +
    "<div class='sub'>Uma parcela que se repete por N meses e some sozinha no fim. " +
    "Ela <b>soma</b> ao que já está previsto na categoria.</div>" +
    '<label class="f">O que é<input id="cp-desc" value="' + esc(p.descricao||"") + '" placeholder="Ex.: Sofá da sala 10x"></label>' +
    '<div class="f2"><label class="f">Valor da parcela<input id="cp-valor" inputmode="decimal" value="' +
      (vazio(p.valor)?"":fmtn(p.valor)) + '" placeholder="0,00"></label>' +
    '<label class="f">Nº de parcelas<input id="cp-n" inputmode="numeric" value="' + (p.parcelas||12) + '"></label></div>' +
    '<label class="f">Categoria<select id="cp-cat">' + cats + '</select></label>' +
    '<label class="f">Primeira parcela<input id="cp-ini" type="month" value="' + (p.inicio||mesAtual).slice(0,7) + '"></label>' +
    '<label class="f">Observação<input id="cp-obs" value="' + esc(p.obs||"") +
      '" placeholder="Para lembrar daqui a um ano por que isso existe"></label>' +
    '<div id="cp-previa" class="nota fria" style="margin-top:18px"></div>' +
    '<div class="acoes"><button class="btn pri" id="ok">' + (comp?"Salvar":"Criar compromisso") + '</button>' +
    (comp?'<button class="btn plain" id="rm">Excluir</button>':"") +
    '<button class="btn plain" id="cancel">Cancelar</button></div>',
    () => {
      const previa = () => {
        const v = parseNum(document.getElementById("cp-valor").value) || 0;
        const n = parseNum(document.getElementById("cp-n").value) || 0;
        const ini = (document.getElementById("cp-ini").value || mesAtual.slice(0,7)) + "-01";
        const el = document.getElementById("cp-previa");
        el.innerHTML = (!v || !n) ? "Preencha valor e número de parcelas."
          : '<b>' + fmtn(v) + '</b> por mês de <b>' + rotulo(ini) + '</b> a <b>' +
            rotulo(somaMes(ini, n-1)) + '</b> — total de <b>' + fmt(v*n) + '</b>.';
      };
      ["cp-valor","cp-n","cp-ini"].forEach(id => document.getElementById(id).addEventListener("input", previa));
      previa();
      document.getElementById("cancel").onclick = fecharFolha;
      const rm = document.getElementById("rm");
      if (rm) rm.onclick = async () => {
        await apagar("fin_installments", comp.id);
        estado.parcelas = estado.parcelas.filter(x => x.id !== comp.id);
        fecharFolha(); reprojetar(); render(); toast("Compromisso excluído");
      };
      document.getElementById("ok").onclick = async () => {
        const linha = {
          descricao: document.getElementById("cp-desc").value.trim(),
          valor: parseNum(document.getElementById("cp-valor").value),
          parcelas: Math.round(parseNum(document.getElementById("cp-n").value)||0),
          category_id: document.getElementById("cp-cat").value,
          inicio: (document.getElementById("cp-ini").value || mesAtual.slice(0,7)) + "-01",
          obs: document.getElementById("cp-obs").value || null, ativo:true };
        if (!linha.descricao){ toast("Diga o que é o compromisso"); return; }
        if (!linha.valor || linha.valor <= 0){ toast("Informe o valor da parcela"); return; }
        if (!linha.parcelas || linha.parcelas < 1){ toast("Informe quantas parcelas"); return; }
        if (!linha.obs) linha.obs = linha.descricao;
        if (comp){ await patch("fin_installments", comp.id, linha); Object.assign(comp, linha); }
        else { const r = await salvar("fin_installments", linha); if (r && r[0]) estado.parcelas.push(r[0]); }
        fecharFolha(); reprojetar(); render();
        toast(linha.parcelas + "× " + fmtn(linha.valor) + " lançadas");
      };
    });
}
function listaCompromissos(){
  if (!estado.parcelas.length)
    return '<div class="vazio"><b>Nenhum compromisso.</b><br>Use para financiamento, parcela de viagem, curso —<br>o app tira sozinho quando acabar.</div>';
  const hoje = compHoje();
  return estado.parcelas.slice().sort((a,b) => a.inicio.localeCompare(b.inicio)).map(p => {
    const fimC = somaMes(p.inicio, (+p.parcelas)-1);
    const c = estado.categorias.find(x => x.id === p.category_id);
    const pagas = Math.min(+p.parcelas, Math.max(0, MOTOR.mesN(hoje) - MOTOR.mesN(p.inicio) + 1));
    const acabou = fimC < hoje;
    return '<div class="row"><span class="nm">' + esc(p.descricao) +
      '<br><span class="t11 d3">' + esc(c?c.nome:"?") + ' · ' + fmtn(p.valor) + ' × ' + p.parcelas +
      ' · ' + rotulo(p.inicio) + '–' + rotulo(fimC) +
      (acabou ? ' · encerrado' : '</span> <span class="t11 abr">' + pagas + '/' + p.parcelas) + '</span></span>' +
      '<span class="vl d2">' + (acabou ? "" : fmtn((+p.valor)*((+p.parcelas)-pagas))) + '</span>' +
      '<button class="btn mini plain ed-comp" data-id="' + p.id + '">editar</button></div>';
  }).join("");
}
