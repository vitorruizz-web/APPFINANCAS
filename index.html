<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<title>Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0E1420; --surface:#151D2C; --surface2:#1B2436;
  --line:#23304A; --line-soft:#1A2334;
  --ink:#E6EBF2; --dim:#8496B0; --dim2:#5C6E88;
  --verde:#3DBE7D; --verde-d:#1E6B47;
  --azul:#5B9BFF; --azul-d:#2C4E80;
  --ambar:#E0A33A; --rosa:#F0637B;
  --r:8px; --pad:16px;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer;background:none;border:0}
a{color:var(--azul)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.pos{color:var(--verde)} .neg{color:var(--rosa)} .abr{color:var(--ambar)}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
.small{font-size:12.5px} .tiny{font-size:11.5px;letter-spacing:.01em}

/* ---------- estrutura ---------- */
#app{display:none}
.top{
  position:sticky; top:0; z-index:40; background:rgba(14,20,32,.92);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line-soft);
  padding-top:env(safe-area-inset-top);
}
.top-in{display:flex;align-items:center;gap:10px;padding:11px var(--pad)}
.top h1{font-family:var(--serif);font-size:21px;margin:0;font-weight:400;flex:1;letter-spacing:0}
.chip{
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
  font-size:12.5px; color:var(--dim); background:var(--surface);
}
main{padding:0 var(--pad) 120px}
section{display:none} section.on{display:block}
.sec-h{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:26px 0 10px; padding-bottom:7px; border-bottom:1px solid var(--line-soft);
}
.sec-h h2{font-size:13.5px;font-weight:600;margin:0;color:var(--dim)}

/* ---------- barra inferior (pilula) ---------- */
nav{
  position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%); z-index:50;
  display:flex; gap:2px; padding:5px;
  background:rgba(21,29,44,.94); backdrop-filter:blur(14px);
  border:1px solid var(--line); border-radius:999px; overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.5); max-width:calc(100vw - 24px);
  transition:transform .28s ease, opacity .28s ease;
}
body.nav-off nav{transform:translateX(-50%) translateY(170%); opacity:0}
nav button{
  padding:8px 13px; border-radius:999px; font-size:12.5px; color:var(--dim);
  white-space:nowrap; display:flex; align-items:center; gap:6px; min-width:0;
}
nav button .lb{display:none}
nav button.on{background:var(--surface2); color:var(--ink)}
nav button.on .lb{display:inline}
nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
@media (max-width:359px){ nav button{padding:8px 10px} nav button.on .lb{display:none} }

/* ---------- resumo: o numero e a regua ---------- */
.hero{padding:26px 0 6px}
.hero .v{font-family:var(--serif);font-size:clamp(40px,13vw,58px);line-height:1;letter-spacing:-.02em}
.hero .cur{font-size:.42em;color:var(--dim);vertical-align:.42em;letter-spacing:.02em;margin-right:.1em}
.hero .cap{color:var(--dim);font-size:13px;margin-top:9px}
.hero .gap{margin-top:15px;font-size:14.5px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hero .gap b{font-weight:600;font-size:16px}
.leitura{
  margin:22px 0 4px;padding:13px 15px;border-left:2px solid var(--verde);
  background:linear-gradient(90deg,rgba(61,190,125,.07),transparent 80%);
  border-radius:0 var(--r) var(--r) 0;font-size:13.5px;line-height:1.55;color:var(--dim);
}
.leitura b{color:var(--ink);font-weight:600}
.leitura.fria{border-left-color:var(--azul);background:linear-gradient(90deg,rgba(91,155,255,.07),transparent 80%)}

.legenda{display:flex;align-items:center;gap:5px;color:var(--dim2)}
.legenda i{width:13px;height:9px;border-radius:2px;display:inline-block;margin-left:7px}
.legenda i:first-child{margin-left:0}
.legenda .sw-prev{border:1px solid var(--azul);background:rgba(91,155,255,.09)}
.legenda .sw-real{background:var(--verde);opacity:.85;height:7px}

/* regua de meses */
.regua{margin-top:6px}
.ano{
  display:flex;align-items:center;gap:10px;margin:18px 0 8px;
  font-size:12px;color:var(--dim2);
}
.ano::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.mrow{
  display:grid; grid-template-columns:26px 1fr 54px 54px; gap:8px;
  align-items:center; padding:2px 0; min-width:0;
}
.mrow.hoje{background:linear-gradient(90deg,rgba(224,163,58,.10),transparent 70%);
  margin-left:-8px;padding-left:8px;border-radius:5px}
.mrow .mn{font-size:12px;color:var(--dim2)}
.mrow.hoje .mn{color:var(--ambar)}
.bars{position:relative;height:15px;min-width:0}
.bars i{position:absolute;left:0;top:0;height:100%;border-radius:3px;display:block}
.bars .b-prev{border:1px solid var(--azul);background:rgba(91,155,255,.09)}
.bars .b-real{background:var(--verde);opacity:.85;height:8px;top:3.5px;border-radius:2px}
.mrow .vv{font-size:12px;text-align:right;color:var(--dim)}
.mrow .dd{font-size:11.5px;text-align:right}

/* ---------- listas / linhas ---------- */
.row{
  display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--line-soft); min-width:0;
}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .vl{text-align:right;white-space:nowrap}
.grupo{
  font-size:11.5px;color:var(--dim2);margin:20px 0 2px;
  display:flex;align-items:center;gap:9px;
}
.grupo::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.dot{width:7px;height:7px;border-radius:2px;flex:none}

/* linha do razao: nome | realizado | previsto  -- compacta de proposito,
   sao 18 categorias e a rolagem tem de caber no polegar */
.lrow{
  display:grid;grid-template-columns:1fr auto 108px;gap:10px;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--line-soft);min-width:0;
}
.lrow .nm{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:14px;text-align:left;
}
.lrow .nm:hover{color:var(--azul)}
.lrow .rl{font-size:11.5px;color:var(--dim2);text-align:right;white-space:nowrap}
.lrow .rl b{color:var(--verde);font-weight:500}
.parc{
  grid-column:1/-1;font-size:11.5px;color:var(--dim2);padding:0 0 5px 2px;
  display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
}
.parc em{color:var(--ambar);font-style:normal;flex:none}
.parc{flex-wrap:nowrap}
.parc .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* celula editavel: numero de razao, nao caixa de formulario */
.cel{
  border:1px solid transparent;border-radius:5px;padding:4px 7px;text-align:right;
  width:108px;background:transparent;color:var(--ink);font-size:14.5px;
}
.cel:hover{border-color:var(--line)}
.cel:focus{border-color:var(--azul);background:var(--surface);outline:none}
.cel.zero{color:var(--dim2)}
.cel.calc{color:var(--azul)}
.cel.calc::placeholder{color:var(--azul-d)}

/* totais */
.tot{
  margin-top:18px;border-top:1px solid var(--line);padding-top:12px;
  display:grid;gap:7px;
}
.tot div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.tot .grande{font-size:17px;padding-top:8px;margin-top:4px;border-top:1px solid var(--line-soft)}

/* botoes */
.btn{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:9px 14px;font-size:13.5px;color:var(--ink);
}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--verde-d);border-color:var(--verde-d);color:#EAFBF2}
.btn.pri:hover{background:#237c53}
.btn.mini{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* navegacao de mes */
.mnav{display:flex;align-items:center;gap:10px;margin:18px 0 4px}
.mnav .lbl{flex:1;text-align:center;font-size:15px}
.mnav button{
  width:36px;height:36px;border:1px solid var(--line);border-radius:50%;
  background:var(--surface);color:var(--dim);font-size:16px;line-height:1;
}

/* folha modal */
.sheet-bg{
  position:fixed;inset:0;background:rgba(6,9,15,.72);z-index:60;display:none;
  align-items:flex-end;justify-content:center;
}
.sheet-bg.on{display:flex}
.sheet{
  background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;
  border:1px solid var(--line);border-bottom:0;padding:18px var(--pad);
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;
}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
.sheet .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
label.f{display:block;margin:12px 0 0;font-size:12.5px;color:var(--dim)}
label.f input,label.f select{
  width:100%;margin-top:5px;background:var(--ground);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;font-size:15px;
}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tabela do plano */
.tabwrap{overflow-x:auto;max-width:100%;margin-top:8px;-webkit-overflow-scrolling:touch}
table.plano{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.plano th,table.plano td{padding:6px 9px;border-bottom:1px solid var(--line-soft);text-align:right}
table.plano th:first-child,table.plano td:first-child{
  text-align:left;position:sticky;left:0;background:var(--ground);z-index:1;
  border-right:1px solid var(--line-soft);
}
table.plano thead th{color:var(--dim2);font-weight:500;font-size:11.5px;border-bottom:1px solid var(--line)}
table.plano tr.sep td{background:var(--surface);color:var(--dim);font-size:11px;padding:4px 9px}
table.plano td.z{color:var(--dim2)}

/* login */
#login{
  min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:32px var(--pad);max-width:420px;margin:0 auto;
}
#login .marca{font-family:var(--serif);font-size:40px;line-height:1;margin-bottom:6px}
#login .sub{color:var(--dim);margin-bottom:30px;font-size:14px}
#login .erro{color:var(--rosa);font-size:13.5px;margin-top:14px;min-height:20px}
#login .btn{width:100%;margin-top:20px;padding:13px}

/* avisos */
.aviso{
  border:1px solid var(--ambar);background:rgba(224,163,58,.09);color:var(--ambar);
  border-radius:var(--r);padding:10px 13px;font-size:13px;margin:14px 0;
}
.vazio{color:var(--dim);font-size:14px;padding:22px 0;text-align:center;line-height:1.6}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:70;
  background:var(--surface2);border:1px solid var(--line);border-radius:999px;
  padding:9px 17px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .22s;
  max-width:calc(100vw - 32px);
}
#toast.on{opacity:1}
</style>

<script>
/*<motor>*/
// ============================================================
// MOTOR DE PROJECAO  -- funcao pura, sem I/O.
// Testado por tests/test_motor.html contra os 48 meses da planilha.
//
// IMPORTANTE: nao arredonda o encadeamento. A planilha encadeia valores
// nao arredondados (E22 = 15450,07229; G3 = 3281,2275) e arredondar a cada
// passo acumula erro ao longo dos 48 meses. Arredondar e trabalho da camada
// de exibicao e da coluna numeric(14,2) do banco.
// ============================================================
window.MOTOR = (function () {

  // "2025-01-01" -> indice absoluto de mes
  function mesN(c) {
    const p = c.split("-");
    return (+p[0]) * 12 + (+p[1]) - 1;
  }

  // Qual regra vale para (categoria, mes). Vence a de MENOR vigencia -- a mais
  // especifica; empate resolve pelo inicio mais recente. E isso que faz a regra
  // 'fixo' de um mes so (jan/2027, jan/2028) vencer o 'crescimento' do ano.
  function regraDoMes(regras, catId, comp) {
    const n = mesN(comp);
    const cand = regras.filter(r =>
      r.category_id === catId && r.ativo !== false &&
      mesN(r.inicio) <= n && (!r.fim || mesN(r.fim) >= n));
    if (!cand.length) return null;
    cand.sort((a, b) => {
      const la = a.fim ? mesN(a.fim) - mesN(a.inicio) : 1e9;
      const lb = b.fim ? mesN(b.fim) - mesN(b.inicio) : 1e9;
      return la - lb || mesN(b.inicio) - mesN(a.inicio);
    });
    return cand[0];
  }

  function valorDaRegra(r, comp, saldoInicial) {
    if (!r) return 0;
    const d = mesN(comp) - mesN(r.inicio);
    switch (r.tipo) {
      case "pct_saldo":
        return saldoInicial * (+r.percentual);
      case "crescimento":
        return (+r.valor) * Math.pow(1 + (+r.percentual), d);
      case "anual":
        return (+comp.split("-")[1] === +r.mes) ? (+r.valor) : 0;
      case "fixo": {
        if (!r.reajuste_pct || !r.reajuste_mes) return +r.valor;
        // quantos aniversarios do reajuste ja passaram desde o inicio
        let anos = 0;
        const ini = mesN(r.inicio), atual = mesN(comp);
        for (let k = ini + 1; k <= atual; k++) {
          if ((k % 12) + 1 === +r.reajuste_mes) anos++;
        }
        return (+r.valor) * Math.pow(1 + (+r.reajuste_pct), anos);
      }
    }
    return 0;
  }

  // Compromissos parcelados que caem neste mes, por categoria.
  // Parcela NAO e regra: regra so vale onde nao ha valor no plano, e a
  // importacao criou linha para todo mes ate 2028 -- uma parcela feita como
  // regra seria invisivel. Por isso ela SOMA por cima do valor do mes.
  function parcelasDoMes(parcelas, comp) {
    const por = {};
    const n = mesN(comp);
    for (const p of (parcelas || [])) {
      if (p.ativo === false) continue;
      const i = n - mesN(p.inicio);
      if (i < 0 || i >= (+p.parcelas)) continue;
      (por[p.category_id] = por[p.category_id] || []).push({
        id: p.id, descricao: p.descricao, obs: p.obs,
        n: i + 1, total: +p.parcelas, valor: +p.valor,
      });
    }
    return por;
  }

  function projetar(d) {
    const out = [];
    let previsaoAnterior = null;

    for (const comp of d.competencias) {
      const info = (d.meses && d.meses[comp]) || {};

      const saldoInicial = (info.saldo_inicial_override !== null && info.saldo_inicial_override !== undefined)
        ? +info.saldo_inicial_override
        : (previsaoAnterior !== null ? previsaoAnterior : 0);

      const parc = parcelasDoMes(d.parcelas, comp);
      const previsto = {};
      let receitas = 0, saidas = 0;

      for (const c of d.categorias) {
        const posto = d.plano[comp] ? d.plano[comp][c.id] : undefined;
        const base = (posto !== null && posto !== undefined)
          ? +posto
          : valorDaRegra(regraDoMes(d.regras, c.id, comp), comp, saldoInicial);
        const extra = (parc[c.id] || []).reduce((a, x) => a + x.valor, 0);
        const v = base + extra;
        previsto[c.id] = v;
        if (c.tipo === "receita") receitas += v; else saidas += v;
      }

      const previsao = saldoInicial + receitas - saidas;

      // realizado: override manual, senao a soma dos saldos por conta, senao Aberto
      const saldos = (d.balances && d.balances[comp]) || null;
      const somaSaldos = (saldos && Object.keys(saldos).length)
        ? Object.keys(saldos).reduce((a, k) => a + (+saldos[k]), 0)
        : null;
      const realizado = (info.realizado_override !== null && info.realizado_override !== undefined)
        ? +info.realizado_override
        : somaSaldos;

      out.push({
        competencia: comp,
        saldoInicial: saldoInicial,
        previsto: previsto,
        parcelas: parc,
        receitas: receitas,
        saidas: saidas,
        previsao: previsao,
        realizado: realizado,
        aberto: realizado === null || realizado === undefined,
        diferenca: (realizado === null || realizado === undefined) ? null : realizado - previsao,
        variacao: (realizado === null || realizado === undefined || !previsao) ? null : realizado / previsao - 1,
      });
      previsaoAnterior = previsao;
    }
    return out;
  }

  return { projetar: projetar, regraDoMes: regraDoMes, valorDaRegra: valorDaRegra,
           parcelasDoMes: parcelasDoMes, mesN: mesN };
})();
/*</motor>*/

const TABELAS = ["fin_categories","fin_accounts","fin_rules","fin_plan",
                 "fin_entries","fin_balances","fin_months","fin_settings",
                 "fin_installments"];
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const CORES_GRUPO = {
  "Trabalho":"#5B9BFF","Investimentos":"#3DBE7D","Moradia":"#E0A33A","Carro":"#B98BE0",
  "Viagens":"#4FC3D9","Saúde & Casa":"#E88A5C","Vida":"#E0637B","Profissional":"#7A8CA8",
  "Outros":"#5C6E88",
};

const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const NUM = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = v => (v === null || v === undefined || isNaN(v)) ? "—" : BRL.format(v);
const fmtn = v => (v === null || v === undefined || isNaN(v)) ? "—" : NUM.format(v);
function fmtk(v){
  if (v === null || v === undefined || isNaN(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e6) return (v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi";
  if (a >= 1000) return Math.round(v/1000).toLocaleString("pt-BR")+"k";
  return Math.round(v).toLocaleString("pt-BR");
}
function fmtsin(v){ if (v===null||v===undefined) return "—"; return (v>=0?"+":"−")+fmtk(Math.abs(v)); }
const rotulo = c => MESES[+c.split("-")[1]-1] + "/" + c.split("-")[0].slice(2);
const rotuloLongo = c => MESES[+c.split("-")[1]-1] + " de " + c.split("-")[0];
function somaMes(c, n){
  let [a,m] = c.split("-").map(Number); m += n;
  while (m > 12){ m -= 12; a++; } while (m < 1){ m += 12; a--; }
  return a + "-" + String(m).padStart(2,"0") + "-01";
}
function compHoje(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01"; }
function hojeISO(){ const d = new Date(); return d.toISOString().slice(0,10); }
const esc = s => String(s===null||s===undefined?"":s).replace(/[&<>"']/g,
  m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function parseNum(t){
  if (t === null || t === undefined) return null;
  let s = String(t).trim().replace(/[R$\s]/g,"");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g,"").replace(",",".");
  const v = parseFloat(s);
  return isNaN(v) ? null : v;
}
let toastT = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600);
}

// AUTENTICACAO  --  sbFetch e o PONTO UNICO que assina as requisicoes
// ============================================================
let sessao = null;
try { sessao = JSON.parse(localStorage.getItem("fin_sess") || "null"); } catch(e){}

function guardarSessao(s){
  sessao = s;
  try { localStorage.setItem("fin_sess", JSON.stringify(s)); } catch(e){}
}
function limparSessao(){
  sessao = null;
  try { localStorage.removeItem("fin_sess"); } catch(e){}
}
function tokenAtual(){ return sessao && sessao.access_token; }

async function authFetch(caminho, corpo){
  const r = await fetch(SB_URL + "/auth/v1/" + caminho, {
    method:"POST", headers:{ "apikey":SB_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(corpo),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ("erro " + r.status));
  return j;
}

async function renovar(){
  if (!sessao || !sessao.refresh_token) return false;
  const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST", headers:{ "apikey":SB_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ refresh_token: sessao.refresh_token }),
  });
  if (r.ok){ guardarSessao(await r.json()); return true; }
  // 4xx = o servidor recusou o refresh -> a sessao morreu de verdade
  if (r.status >= 400 && r.status < 500){ limparSessao(); return false; }
  return false;  // 5xx: nao desloga, tenta de novo depois
}

// Ponto unico. Toda leitura/escrita do banco passa aqui.
async function sbFetch(caminho, opts, jaTentou){
  opts = opts || {};
  const h = Object.assign({
    "apikey": SB_KEY,
    "Authorization": "Bearer " + (tokenAtual() || SB_KEY),
    "Content-Type": "application/json",
  }, opts.headers || {});
  const r = await fetch(SB_URL + "/rest/v1/" + caminho, Object.assign({}, opts, { headers: h }));
  if (r.status === 401 && !jaTentou){
    if (await renovar()) return sbFetch(caminho, opts, true);
    throw new Error("sessão expirada");
  }
  if (!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error("HTTP " + r.status + (t ? " — " + t.slice(0,160) : ""));
  }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ============================================================
// ESTADO E CARREGAMENTO
// ============================================================
const estado = {
  uid:null, email:null,
  categorias:[], contas:[], regras:[], parcelas:[],
  plano:{}, meses:{}, balances:{}, entries:{}, settings:{},
  competencias:[],
};
let dadosTravados = true;   // bloqueia gravacao ate uma leitura bem-sucedida
let proj = [];              // saida do motor
let mesAtual = compHoje();

function chaveCache(){ return "fin_cache_" + (estado.uid || "anon"); }

function indexar(cats, conts, regras, plan, ents, bals, mss, sets, parc){
  estado.categorias = cats.slice().sort((a,b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome));
  estado.contas = conts.slice().sort((a,b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome));
  estado.regras = regras;
  estado.parcelas = parc || [];
  estado.plano = {}; estado.entries = {}; estado.balances = {}; estado.meses = {};
  for (const p of plan){
    (estado.plano[p.competencia] = estado.plano[p.competencia] || {})[p.category_id] = p;
  }
  for (const e of ents){ (estado.entries[e.competencia] = estado.entries[e.competencia] || []).push(e); }
  for (const b of bals){ (estado.balances[b.competencia] = estado.balances[b.competencia] || {})[b.account_id] = b; }
  for (const m of mss){ estado.meses[m.competencia] = m; }
  estado.settings = (sets && sets[0] && sets[0].data) || {};

  // horizonte: do primeiro mes com dado ate o maior entre 12/2028, hoje+12 e o que houver
  const chaves = Object.keys(estado.plano).concat(Object.keys(estado.meses)).sort();
  let ini = chaves[0] || somaMes(compHoje(), -1);
  let fim = chaves[chaves.length-1] || compHoje();
  const minFim = somaMes(compHoje(), 12);
  if (fim < minFim) fim = minFim;
  const extra = estado.settings.mesesExtra || 0;
  if (extra) fim = somaMes(fim, extra);
  const comps = [];
  for (let c = ini; c <= fim; c = somaMes(c, 1)) comps.push(c);
  estado.competencias = comps;
}

function dadosMotor(){
  const plano = {};
  for (const c in estado.plano){
    plano[c] = {};
    for (const k in estado.plano[c]) plano[c][k] = +estado.plano[c][k].valor;
  }
  const balances = {};
  for (const c in estado.balances){
    balances[c] = {};
    for (const k in estado.balances[c]){
      const conta = estado.contas.find(x => x.id === k);
      if (!conta || conta.considera_patrimonio) balances[c][k] = +estado.balances[c][k].saldo;
    }
    if (!Object.keys(balances[c]).length) delete balances[c];
  }
  return {
    categorias: estado.categorias, regras: estado.regras,
    plano: plano, meses: estado.meses, balances: balances,
    parcelas: estado.parcelas, competencias: estado.competencias,
  };
}

function reprojetar(){ proj = MOTOR.projetar(dadosMotor()); }
function mesProj(c){ return proj.find(m => m.competencia === c) || null; }

// realizado por categoria = soma dos lancamentos daquele mes
function realizadoCat(comp){
  const r = {};
  for (const e of (estado.entries[comp] || [])) r[e.category_id] = (r[e.category_id] || 0) + (+e.valor);
  return r;
}

async function carregarTudo(){
  const q = "?select=*";
  try {
    const [cats, conts, regras, plan, ents, bals, mss, sets, parc] = await Promise.all(
      TABELAS.map(t => sbFetch(t + q + (t==="fin_plan"||t==="fin_entries" ? "&limit=20000" : "")))
    );
    indexar(cats, conts, regras, plan, ents, bals, mss, sets, parc);
    dadosTravados = false;
    try { localStorage.setItem(chaveCache(), JSON.stringify({cats,conts,regras,plan,ents,bals,mss,sets,parc})); } catch(e){}
    return true;
  } catch (err){
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(chaveCache()) || "null"); } catch(e){}
    if (cache){
      indexar(cache.cats,cache.conts,cache.regras,cache.plan,cache.ents,cache.bals,cache.mss,cache.sets,cache.parc);
      dadosTravados = true;   // somente leitura ate uma leitura boa
      return "cache";
    }
    throw err;  // sem cache e sem rede: NAO abrir vazio por cima do real
  }
}

async function salvar(tabela, linhas, conflito){
  if (dadosTravados){ toast("Sem conexão — nada foi gravado"); return null; }
  const arr = Array.isArray(linhas) ? linhas : [linhas];
  for (const l of arr) l.user_id = estado.uid;
  const h = { "Prefer": "return=representation" + (conflito ? ",resolution=merge-duplicates" : "") };
  const url = tabela + (conflito ? "?on_conflict=" + conflito : "");
  try {
    return await sbFetch(url, { method:"POST", headers:h, body: JSON.stringify(arr) });
  } catch (err){
    try { return await sbFetch(url, { method:"POST", headers:h, body: JSON.stringify(arr) }); }
    catch (e2){ toast("Não gravou: " + e2.message); throw e2; }
  }
}
async function apagar(tabela, id){
  if (dadosTravados){ toast("Sem conexão — nada foi apagado"); return; }
  await sbFetch(tabela + "?id=eq." + id, { method:"DELETE" });
}

// GRAVACOES DE DOMINIO
// ============================================================
async function definirPlano(comp, catId, valor){
  const linha = { competencia: comp, category_id: catId, valor: valor, origem: "manual" };
  const r = await salvar("fin_plan", linha, "user_id,competencia,category_id");
  if (r && r[0]){ (estado.plano[comp] = estado.plano[comp] || {})[catId] = r[0]; }
  reprojetar();
}
async function limparPlano(comp, catId){
  const p = estado.plano[comp] && estado.plano[comp][catId];
  if (!p) return;
  await apagar("fin_plan", p.id);
  delete estado.plano[comp][catId];
  reprojetar();
}
async function definirMes(comp, campos){
  const linha = Object.assign({ competencia: comp }, campos);
  const r = await salvar("fin_months", linha, "user_id,competencia");
  if (r && r[0]) estado.meses[comp] = r[0];
  reprojetar();
}
async function definirSaldo(comp, contaId, saldo){
  const r = await salvar("fin_balances", { competencia: comp, account_id: contaId, saldo: saldo },
                          "user_id,competencia,account_id");
  if (r && r[0]) (estado.balances[comp] = estado.balances[comp] || {})[contaId] = r[0];
  reprojetar();
}

// ---------- RESUMO ----------
function renderResumo(){
  const el = document.getElementById("s-resumo");
  if (!estado.categorias.length){ el.innerHTML = avisoTravado() + vazioInicial(); return; }

  const fechados = proj.filter(m => !m.aberto);
  const ult = fechados[fechados.length - 1];
  const fim = proj[proj.length - 1];

  let hero;
  if (ult){
    const d = ult.diferenca, cls = d >= 0 ? "pos" : "neg";
    hero =
      '<div class="hero">' +
        '<div class="v"><span class="cur">R$</span>' + esc(fmtn(ult.realizado)) + '</div>' +
        '<div class="cap">patrimônio em ' + rotuloLongo(ult.competencia) + '</div>' +

  }

    '<div class="tot" style="margin-top:22px">' +
      (leitura ? "" : '<div><span class="dim">Projeção para ' + (fim ? rotuloLongo(fim.competencia) : "—") + '</span>' +
        '<span class="num">' + esc(fmt(fim ? fim.previsao : 0)) + '</span></div>') +
      '<div><span class="dim">Meses fechados</span><span class="num">' + fechados.length + ' de ' + proj.length + '</span></div>' +
      compromissosResumo() +
    '</div>';

  el.innerHTML = avisoTravado() + hero + leitura + meta +
    '<div class="sec-h"><h2>Mês a mês</h2><span class="legenda tiny">' +
      '<i class="sw-prev"></i>plano<i class="sw-real"></i>realizado</span></div>' +
    '<div class="regua">' + regua() + '</div>';
}

// Sobra mensal alem do plano: quanto o mes rendeu a MAIS do que o previsto,
// descontando o que ja vinha acumulado. Onde ha ancora o acumulado zera, entao
// a sobra do mes e a propria diferenca.
function sobrasMensais(){
  const out = [];
  for (let i = 1; i < proj.length; i++){
    const m = proj[i], ant = proj[i-1];
    if (m.aberto || ant.aberto) continue;
    const info = estado.meses[m.competencia] || {};
    const ancorado = info.saldo_inicial_override !== null && info.saldo_inicial_override !== undefined;
    out.push(ancorado ? m.diferenca : m.diferenca - ant.diferenca);
  }
  return out;
}

function leituraDoVies(){
  const s = sobrasMensais();
  if (s.length < 3) return "";
  const media = s.reduce((a,b) => a+b, 0) / s.length;
  const dp = Math.sqrt(s.reduce((a,b) => a + Math.pow(b - media, 2), 0) / s.length);
  const acima = s.filter(x => x > 0).length;
  const fim = proj[proj.length-1];
  const restantes = proj.filter(m => m.aberto).length;
  const ajustada = fim.previsao + media * restantes;
  const bom = media >= 0;
  return '<div class="leitura' + (bom ? "" : " fria") + '">' +
    'Você fechou acima do plano em <b>' + acima + ' dos ' + s.length +
    ' meses</b> comparáveis, sobrando <b>' + fmt(media) + ' por mês</b> em média ' +
    '(oscilando ' + fmt(dp) + ' para mais ou para menos).<br>' +
    'No mesmo ritmo, ' + rotuloLongo(fim.competencia) + ' fecha perto de <b>' + fmt(ajustada) +
    '</b>, não os ' + fmt(fim.previsao) + ' do plano puro.' +
    '</div>';
}

function compromissosResumo(){
  if (!estado.parcelas.length) return "";
  const hoje = compHoje();
  let restante = 0, ativos = 0, ultimo = "";
  for (const p of estado.parcelas){
    if (p.ativo === false) continue;
    const ini = MOTOR.mesN(p.inicio), fimN = ini + (+p.parcelas) - 1, agora = MOTOR.mesN(hoje);
    if (fimN < agora) continue;
    ativos++;
    restante += (fimN - Math.max(ini, agora) + 1) * (+p.valor);
    const fimComp = somaMes(p.inicio, (+p.parcelas) - 1);
    if (fimComp > ultimo) ultimo = fimComp;
  }
  if (!ativos) return "";
  return '<div><span class="dim">' + ativos + ' compromisso' + (ativos>1?"s":"") +
    ' até ' + rotulo(ultimo) + '</span><span class="num abr">' + esc(fmt(restante)) + '</span></div>';
}

function regua(){
  if (!proj.length) return "";
  const vals = proj.flatMap(m => [m.previsao, m.realizado].filter(v => v !== null && v !== undefined));
  // escala do MENOR ao MAIOR valor real: com um piso arbitrario abaixo do
  // minimo, 48 meses de patrimonio parecido viram 48 barrinhas iguais e a
  // trajetoria -- que e o ponto da tela -- some.
  const max = Math.max.apply(null, vals);
  const min = Math.min.apply(null, vals);
  const larg = v => Math.max(3, ((v - min) / ((max - min) || 1)) * 95 + 4);
  const hoje = compHoje();
  let out = "", anoAtual = "";
  for (const m of proj){
    const ano = m.competencia.slice(0,4);
    if (ano !== anoAtual){ anoAtual = ano; out += '<div class="ano">' + ano + '</div>'; }
    const d = m.diferenca;
    const dcls = d === null ? "abr" : (d >= 0 ? "pos" : "neg");
    const dtxt = d === null ? "" : fmtsin(d);
    out +=
      '<div class="mrow' + (m.competencia === hoje ? " hoje" : "") + '" data-comp="' + m.competencia + '">' +
        '<span class="mn">' + MESES[+m.competencia.split("-")[1]-1] + '</span>' +
        '<span class="bars">' +
          '<i class="b-prev" style="width:' + larg(m.previsao).toFixed(2) + '%"></i>' +
          (m.aberto ? "" : '<i class="b-real" style="width:' + larg(m.realizado).toFixed(2) + '%"></i>') +
        '</span>' +
        '<span class="vv num">' + esc(fmtk(m.aberto ? m.previsao : m.realizado)) + '</span>' +
        '<span class="dd num ' + dcls + '">' + esc(dtxt) + '</span>' +
      '</div>';
  }
  return out;
}

function vazioInicial(){
  return '<div class="vazio">Nada por aqui ainda.<br>Cadastre suas categorias e contas em <b>Ajustes</b>,<br>ou peça a importação da planilha.</div>';
}

  if (!m){ el.innerHTML = avisoTravado() + '<div class="vazio">Mês fora do horizonte do plano.</div>'; return; }

  const info = estado.meses[mesAtual] || {};
  let out = avisoTravado() +
    '<div class="mnav">' +
      '<button id="m-ant" aria-label="Mês anterior">‹</button>' +

    for (const c of cats){

        out += '<div class="grupo"><span class="dot" style="background:' + (CORES_GRUPO[grupo]||"#5C6E88") + '"></span>' + esc(grupo) + '</div>';
      }
      const congelado = !!(estado.plano[mesAtual] && estado.plano[mesAtual][c.id]);
      const calc = c.calculo !== "manual" && !congelado;
      const v = m.previsto[c.id];
      const rv = real[c.id];
      const n = (estado.entries[mesAtual] || []).filter(e => e.category_id === c.id).length;
      out +=
        '<div class="lrow">' +
          '<button class="nm abre-lanc" data-cat="' + c.id + '">' + esc(c.nome) +
            (calc ? ' <span class="tiny dim2" title="calculado por regra">ƒ</span>' : "") + '</button>' +
          '<span class="rl">' + (rv !== undefined ? '<b>' + esc(fmtn(rv)) + '</b>' + (n>1 ? ' <span class="dim2">' + n + '×</span>' : "") : "") + '</span>' +
          '<input class="cel' + (calc ? " calc" : "") + (v ? "" : " zero") + ' p-cel" data-cat="' + c.id +
            '" value="' + esc(fmtn(v)) + '" inputmode="decimal" aria-label="Previsto de ' + esc(c.nome) + '">' +
          (m.parcelas[c.id] || []).map(x =>
            '<span class="parc" title="' + esc(x.obs || "") + '">↳ <span class="pnm">' +
            esc(x.descricao || x.obs || "compromisso") + '</span> <em>' + x.n + '/' + x.total + '</em>' +
            '<span class="dim2">' + esc(fmtn(x.valor)) + '</span></span>').join("") +
        '</div>';
    }
  }

  const d = m.diferenca;
  out +=
    '<div class="tot">' +
      '<div><span class="dim">Saldo inicial</span><span class="num">' + esc(fmt(m.saldoInicial)) + '</span></div>' +
      '<div><span class="dim">Receitas</span><span class="num pos">' + esc(fmt(m.receitas)) + '</span></div>' +
      '<div><span class="dim">Saídas</span><span class="num neg">' + esc(fmt(m.saidas)) + '</span></div>' +
      '<div class="grande"><span>Previsão</span><span class="num">' + esc(fmt(m.previsao)) + '</span></div>' +
      '<div><span class="dim">Realizado</span><span class="num">' + (m.aberto ? '<span class="abr">Aberto</span>' : esc(fmt(m.realizado))) + '</span></div>' +
      (m.aberto ? "" : '<div><span class="dim">Diferença</span><span class="num ' + (d>=0?"pos":"neg") + '">' + esc(fmtsin(d)) + '</span></div>') +
    '</div>' +
    (info.obs ? '<div class="leitura fria" style="margin-top:16px">' + esc(info.obs) + '</div>' : "") +
    '<div class="acoes">' +
      '<button class="btn mini" id="m-compromisso">Novo compromisso</button>' +

      '<button class="btn mini ghost" id="m-nota">' + (info.obs ? "Editar nota" : "Anotar o mês") + '</button>' +
      '<button class="btn mini ghost" id="m-lancs">Lançamentos</button>' +
    '</div>';

  document.getElementById("m-ant").onclick = () => { mesAtual = somaMes(mesAtual,-1); render(); };
  document.getElementById("m-prox").onclick = () => { mesAtual = somaMes(mesAtual, 1); render(); };

// tocar no nome da categoria abre o que da para fazer com ela naquele mes
function folhaCategoriaMes(catId){
  const c = estado.categorias.find(x => x.id === catId);
  const m = mesProj(mesAtual);
  const n = (estado.entries[mesAtual] || []).filter(e => e.category_id === catId).length;

async function repetirAdiante(inp){
  const v = parseNum(inp.value);
  if (v === null) return;
  await definirPlano(mesAtual, inp.dataset.cat, v);
  await repetirValor(inp.dataset.cat, v);
}

async function repetirValor(catId, valor){
  const daqui = estado.competencias.filter(c => c > mesAtual);
  if (!daqui.length){ toast("Não há meses à frente"); return; }
  const cat = estado.categorias.find(c => c.id === catId);
  const linhas = daqui.map(c => ({ competencia: c, category_id: catId, valor: valor, origem: "manual" }));
  const r = await salvar("fin_plan", linhas, "user_id,competencia,category_id");
  if (r) for (const l of r) (estado.plano[l.competencia] = estado.plano[l.competencia] || {})[catId] = l;
  reprojetar(); render();
  toast(cat.nome + " = " + fmtn(valor) + " em " + daqui.length + " meses");
}

async function aplicarCelula(inp){
  const catId = inp.dataset.cat;
  const m = mesProj(mesAtual);
  const antes = m.previsto[catId];
  const v = parseNum(inp.value);
  if (v === null || Math.abs(v - antes) < 0.005){ inp.value = fmtn(antes); return; }
  const cat = estado.categorias.find(c => c.id === catId);
  try {
    await definirPlano(mesAtual, catId, v);
    if (cat && cat.calculo !== "manual") toast(cat.nome + " congelado em " + rotulo(mesAtual));
    render();
  } catch (e){ inp.value = fmtn(antes); }
}

async function acaoAncora(info){
  if (info.saldo_inicial_override != null){
    await definirMes(mesAtual, { saldo_inicial_override: null });
    toast("Âncora removida"); render(); return;

  const ant = mesProj(somaMes(mesAtual,-1));

    '<div class="tot" style="margin-top:0">' +
      '<div><span class="dim">Hoje (previsão anterior)</span><span class="num">' + esc(fmt(m.saldoInicial)) + '</span></div>' +
      '<div><span class="dim">Passa a ser</span><span class="num pos">' + esc(fmt(ant.realizado)) + '</span></div>' +

      document.getElementById("ok").onclick = async () => {

      };

// ---------- LANCAMENTOS ----------
function folhaLancamentos(catId){
  const lista = (estado.entries[mesAtual] || []).filter(e => !catId || e.category_id === catId)
    .sort((a,b) => (a.data < b.data ? 1 : -1));
  const cat = catId && estado.categorias.find(c => c.id === catId);
  const total = lista.reduce((a,e) => a + (+e.valor), 0);
  let h = "<h3>" + (cat ? esc(cat.nome) : "Lançamentos") + "</h3>" +
    '<div class="sub">' + rotuloLongo(mesAtual) + (lista.length ? " — " + lista.length + " lançamento" + (lista.length>1?"s":"") + ", " + fmt(total) : "") + '</div>';
  if (!lista.length){
    h += '<div class="vazio">Nenhum lançamento neste mês.<br>Registre o primeiro abaixo.</div>';
  } else {
    for (const e of lista){
      const c = estado.categorias.find(x => x.id === e.category_id);
      h += '<div class="row"><span class="nm">' + esc(e.descricao || (c ? c.nome : "—")) +
        '<br><span class="tiny dim2">' + esc(e.data.split("-").reverse().join("/")) +
        (cat ? "" : " · " + esc(c ? c.nome : "")) + '</span></span>' +
        '<span class="vl num">' + esc(fmtn(e.valor)) + '</span>' +
        '<button class="btn mini ghost del" data-id="' + e.id + '">✕</button></div>';
    }
  }
  h += '<div class="acoes"><button class="btn pri" id="novo">Novo lançamento</button>' +
       '<button class="btn ghost" id="fechar">Fechar</button></div>';
  abrirFolha(h, () => {
    document.getElementById("fechar").onclick = fecharFolha;
    document.getElementById("novo").onclick = () => folhaNovoLancamento(catId);
    document.querySelectorAll(".del").forEach(b => b.onclick = async () => {
      await apagar("fin_entries", b.dataset.id);
      estado.entries[mesAtual] = (estado.entries[mesAtual]||[]).filter(x => x.id !== b.dataset.id);
      folhaLancamentos(catId); render();
    });
  });
}

function folhaCompromisso(comp, catSugerida){
  const p = comp || { inicio: mesAtual, parcelas: 12, category_id: catSugerida };
  const cats = estado.categorias.filter(c => c.ativo !== false).map(c =>
    '<option value="' + c.id + '"' + (c.id === p.category_id ? " selected" : "") + '>' +
    esc(c.nome) + (c.tipo === "receita" ? " (receita)" : "") + '</option>').join("");
  abrirFolha(
    "<h3>" + (comp ? "Editar compromisso" : "Novo compromisso") + "</h3>" +
    "<div class='sub'>Uma parcela que se repete por um número de meses e some sozinha no fim. " +
    "Ela <b>soma</b> ao que já está previsto na categoria.</div>" +
    '<label class="f">O que é<input id="cp-desc" value="' + esc(p.descricao||"") +
      '" placeholder="Ex.: Sofá da sala 10x"></label>' +
    '<div class="f2"><label class="f">Valor da parcela<input id="cp-valor" inputmode="decimal" value="' +
      (p.valor != null ? fmtn(p.valor) : "") + '" placeholder="0,00"></label>' +
    '<label class="f">Nº de parcelas<input id="cp-n" inputmode="numeric" value="' + (p.parcelas||12) + '"></label></div>' +
    '<label class="f">Categoria<select id="cp-cat">' + cats + '</select></label>' +
    '<label class="f">Primeira parcela<input id="cp-ini" type="month" value="' + (p.inicio||mesAtual).slice(0,7) + '"></label>' +
    '<label class="f">Observação<input id="cp-obs" value="' + esc(p.obs||"") +
      '" placeholder="Para lembrar daqui a um ano por que isso existe"></label>' +
    '<div id="cp-previa" class="leitura fria" style="margin-top:16px"></div>' +
    '<div class="acoes"><button class="btn pri" id="ok">' + (comp ? "Salvar" : "Criar compromisso") + '</button>' +
    (comp ? '<button class="btn ghost" id="rm">Excluir</button>' : "") +
    '<button class="btn ghost" id="cancel">Cancelar</button></div>',
    () => {
      const previa = () => {
        const v = parseNum(document.getElementById("cp-valor").value) || 0;
        const n = parseNum(document.getElementById("cp-n").value) || 0;
        const ini = (document.getElementById("cp-ini").value || mesAtual.slice(0,7)) + "-01";
        const el = document.getElementById("cp-previa");
        if (!v || !n){ el.innerHTML = "Preencha valor e número de parcelas."; return; }
        el.innerHTML = '<b>' + fmtn(v) + '</b> por mês de <b>' + rotulo(ini) + '</b> a <b>' +
          rotulo(somaMes(ini, n-1)) + '</b> — total de <b>' + fmt(v*n) + '</b>.';
      };
      ["cp-valor","cp-n","cp-ini"].forEach(id => document.getElementById(id).addEventListener("input", previa));
      previa();
      document.getElementById("cancel").onclick = fecharFolha;
      const rm = document.getElementById("rm");
      if (rm) rm.onclick = async () => {
        await apagar("fin_installments", comp.id);
        estado.parcelas = estado.parcelas.filter(x => x.id !== comp.id);
        fecharFolha(); reprojetar(); render(); toast("Compromisso excluído");
      };
      document.getElementById("ok").onclick = async () => {
        const linha = {
          descricao: document.getElementById("cp-desc").value.trim(),
          valor: parseNum(document.getElementById("cp-valor").value),
          parcelas: Math.round(parseNum(document.getElementById("cp-n").value) || 0),
          category_id: document.getElementById("cp-cat").value,
          inicio: (document.getElementById("cp-ini").value || mesAtual.slice(0,7)) + "-01",
          obs: document.getElementById("cp-obs").value || null,
          ativo: true,
        };
        if (!linha.descricao){ toast("Diga o que é o compromisso"); return; }
        if (!linha.valor || linha.valor <= 0){ toast("Informe o valor da parcela"); return; }
        if (!linha.parcelas || linha.parcelas < 1){ toast("Informe quantas parcelas"); return; }
        if (!linha.obs) linha.obs = linha.descricao;
        if (comp){
          await sbFetch("fin_installments?id=eq." + comp.id, { method:"PATCH", body: JSON.stringify(linha) });
          Object.assign(comp, linha);
        } else {
          const r = await salvar("fin_installments", linha);
          if (r && r[0]) estado.parcelas.push(r[0]);
        }
        fecharFolha(); reprojetar(); render();
        toast(linha.parcelas + "× " + fmtn(linha.valor) + " lançadas");
      };
    });
}

function listaCompromissos(){
  if (!estado.parcelas.length)
    return '<div class="vazio">Nenhum compromisso.<br>Use para financiamento, parcela de viagem, curso — o app tira sozinho quando acabar.</div>';
  const hoje = compHoje();
  return estado.parcelas.slice()
    .sort((a,b) => a.inicio.localeCompare(b.inicio))
    .map(p => {
      const fimC = somaMes(p.inicio, (+p.parcelas) - 1);
      const c = estado.categorias.find(x => x.id === p.category_id);
      const pagas = Math.min(+p.parcelas, Math.max(0, MOTOR.mesN(hoje) - MOTOR.mesN(p.inicio) + 1));
      const acabou = fimC < hoje;
      return '<div class="row"><span class="nm">' + esc(p.descricao) +
        '<br><span class="tiny dim2">' + esc(c ? c.nome : "?") + ' · ' + fmtn(p.valor) + ' × ' + p.parcelas +
        ' · ' + rotulo(p.inicio) + '–' + rotulo(fimC) +
        (acabou ? ' · <span class="dim2">encerrado</span>' : ' · <span class="abr">' + pagas + '/' + p.parcelas + '</span>') +
        '</span></span>' +
        '<span class="vl small dim">' + fmtk((+p.valor) * ((+p.parcelas) - pagas)) + '</span>' +
        '<button class="btn mini ghost ed-comp" data-id="' + p.id + '">editar</button></div>';
    }).join("");
}

// ---------- PATRIMONIO ----------
function renderPatrimonio(){
  const el = document.getElementById("s-patrimonio");
  const m = mesProj(mesAtual);
  const sal = estado.balances[mesAtual] || {};
  let out = avisoTravado() +
    '<div class="mnav">' +
      '<button id="p-ant" aria-label="Mês anterior">‹</button>' +
      '<span class="lbl">' + rotuloLongo(mesAtual) + '</span>' +
      '<button id="p-prox" aria-label="Próximo mês">›</button>' +
    '</div>';

  if (!estado.contas.length){
    out += '<div class="vazio">Nenhuma conta cadastrada.<br>Cadastre suas contas e investimentos para o app somar o patrimônio sozinho.</div>' +
           '<div class="acoes"><button class="btn pri" id="nova-conta">Cadastrar conta</button></div>';
    el.innerHTML = out;
    document.getElementById("p-ant").onclick = () => { mesAtual = somaMes(mesAtual,-1); render(); };
    document.getElementById("p-prox").onclick = () => { mesAtual = somaMes(mesAtual,1); render(); };
    document.getElementById("nova-conta").onclick = () => folhaConta(null);
    return;
  }

  const total = Object.keys(sal).reduce((a,k) => {
    const c = estado.contas.find(x => x.id === k);
    return a + ((!c || c.considera_patrimonio) ? +sal[k].saldo : 0);
  }, 0);

  out += '<div class="sec-h"><h2>Saldo por conta</h2><span class="tiny dim2">no fim do mês</span></div>';
  for (const c of estado.contas.filter(c => c.ativo !== false)){
    const b = sal[c.id];
    const pct = total > 0 && b ? ((+b.saldo)/total*100) : 0;
    out += '<div class="row">' +
      '<span class="nm">' + esc(c.nome) +
        (c.instituicao ? '<br><span class="tiny dim2">' + esc(c.instituicao) + '</span>' : "") +
        (c.considera_patrimonio ? "" : '<br><span class="tiny dim2">fora do patrimônio</span>') + '</span>' +
      (pct ? '<span class="vl tiny dim2">' + pct.toFixed(0) + '%</span>' : "") +
      '<input class="cel s-cel" data-conta="' + c.id + '" value="' + esc(b ? fmtn(b.saldo) : "") + '" placeholder="—" inputmode="decimal">' +
      '</div>';
  }

  out += '<div class="tot">' +
    '<div class="grande"><span>Patrimônio</span><span class="num">' + esc(total ? fmt(total) : "—") + '</span></div>';
  if (m && !m.aberto){
    out += '<div><span class="dim">Previsão do mês</span><span class="num">' + esc(fmt(m.previsao)) + '</span></div>' +
           '<div><span class="dim">Diferença</span><span class="num ' + (m.diferenca>=0?"pos":"neg") + '">' + esc(fmtsin(m.diferenca)) + '</span></div>';
  } else if (m){
    out += '<div><span class="dim">Previsão do mês</span><span class="num">' + esc(fmt(m.previsao)) + '</span></div>' +
           '<div><span class="dim">Situação</span><span class="abr">Aberto</span></div>';
  }
  out += '</div>';

  // evolucao do patrimonio realizado
  const hist = proj.filter(x => !x.aberto);
  if (hist.length > 1){
    out += '<div class="sec-h"><h2>Evolução</h2><span class="tiny dim2">' + hist.length + ' meses fechados</span></div>' +
           grafLinha(hist);
  }
  out += '<div class="acoes"><button class="btn" id="nova-conta">Nova conta</button>' +
         '<button class="btn ghost" id="ed-contas">Editar contas</button></div>';

  el.innerHTML = out;
  document.getElementById("p-ant").onclick = () => { mesAtual = somaMes(mesAtual,-1); render(); };
  document.getElementById("p-prox").onclick = () => { mesAtual = somaMes(mesAtual,1); render(); };
  document.getElementById("nova-conta").onclick = () => folhaConta(null);
  document.getElementById("ed-contas").onclick = () => { irPara("ajustes"); };
  el.querySelectorAll(".s-cel").forEach(inp => {
    inp.addEventListener("focus", () => inp.select());
    inp.addEventListener("blur", async () => {
      const v = parseNum(inp.value);
      if (v === null) return;
      await definirSaldo(mesAtual, inp.dataset.conta, v);
      render();
    });
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") inp.blur(); });
  });
}

// grafico de linha simples: viewBox derivado da largura medida (nunca fixo)
function grafLinha(pontos){
  const W = 600, H = 150, P = 6;
  const vs = pontos.map(p => p.realizado);
  const mx = Math.max.apply(null, vs), mn = Math.min.apply(null, vs);
  const rng = (mx - mn) || 1;
  const x = i => P + (i / Math.max(1, pontos.length - 1)) * (W - 2*P);
  const y = v => H - P - ((v - mn) / rng) * (H - 2*P);
  const d = pontos.map((p,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.realizado).toFixed(1)).join(" ");
  const area = d + " L" + x(pontos.length-1).toFixed(1) + " " + H + " L" + x(0).toFixed(1) + " " + H + " Z";
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
    'style="width:100%;height:150px;display:block;margin-top:6px" role="img" ' +
    'aria-label="Evolução do patrimônio realizado">' +
    '<path d="' + area + '" fill="rgba(91,155,255,.10)"/>' +
    '<path d="' + d + '" fill="none" stroke="#5B9BFF" stroke-width="2" ' +
    'vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>' +
    '<div class="row" style="border:0;padding-top:6px"><span class="nm tiny dim2">' +
    rotulo(pontos[0].competencia) + '</span><span class="tiny dim2">' +
    rotulo(pontos[pontos.length-1].competencia) + '</span></div>';
}

    "<h3>" + (conta ? "Editar conta" : "Nova conta") + "</h3>" +
    "<div class='sub'>Contas entram na soma do patrimônio de cada mês.</div>" +
    '<label class="f">Nome<input id="c-nome" value="' + esc(c.nome||"") + '" placeholder="Ex.: CDB Itaú"></label>' +
    '<div class="f2"><label class="f">Tipo<select id="c-tipo">' +
      ["corrente","investimento","fgts","cartao","outro"].map(t =>
        '<option value="'+t+'"'+(c.tipo===t?" selected":"")+'>'+
        ({corrente:"Conta corrente",investimento:"Investimento",fgts:"FGTS",cartao:"Cartão",outro:"Outro"})[t]+'</option>').join("") +
    '</select></label>' +
    '<label class="f">Instituição<input id="c-inst" value="' + esc(c.instituicao||"") + '" placeholder="opcional"></label></div>' +
    '<label class="f" style="display:flex;align-items:center;gap:9px;margin-top:16px">' +
      '<input type="checkbox" id="c-pat" style="width:auto;margin:0"' + (c.considera_patrimonio === false ? "" : " checked") + '>' +
      ' Somar no patrimônio</label>' +
    '<div class="acoes"><button class="btn pri" id="ok">' + (conta ? "Salvar" : "Cadastrar conta") + '</button>' +
    (conta ? '<button class="btn ghost neg" id="rm">Excluir</button>' : "") +
    '<button class="btn ghost" id="cancel">Cancelar</button></div>',
    () => {
      document.getElementById("cancel").onclick = fecharFolha;
      const rm = document.getElementById("rm");
      if (rm) rm.onclick = async () => {
        await apagar("fin_accounts", conta.id);
        estado.contas = estado.contas.filter(x => x.id !== conta.id);
        fecharFolha(); render(); toast("Conta excluída");
      };
      document.getElementById("ok").onclick = async () => {
        const nome = document.getElementById("c-nome").value.trim();
        if (!nome){ toast("Dê um nome à conta"); return; }
        const linha = {
          nome: nome, tipo: document.getElementById("c-tipo").value,
          instituicao: document.getElementById("c-inst").value || null,
          considera_patrimonio: document.getElementById("c-pat").checked,
          ordem: conta ? conta.ordem : estado.contas.length + 1,
        };
        if (conta){
          await sbFetch("fin_accounts?id=eq." + conta.id, { method:"PATCH", body: JSON.stringify(linha) });
          Object.assign(conta, linha);
        } else {
          const r = await salvar("fin_accounts", linha, "user_id,nome");
          if (r && r[0]) estado.contas.push(r[0]);
        }
        fecharFolha(); render(); toast(conta ? "Conta salva" : "Conta cadastrada");
      };
    });
}

// ---------- PLANO ----------
function renderPlano(){
  const el = document.getElementById("s-plano");
  if (!estado.categorias.length){ el.innerHTML = avisoTravado() + vazioInicial(); return; }
  const cats = estado.categorias.filter(c => c.ativo !== false);

  let h = '<table class="plano"><thead><tr><th>Mês</th>' +
    cats.map(c => '<th>' + esc(c.nome) + '</th>').join("") +
    '<th>Previsão</th><th>Realizado</th></tr></thead><tbody>';
  let ano = "";
  for (const m of proj){
    const a = m.competencia.slice(0,4);
    if (a !== ano){ ano = a; h += '<tr class="sep"><td colspan="' + (cats.length+3) + '">' + a + '</td></tr>'; }
    h += '<tr><td>' + rotulo(m.competencia) + '</td>' +
      cats.map(c => { const v = m.previsto[c.id];
        return '<td class="' + (v ? "" : "z") + '">' + (v ? fmtn(v) : "·") + '</td>'; }).join("") +
      '<td><b>' + fmtn(m.previsao) + '</b></td>' +
      '<td class="' + (m.aberto ? "abr" : "") + '">' + (m.aberto ? "Aberto" : fmtn(m.realizado)) + '</td></tr>';
  }
  h += '</tbody></table>';

  el.innerHTML = avisoTravado() +
    '<div class="sec-h"><h2>Plano completo</h2><span class="tiny dim2">' + proj.length + ' meses × ' + cats.length + ' categorias</span></div>' +
    '<div class="tabwrap">' + h + '</div>' +
    '<div class="sec-h"><h2>Compromissos parcelados</h2><span class="tiny dim2">somam por cima do plano</span></div>' +
    listaCompromissos() +
    '<div class="acoes"><button class="btn" id="novo-comp">Novo compromisso</button></div>' +
    '<div class="sec-h"><h2>Regras</h2><span class="tiny dim2">preenchem os meses sem valor</span></div>' +
    listaRegras() +
    '<div class="acoes"><button class="btn" id="nova-regra">Nova regra</button>' +
    '<button class="btn ghost" id="mais12">Estender 12 meses</button></div>';

  document.getElementById("novo-comp").onclick = () => folhaCompromisso(null);
  el.querySelectorAll(".ed-comp").forEach(b =>
    b.onclick = () => folhaCompromisso(estado.parcelas.find(p => p.id === b.dataset.id)));
  document.getElementById("nova-regra").onclick = () => folhaRegra(null);
  document.getElementById("mais12").onclick = async () => {
    estado.settings.mesesExtra = (estado.settings.mesesExtra || 0) + 12;
    await salvar("fin_settings", { data: estado.settings }, "user_id");
    indexarHorizonte(); reprojetar(); render(); toast("Horizonte estendido");
  };
  el.querySelectorAll(".ed-regra").forEach(b =>
    b.onclick = () => folhaRegra(estado.regras.find(r => r.id === b.dataset.id)));
}
function indexarHorizonte(){
  const extra = estado.settings.mesesExtra || 0;
  const chaves = Object.keys(estado.plano).concat(Object.keys(estado.meses)).sort();
  let ini = chaves[0] || somaMes(compHoje(),-1);
  let fim = chaves[chaves.length-1] || compHoje();
  const minFim = somaMes(compHoje(), 12);
  if (fim < minFim) fim = minFim;
  if (extra) fim = somaMes(fim, extra);
  const comps = [];
  for (let c = ini; c <= fim; c = somaMes(c,1)) comps.push(c);
  estado.competencias = comps;
}

const TIPO_REGRA = { fixo:"valor fixo", pct_saldo:"% do saldo inicial",
                     crescimento:"cresce ao mês", anual:"uma vez por ano" };
function descRegra(r){
  const c = estado.categorias.find(x => x.id === r.category_id);
  let d;
  if (r.tipo === "pct_saldo") d = (r.percentual*100).toFixed(2).replace(".",",") + "% do saldo inicial";
  else if (r.tipo === "crescimento") d = fmt(r.valor) + " crescendo " + (r.percentual*100).toFixed(2).replace(".",",") + "%/mês";
  else if (r.tipo === "anual") d = fmt(r.valor) + " em " + MESES[(r.mes||1)-1];
  else d = fmt(r.valor) + (r.reajuste_pct ? " (+" + (r.reajuste_pct*100).toFixed(0) + "% em " + MESES[(r.reajuste_mes||1)-1] + ")" : "");
  return (c ? c.nome : "?") + " · " + d;
}
function listaRegras(){
  if (!estado.regras.length) return '<div class="vazio">Nenhuma regra ainda.<br>Regras preenchem sozinhas os meses em que você não digitou nada.</div>';
  return estado.regras.slice()
    .sort((a,b) => a.inicio.localeCompare(b.inicio))
    .map(r => '<div class="row"><span class="nm">' + esc(descRegra(r)) +
      '<br><span class="tiny dim2">' + rotulo(r.inicio) + ' → ' + (r.fim ? rotulo(r.fim) : "sem fim") + '</span></span>' +
      '<button class="btn mini ghost ed-regra" data-id="' + r.id + '">editar</button></div>').join("");
}

function folhaRegra(regra){
  const r = regra || { tipo:"fixo", inicio: mesAtual };
  const cats = estado.categorias.map(c =>
    '<option value="' + c.id + '"' + (c.id === r.category_id ? " selected" : "") + '>' + esc(c.nome) + '</option>').join("");
  const tipos = Object.keys(TIPO_REGRA).map(t =>
    '<option value="' + t + '"' + (t === r.tipo ? " selected" : "") + '>' + TIPO_REGRA[t] + '</option>').join("");
  abrirFolha(
    "<h3>" + (regra ? "Editar regra" : "Nova regra") + "</h3>" +
    "<div class='sub'>A regra vale só nos meses em que você não definiu um valor à mão.</div>" +
    '<label class="f">Categoria<select id="r-cat">' + cats + '</select></label>' +
    '<label class="f">Tipo<select id="r-tipo">' + tipos + '</select></label>' +
    '<div class="f2"><label class="f">Valor<input id="r-valor" inputmode="decimal" value="' + (r.valor != null ? fmtn(r.valor) : "") + '"></label>' +
    '<label class="f">Percentual (%)<input id="r-pct" inputmode="decimal" value="' + (r.percentual != null ? String(r.percentual*100).replace(".",",") : "") + '"></label></div>' +
    '<div class="f2"><label class="f">Início<input id="r-ini" type="month" value="' + (r.inicio||mesAtual).slice(0,7) + '"></label>' +
    '<label class="f">Fim<input id="r-fim" type="month" value="' + (r.fim ? r.fim.slice(0,7) : "") + '"></label></div>' +
    '<label class="f">Mês (só para "uma vez por ano")<input id="r-mes" inputmode="numeric" value="' + (r.mes||"") + '" placeholder="1 a 12"></label>' +
    '<div class="acoes"><button class="btn pri" id="ok">Salvar regra</button>' +
    (regra ? '<button class="btn ghost" id="rm">Excluir</button>' : "") +
    '<button class="btn ghost" id="cancel">Cancelar</button></div>',
    () => {
      document.getElementById("cancel").onclick = fecharFolha;
      const rm = document.getElementById("rm");
      if (rm) rm.onclick = async () => {
        await apagar("fin_rules", regra.id);
        estado.regras = estado.regras.filter(x => x.id !== regra.id);
        fecharFolha(); reprojetar(); render(); toast("Regra excluída");
      };
      document.getElementById("ok").onclick = async () => {
        const tipo = document.getElementById("r-tipo").value;
        const pct = parseNum(document.getElementById("r-pct").value);
        const linha = {
          category_id: document.getElementById("r-cat").value, tipo: tipo,
          valor: parseNum(document.getElementById("r-valor").value),
          percentual: pct === null ? null : pct/100,
          mes: tipo === "anual" ? (parseNum(document.getElementById("r-mes").value) || 1) : null,
          inicio: (document.getElementById("r-ini").value || mesAtual.slice(0,7)) + "-01",
          fim: document.getElementById("r-fim").value ? document.getElementById("r-fim").value + "-01" : null,
          ativo: true,
        };
        if ((tipo === "pct_saldo" || tipo === "crescimento") && linha.percentual === null){ toast("Informe o percentual"); return; }
        if (tipo !== "pct_saldo" && linha.valor === null){ toast("Informe o valor"); return; }
        if (regra){
          await sbFetch("fin_rules?id=eq." + regra.id, { method:"PATCH", body: JSON.stringify(linha) });
          Object.assign(regra, linha);
        } else {
          const res = await salvar("fin_rules", linha);
          if (res && res[0]) estado.regras.push(res[0]);
        }
        fecharFolha(); reprojetar(); render(); toast("Regra salva");
      };
    });
}

// ---------- AJUSTES ----------
function renderAjustes(){
  const el = document.getElementById("s-ajustes");
  let h = avisoTravado() +
    '<div class="sec-h"><h2>Contas</h2><span class="tiny dim2">' + estado.contas.length + '</span></div>' +
    (estado.contas.length
      ? estado.contas.map(c => '<div class="row"><span class="nm">' + esc(c.nome) +
          '<br><span class="tiny dim2">' + esc(c.instituicao || c.tipo) + '</span></span>' +
          '<button class="btn mini ghost ed-conta" data-id="' + c.id + '">editar</button></div>').join("")
      : '<div class="vazio">Nenhuma conta cadastrada.</div>') +
    '<div class="acoes"><button class="btn" id="add-conta">Nova conta</button></div>' +

    '<div class="sec-h"><h2>Categorias</h2><span class="tiny dim2">' + estado.categorias.length + '</span></div>';
  let g = "";
  for (const c of estado.categorias){
    if (c.grupo !== g){ g = c.grupo;
      h += '<div class="grupo"><span class="dot" style="background:' + (CORES_GRUPO[g]||"#5C6E88") + '"></span>' + esc(g) + '</div>'; }
    h += '<div class="row"><span class="nm">' + esc(c.nome) +
      (c.calculo !== "manual" ? ' <span class="tiny dim2">ƒ ' + (c.calculo === "pct_saldo" ? "% do saldo" : "crescimento") + '</span>' : "") +
      '</span><span class="vl tiny dim2">' + (c.tipo === "receita" ? "receita" : "saída") + '</span>' +
      '<button class="btn mini ghost ed-cat" data-id="' + c.id + '">editar</button></div>';
  }
  h += '<div class="acoes"><button class="btn" id="add-cat">Nova categoria</button></div>' +
    '<div class="sec-h"><h2>Conta de acesso</h2></div>' +
    '<div class="row"><span class="nm">' + esc(estado.email || "") + '</span></div>' +
    '<div class="acoes"><button class="btn ghost" id="exportar">Exportar dados</button>' +
    '<button class="btn ghost" id="sair">Sair</button></div>';
  el.innerHTML = h;

  document.getElementById("add-conta").onclick = () => folhaConta(null);
  document.getElementById("add-cat").onclick = () => folhaCategoria(null);
  el.querySelectorAll(".ed-conta").forEach(b =>
    b.onclick = () => folhaConta(estado.contas.find(c => c.id === b.dataset.id)));
  el.querySelectorAll(".ed-cat").forEach(b =>
    b.onclick = () => folhaCategoria(estado.categorias.find(c => c.id === b.dataset.id)));
  document.getElementById("exportar").onclick = exportar;
  document.getElementById("sair").onclick = () => { limparSessao(); location.reload(); };
}

function folhaCategoria(cat){
  const c = cat || { tipo:"despesa", grupo:"Outros", calculo:"manual" };
  const grupos = Object.keys(CORES_GRUPO);
  abrirFolha(
    "<h3>" + (cat ? "Editar categoria" : "Nova categoria") + "</h3>" +
    '<label class="f">Nome<input id="k-nome" value="' + esc(c.nome||"") + '"></label>' +
    '<div class="f2"><label class="f">Tipo<select id="k-tipo">' +
      '<option value="receita"' + (c.tipo==="receita"?" selected":"") + '>Receita</option>' +
      '<option value="despesa"' + (c.tipo==="despesa"?" selected":"") + '>Saída</option></select></label>' +
    '<label class="f">Grupo<select id="k-grupo">' +
      grupos.map(g => '<option' + (c.grupo===g?" selected":"") + '>' + esc(g) + '</option>').join("") +
    '</select></label></div>' +
    '<label class="f">Ordem<input id="k-ordem" inputmode="numeric" value="' + (c.ordem||99) + '"></label>' +
    '<div class="acoes"><button class="btn pri" id="ok">Salvar</button>' +
    '<button class="btn ghost" id="cancel">Cancelar</button></div>',
    () => {
      document.getElementById("cancel").onclick = fecharFolha;
      document.getElementById("ok").onclick = async () => {
        const nome = document.getElementById("k-nome").value.trim();
        if (!nome){ toast("Dê um nome à categoria"); return; }
        const linha = { nome:nome, tipo:document.getElementById("k-tipo").value,
          grupo:document.getElementById("k-grupo").value,
          ordem: parseNum(document.getElementById("k-ordem").value) || 99,
          calculo: c.calculo || "manual" };
        if (cat){
          await sbFetch("fin_categories?id=eq." + cat.id, { method:"PATCH", body: JSON.stringify(linha) });
          Object.assign(cat, linha);
          estado.categorias.sort((a,b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome));
        } else {
          const r = await salvar("fin_categories", linha, "user_id,nome");
          if (r && r[0]) estado.categorias.push(r[0]);
        }
        fecharFolha(); reprojetar(); render(); toast("Categoria salva");
      };
    });
}

function exportar(){
  const dados = { exportado: new Date().toISOString(), categorias: estado.categorias,
    contas: estado.contas, regras: estado.regras, plano: estado.plano,
    meses: estado.meses, balances: estado.balances, entries: estado.entries };
  const b = new Blob([JSON.stringify(dados, null, 1)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "financas-" + hojeISO() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- folha modal ----------
function abrirFolha(html, depois){
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("sheet-bg").classList.add("on");
  document.body.classList.add("nav-off");
  if (depois) depois();
}
function fecharFolha(){
  document.getElementById("sheet-bg").classList.remove("on");
  document.body.classList.remove("nav-off");
}
document.getElementById("sheet-bg").addEventListener("click", ev => {
  if (ev.target.id === "sheet-bg") fecharFolha();
});

document.querySelectorAll("nav button").forEach(b => b.onclick = () => irPara(b.dataset.tab));

// O cadastro esta DESLIGADO no painel do Supabase (so existe uma conta), entao
// nao ha caminho de signup aqui: ele so poderia falhar.
async function entrar(){
  const email = document.getElementById("lg-email").value.trim();
  const senha = document.getElementById("lg-senha").value;
  const erro = document.getElementById("lg-erro");
  erro.textContent = "";
  if (!email || !senha){ erro.textContent = "Informe e-mail e senha."; return; }
  try {
    const s = await authFetch("token?grant_type=password", { email, password: senha });
    if (!s.access_token){ erro.textContent = "Não foi possível entrar."; return; }
    guardarSessao(s);
    await iniciar();
  } catch (e){
    erro.textContent = /fetch|network|Failed/i.test(e.message)
      ? "Sem conexão com o servidor."
      : "E-mail ou senha não conferem.";
  }
}
document.getElementById("lg-entrar").onclick = () => entrar(false);
document.getElementById("lg-senha").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });

async function iniciar(){
  let u;
  try {
    u = await (await fetch(SB_URL + "/auth/v1/user", {
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + tokenAtual() }
    })).json();
  } catch(e){ u = null; }
  if (!u || !u.id){
    if (!(await renovar())){ limparSessao(); return; }
    return iniciar();
  }
  estado.uid = u.id; estado.email = u.email;

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  try { await carregarTudo(); }
  catch (e){
    document.getElementById("s-resumo").innerHTML =
      '<div class="aviso">Não deu para carregar seus dados e não há cópia salva neste aparelho. Verifique a conexão e recarregue.</div>';
    return;
  }
  const hoje = compHoje();
  mesAtual = estado.competencias.includes(hoje) ? hoje
           : (estado.competencias[estado.competencias.length-1] || hoje);
  reprojetar();
  render();
}

// esconder a barra ao rolar -- limitador por relogio, NAO rAF
// (rAF nao dispara em aba de fundo nem no Browser pane)
let ultY = 0, ultT = 0;
window.addEventListener("scroll", () => {
  const t = Date.now();
  if (t - ultT < 120) return;
  ultT = t;
  const y = window.scrollY;
  if (Math.abs(y - ultY) > 24 && !document.getElementById("sheet-bg").classList.contains("on")){
    document.body.classList.toggle("nav-off", y > ultY && y > 120);
    ultY = y;
  }
}, { passive:true });

if (tokenAtual()) iniciar();

if ("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
